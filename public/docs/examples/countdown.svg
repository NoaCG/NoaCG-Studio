<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG docs example - COUNTDOWN. Imports as a Countdown.
     The one clock-shaped text layer (05:00) is the clock. Time bar, Warning, Paused and Time up
     are optional drawn moments, and the hidden ones are groups.
     Full-frame 1920x1080 artboard, transparent background. See https://noacg.studio/docs#countdowns -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .title { font-family: Space Grotesk; font-weight: 700; }
      .label { font-family: Inter; font-weight: 700; letter-spacing: 8px; }
      .clock { font-family: JetBrains Mono; font-weight: 500; }
      .badge { font-family: Inter; font-weight: 800; letter-spacing: 3px; }
    </style>
  </defs>

  <g id="Card" data-name="Card">
    <rect x="560" y="300" width="800" height="480" fill="#0d1017" opacity="0.96"/>
    <rect x="560" y="300" width="800" height="8" fill="#f6a623"/>
    <rect x="660" y="690" width="600" height="10" fill="#1e2530"/>
  </g>

  <!-- Drains from full to empty as the clock runs. -->
  <rect id="Time_bar" data-name="Time bar" x="660" y="690" width="600" height="10" fill="#f6a623"/>

  <g id="Warning" data-name="Warning" display="none">
    <rect x="563" y="303" width="794" height="474" fill="none" stroke="#b3372e" stroke-width="6"/>
  </g>
  <g id="Paused" data-name="Paused" display="none">
    <rect x="880" y="718" width="160" height="40" rx="20" fill="#1e2530"/>
    <text class="badge" x="960" y="745" font-size="16" fill="#e8edf2" text-anchor="middle">PAUSED</text>
  </g>

  <text id="Show_title" data-name="Show title" class="title" x="960" y="400" font-size="48" fill="#ffffff" text-anchor="middle">NIGHT SIGNAL</text>
  <text id="static_x3A_Status" data-name="static:Status" class="label" x="960" y="460" font-size="22" fill="#b7bcc4" text-anchor="middle">STARTING IN</text>
  <text id="Countdown" data-name="Countdown" class="clock" x="960" y="630" font-size="140" fill="#f6a623" text-anchor="middle">05:00</text>

  <!-- Drawn over the clock when it reaches zero. -->
  <g id="Time_up" data-name="Time up" display="none">
    <rect x="600" y="500" width="720" height="170" fill="#0d1017"/>
    <text class="title" x="960" y="610" font-size="76" fill="#f6a623" text-anchor="middle">STARTING NOW</text>
  </g>
</svg>
