<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Score and clock</title>
  <desc>Editable NoaCG SVG source with a score tracker and a separately chosen clock. Two live scores, two team names and Clock reading 12:00; hidden Flash groups show on score changes.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="400" y="64" width="1120" height="112" fill="#101923"/>
    <rect id="Team_box_1" x="408" y="72" width="300" height="96" fill="#1d2b53"/>
    <rect id="Score_box_1" x="716" y="72" width="104" height="96" fill="#ffcc00"/>
    <rect id="Middle" x="828" y="72" width="8" height="96" fill="#1d2b53"/>
    <rect id="Score_box_2" x="844" y="72" width="104" height="96" fill="#ffcc00"/>
    <rect id="Team_box_2" x="956" y="72" width="300" height="96" fill="#1d2b53"/>
    <rect id="Clock_box" x="1264" y="72" width="248" height="96" fill="#1d2b53"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="Flash_1" style="display:none"><rect x="408" y="184" width="300" height="8" fill="#ffcc00"/></g>
    <g id="Flash_2" style="display:none"><rect x="956" y="184" width="300" height="8" fill="#ffcc00"/></g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Oswald, sans-serif" font-weight="600">
    <text id="Team_1" x="558" y="137" text-anchor="middle" font-size="44" fill="#ffffff">HOME</text>
    <text id="Score_1" x="768" y="143" text-anchor="middle" font-size="62" fill="#101923">0</text>
    <text id="Score_2" x="896" y="143" text-anchor="middle" font-size="62" fill="#101923">0</text>
    <text id="Team_2" x="1106" y="137" text-anchor="middle" font-size="44" fill="#ffffff">AWAY</text>
    <text id="Clock" x="1388" y="143" text-anchor="middle" font-size="62" fill="#ffffff" style="font-variant-numeric: tabular-nums">12:00</text>
  </g>
</svg>
