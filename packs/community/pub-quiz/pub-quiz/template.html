<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pub Quiz</title>
  <script src="js/gsap.min.js"></script>
  <link rel="stylesheet" href="css/template.css" />
  <script src="js/template.js"></script>
  <script id="spx-template-definition" type="text/javascript">
window.SPXGCTemplateDefinition = {
    "description": "Pub Quiz",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "7",
    "webplayout": "7",
    "out": "manual",
    "steps": "2",
    "dataformat": "json",
    "uicolor": "5",
    "DataFields": [
        { "field": "f0", "ftype": "textfield", "title": "Question", "value": "Which planet is known as the Red Planet?" },
        { "field": "f1", "ftype": "textfield", "title": "Answer A", "value": "Venus" },
        { "field": "f2", "ftype": "textfield", "title": "Answer B", "value": "Mars" },
        { "field": "f3", "ftype": "textfield", "title": "Answer C", "value": "Jupiter" },
        { "field": "f4", "ftype": "textfield", "title": "Answer D", "value": "Saturn" },
        { "field": "f5", "ftype": "dropdown", "title": "Correct answer", "value": "B",
          "items": [ { "text": "A", "value": "A" }, { "text": "B", "value": "B" }, { "text": "C", "value": "C" }, { "text": "D", "value": "D" } ] },
        { "field": "f6", "ftype": "number", "title": "Round", "value": "1" },
        { "field": "f7", "ftype": "number", "title": "Question number", "value": "1" },
        { "field": "f8", "ftype": "hidden", "title": "Timer seconds", "value": "30" },
        { "field": "f9", "ftype": "hidden", "title": "Word for Round", "value": "ROUND" },
        { "field": "f10", "ftype": "hidden", "title": "Word for Question", "value": "QUESTION" },
        { "field": "f11", "ftype": "hidden", "title": "Word for time up", "value": "TIME'S UP" }
    ]
};
</script>
  <script src="js/flex-gap-shim.js"></script>
  <meta name="noacg-project-format" content="width=1920;height=1080;fps=25" />
</head>
<body>
  <div class="quiz">
    <div class="quiz-box">
      <div class="quiz-accent"><span class="quiz-accent-a"></span><span class="quiz-accent-b"></span><span class="quiz-accent-c"></span><span class="quiz-accent-d"></span></div>
      <div class="quiz-header">
        <div class="quiz-chip quiz-chip-round">
          <span class="quiz-chip-word quiz-round-word">ROUND</span>
          <div class="quiz-mask quiz-num-mask"><span id="f6" class="quiz-num">1</span></div>
        </div>
        <div class="quiz-chip quiz-chip-qnum">
          <span class="quiz-chip-word quiz-qnum-word">QUESTION</span>
          <div class="quiz-mask quiz-num-mask"><span id="f7" class="quiz-num">1</span></div>
        </div>
        <div class="quiz-timer"><span class="quiz-timer-num">30</span><span class="quiz-timer-word">TIME'S UP</span></div>
      </div>
      <div class="quiz-timebar"><div class="quiz-timebar-fill"></div></div>
      <div class="quiz-mask quiz-question-mask"><span id="f0" class="quiz-question">Which planet is known as the Red Planet?</span></div>
      <div class="quiz-options">
        <div class="quiz-option quiz-option-1"><span class="quiz-letter">A</span><div class="quiz-mask quiz-answer-mask"><span id="f1" class="quiz-text">Venus</span></div></div>
        <div class="quiz-option quiz-option-2"><span class="quiz-letter">B</span><div class="quiz-mask quiz-answer-mask"><span id="f2" class="quiz-text">Mars</span></div></div>
        <div class="quiz-option quiz-option-3"><span class="quiz-letter">C</span><div class="quiz-mask quiz-answer-mask"><span id="f3" class="quiz-text">Jupiter</span></div></div>
        <div class="quiz-option quiz-option-4"><span class="quiz-letter">D</span><div class="quiz-mask quiz-answer-mask"><span id="f4" class="quiz-text">Saturn</span></div></div>
      </div>
    </div>
    <div id="f5" class="noacg-data-source">B</div>
    <div id="f8" class="noacg-data-source">30</div>
    <div id="f9" class="noacg-data-source">ROUND</div>
    <div id="f10" class="noacg-data-source">QUESTION</div>
    <div id="f11" class="noacg-data-source">TIME'S UP</div>
  </div>
</body>
</html>
