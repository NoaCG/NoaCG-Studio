  // here, so a count can never put an unapproved sentence on air.

    "description": "Election - ticker",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "40",
    "webplayout": "40",
    "out": "manual",
    "DataFields": [
      { "field": "f0", "ftype": "textarea", "title": "Headlines", "value": "Polls have closed across the country\nAdvance votes are counted first\nCounts shown here are synthetic rehearsal data" },
      { "field": "f1", "ftype": "textfield", "title": "Label", "value": "Election 2027" }
    ]
  };
</script>
