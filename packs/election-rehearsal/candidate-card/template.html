<script>
  // SPX template definition - one field per element id (fN convention). With a live candidate
  // every mapped field comes from one record of the results collection (name, affiliation,
  // votes, status, portrait, colour); the vote label is editorial.
  window.SPXGCTemplateDefinition = {
    "description": "Election - candidate card",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "20",
    "webplayout": "20",
    "out": "manual",
    "DataFields": [
      { "field": "f0", "ftype": "textfield", "title": "Candidate", "value": "Aino Example" },
      { "field": "f1", "ftype": "textfield", "title": "Party and district", "value": "National Coalition · Uusimaa" },
      { "field": "f2", "ftype": "textfield", "title": "Votes", "value": "" },
      { "field": "f3", "ftype": "textfield", "title": "Status", "value": "" },
      { "field": "f4", "ftype": "filelist", "title": "Portrait", "value": "", "assetfolder": "./images/", "extension": "png,jpg,webp,svg" },
      { "field": "f5", "ftype": "color", "title": "Party colour", "value": "#2F6FD6" },
      { "field": "f6", "ftype": "textfield", "title": "Votes label", "value": "Votes" }
    ]
  };
</script>

<!-- Candidate card: a lower third whose portrait, name and figures are one person. -->
<div class="cc-root" id="cc-root">
  <div class="cc-card">
    <div class="cc-portrait">
      <img class="cc-placeholder" src="images/portrait.svg" alt="" />
      <img class="cc-photo" id="f4" alt="" />
    </div>
    <div class="cc-body">
      <div class="cc-rule" id="f5" data-color="#2F6FD6"></div>
      <div class="cc-name" id="f0">Aino Example</div>
      <div class="cc-sub" id="f1">National Coalition · Uusimaa</div>
    </div>
    <div class="cc-figure">
      <div class="cc-label" id="f6">Votes</div>
      <div class="cc-votes" id="f2"></div>
      <div class="cc-status" id="f3"></div>
    </div>
  </div>
</div>
