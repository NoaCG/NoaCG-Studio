<!DOCTYPE html>
<!--
  WHAT'S NEW (/whats-new): the biggest changes, about twice a week, grouped by topic.

  The updates are NOT written here. Each is a note in docs/whats-new/<YYYY-MM-DD>.md, and the
  build puts them in place of the marker below, newest first (the generated-pages plugin in
  vite.config.ts, through scripts/whats-new.mjs). The same script refuses a note that reads like
  a pull request list, names internal things, or runs long, so a bad note fails the build instead
  of reaching this page. How to write one: docs/whats-new/README.md.

  Static and complete with no JavaScript. The header and footer are the site's
  (scripts/site-nav.mjs, src/site-chrome.css) and the type is the docs stylesheet's, so this page,
  /roadmap, /docs and /downloads read as one site.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's new - NoaCG Studio</title>
  <meta name="description" content="The biggest changes in NoaCG Studio, about twice a week: playout and NoaCG Bridge, the editor and templates, and AI workflows." />
  <meta name="theme-color" content="#0a0c10" />
  <link rel="canonical" href="https://noacg.studio/whats-new" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <meta property="og:title" content="What's new in NoaCG Studio" />
  <meta property="og:description" content="The biggest changes, about twice a week, grouped by topic." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://noacg.studio/whats-new" />
  <link rel="stylesheet" href="/src/site-chrome.css" />
  <link rel="stylesheet" href="/src/docs/docs.css" />
  <link rel="stylesheet" href="/src/landing/updates.css" />
</head>
<body>
  <div class="wrap">
    <!--site:header-->

    <div class="doc-hero">
      <p class="kicker">What's new</p>
      <h1>What changed in NoaCG</h1>
      <p class="lede">
        The biggest changes, about twice a week, grouped by topic. Smaller fixes land every day
        and are not listed here. For where NoaCG is going, see the <a href="/roadmap">roadmap</a>.
      </p>
    </div>

    <main class="wn-list" data-testid="whats-new-updates">
<!--whats-new:updates-->
    </main>

    <!--site:footer-->
  </div>
</body>
</html>
