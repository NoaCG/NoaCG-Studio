<!DOCTYPE html>
<!--
  THE TEMPLATE LIBRARY PAGE (/svg-templates): every SVG template, grouped into packages by use,
  each with its previews and its own SVG download, each package's zip beside its heading and the
  whole library's zip at the top.

  Nothing in the list is written by hand: the build puts the packages in place of the marker below
  from the one inventory (scripts/svg-files.mjs, through the generated-pages plugin in
  vite.config.ts). /downloads has one card that links here; the docs link here instead of listing
  the files. Static and complete with no JavaScript.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Library - NoaCG Studio</title>
  <meta name="description" content="The NoaCG Template Library: free SVG templates for NoaCG Studio. Preview each graphic, download the SVG you need, edit it in Illustrator or Inkscape and import it." />
  <meta name="theme-color" content="#0a0c10" />
  <link rel="canonical" href="https://noacg.studio/svg-templates" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
  <meta property="og:title" content="NoaCG Template Library" />
  <meta property="og:description" content="Preview and download SVG templates for NoaCG Studio." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://noacg.studio/svg-templates" />
  <link rel="stylesheet" href="/src/site-chrome.css" />
  <link rel="stylesheet" href="/src/docs/docs.css" />
  <link rel="stylesheet" href="/src/downloads/svg-files.css" />
</head>
<body>
  <div class="wrap">
    <!--site:header-->

    <div class="doc-hero">
      <p class="kicker">Template Library</p>
      <h1>Start from an SVG template</h1>
      <p class="lede">
        Download one, edit it in Illustrator or Inkscape, save it as SVG and import it into NoaCG.
        Each template works with the feature it was made for.
        <a href="/docs#svg-layers">How to name the layers</a>
      </p>
    </div>

    <main class="svg-files" data-testid="svg-files">
<!--svg-files:gallery-->
    </main>

    <!--site:footer-->
  </div>
</body>
</html>
