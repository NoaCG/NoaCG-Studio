# FEEDBACK REACHES THE OWNER - a nightly digest to the contact address, not a page to visit.
#
# The owner's ruling, 2026-08-26: "I will not remember to go to the admin page." /admin has had a
# real feedback inbox since migration 0028 (now retired; docs/ADMIN.md §10), which only worked for somebody who
# opens it. Feedback a person bothered to write and nobody reads is worse than no feedback button
# at all, because the button teaches users that telling us something is pointless.
#
# So this reads yesterday's rows and mails them. Triage is now a private operator session - a write
# path; this job only changes what the owner knows.
#
# PARKED, 2026-08-27, AND DELIBERATELY LEFT SCHEDULED. Wiring the Gmail app password is time the
# owner does not have, so the standing reminder moved into Claude Code instead: a WEEKLY routine
# (docs/ROUTINES.md) runs `npm run feedback:count` against the local .env and reports the numbers
# in chat. This job stays here because it costs nothing while inert and turns on the day somebody
# sets the four secrets - deleting it would only mean writing it again.
#
# INERT UNTIL THE SECRETS EXIST, AND NEVER RED FOR THEIR ABSENCE. The four secrets are created by
# hand once (docs/ROUTINES.md, "The parked mail digest"). Until then the job checks, says so with
# a notice and exits green. A repository that goes red every night for a configuration step nobody
# has taken yet is a repository whose owner stops reading red, and this repo already pays for
# every alarm it fires (docs/VERIFICATION.md, "What a red run means").
#
# THE REPOSITORY IS PUBLIC AND SO IS THIS LOG. `user_feedback.message` is somebody's own words.
# The script prints counts and nothing else on a real run; the only rendered digest that ever
# reaches a log comes from `--dry-run`, which reads made-up fixture rows out of the script file
# and opens no socket at all. Both properties are asserted in scripts/feedback-digest.test.mjs,
# which runs in `npm run build`.
#
# The service key is a SECRET, never a literal here, and it is used for one GET.

name: feedback-digest

on:
  schedule:
    # 06:40 UTC. After the nightly (02:00) and the configured suite (01:10), so a delayed run of
    # either does not queue behind this one, and early enough to be the first thing read.
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render fixture rows to the log instead of reading or sending anything
        type: boolean
        default: false

permissions:
  contents: read # a reader, and it does not even need the repository beyond checking it out

concurrency:
  group: feedback-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Mail yesterday's feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`. The script imports node:tls and nothing else, so installing the repo's
      # devDependencies would buy a slower job and a wider supply chain for a file that uses
      # neither.

      - name: Is it configured?
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEEDBACK_DIGEST_SMTP_USER: ${{ secrets.FEEDBACK_DIGEST_SMTP_USER }}
          FEEDBACK_DIGEST_SMTP_PASS: ${{ secrets.FEEDBACK_DIGEST_SMTP_PASS }}
        run: |
          set -euo pipefail
          MISSING=""
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY FEEDBACK_DIGEST_SMTP_USER FEEDBACK_DIGEST_SMTP_PASS; do
            # Only whether it is EMPTY. The value itself is never echoed, compared in a log, or
            # written to an output.
            if [ -z "${!name:-}" ]; then MISSING="${MISSING} ${name}"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${MISSING# }" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # THE SHAPE, PROVABLE WITHOUT A DATABASE. Fixture rows, rendered to the log, so the digest
      # can be reviewed and changed before a single real note exists.
      - name: Show the digest shape (fixtures)
        if: ${{ inputs.dry_run || steps.config.outputs.ready == 'false' }}
        run: node scripts/feedback-digest.mjs --dry-run

      - name: Say why nothing was sent
        if: ${{ steps.config.outputs.ready == 'false' && !inputs.dry_run }}
        run: |
          echo "::notice title=Feedback digest is inert::Missing secrets: ${{ steps.config.outputs.missing }}. The shape above is fixtures. See docs/ROUTINES.md for the steps that turn this on."

      - name: Read the feedback and mail it
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEEDBACK_DIGEST_SMTP_USER: ${{ secrets.FEEDBACK_DIGEST_SMTP_USER }}
          FEEDBACK_DIGEST_SMTP_PASS: ${{ secrets.FEEDBACK_DIGEST_SMTP_PASS }}
          FEEDBACK_DIGEST_TO: ${{ secrets.FEEDBACK_DIGEST_TO }}
          NOACG_APP_URL: ${{ vars.NOACG_APP_URL }}
        run: node scripts/feedback-digest.mjs
