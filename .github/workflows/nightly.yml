# NIGHTLY FULL SWEEP — the exhaustive tier.
#
# ci.yml answers "did THIS change break something" in minutes, by running only the specs that
# cover the change. That trade is only honest if something still runs everything, regularly,
# and says so loudly when it goes red. This is that something.
#
# It also runs the four catalog-wide gates that no automation has ever run: the calibration
# tripwire, the type-floor and overflow sweeps, and the field-coverage gate. All of them were
# documented as "run them by hand after a catalog change", which in practice meant they ran
# when somebody remembered. A gate nobody is scheduled to run is not a gate.
#
# Timed to finish before the start of the day, which means scheduling against GitHub's delay
# rather than against the wall clock. A scheduled event here is created 1-3.5 hours after its
# cron minute and never catches up: measured 2026-08-07 over the three scheduled workflows in
# this repo, `0 2` fired between 04:21 and 05:35 UTC on eight consecutive nights, and the other
# two are just as late on off-peak minutes (deploy-verify 1h15m-2h22m, nightly-drift up to
# 5h59m). So the minute is not the lever - the hour is, and it has to be early enough that even
# the long tail lands before morning.
#
# 00:20 UTC is 03:20 in Helsinki: after the usual landing window (merges here cluster 21:00-
# 00:00 UTC), and late enough that the delay pushes the real start to roughly 01:30-04:00 UTC,
# i.e. 04:30-07:00 local. The delay costs nothing in coverage - a schedule event checks out the
# default branch as of the moment it is created, not its cron minute, so a late event tests
# MORE of the night's work, not less.

name: nightly

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch: {}

# One nightly at a time. A manual run while the scheduled one is in flight should queue behind
# it, not race it for the dev-server ports.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # the verdict job files/closes the rolling issue

jobs:
  e2e:
    name: Nightly E2E ${{ matrix.shardIndex }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      # No spec filter: this tier is the whole suite, by definition.
      - name: E2E shard
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/8

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  catalog:
    name: Catalog calibration tripwire
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      # Cheap, and it fails first when it fails: the emitted-code fingerprints, the hidden-data
      # -holder rule and the name collisions over the whole catalog, in about three seconds.
      - name: Catalog emit fingerprints
        run: npm run check:catalog-emit

      - name: Catalog calibration tripwire
        run: npm run test:e2e:catalog

  catalog-gates:
    name: Type floor, overflow sweep and field coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      # All three gates render every catalog variant against a live dev server, so they need one -
      # the same shape as ci.yml's factory job, trap and readiness poll included.
      - name: Catalog quality gates
        run: |
          npm run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          PORT="$(node scripts/dev-port.mjs)"
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/app" > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Dev server did not become ready on port ${PORT}" >&2
            exit 1
          fi
          # Run all of them even if an earlier one fails, so one night reports every catalog fault
          # rather than only the earliest one. They answer different questions: type-floor is
          # about SIZE, overflow-sweep about the BOX, field-coverage about whether an operator
          # can reach the words at all, numerals about whether a graphic holds still while its
          # numbers change, and engine-floor about whether the PLAYOUT BROWSER can render it —
          # at SUPPORTED_FLOOR (Chromium 117, CasparCG 2.4), the oldest server we promise to
          # work on. That last one is a real gate now rather than a report: the catalogue clears
          # 117 today, and the features above it (relative colour 119, the unprefixed mask
          # shorthand 120, light-dark 123) drop silently on air, so nothing else would catch a
          # new template reaching for one.
          status=0
          node scripts/type-floor.mjs || status=1
          node scripts/overflow-sweep.mjs --baseline || status=1
          node scripts/field-coverage.mjs || status=1
          node scripts/numerals.mjs || status=1
          node scripts/engine-floor.mjs --fail || status=1
          exit "$status"

  report:
    name: Combined nightly report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: nightly-blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: |
          npx playwright merge-reports --reporter=html ./all-blob-reports
          npx playwright merge-reports --reporter=json ./all-blob-reports > nightly-report.json

      # The nightly is the only run whose aggregate is comparable night to night - every other
      # run tests a subset - so the time budget lives here and nowhere else. It enforces the
      # MEAN per test, never the total: a pack shipping a spec should not fail a gate, while
      # tests getting slower should.
      - name: E2E time budget
        run: node scripts/e2e-budget.mjs nightly-report.json

      # Classify failures focus-vs-paused for the verdict job (docs/GOALS_ARCHIVE.md "Student
      # release"). Runs even when shards failed - a red night is exactly when the triage
      # matters - and never fails the job itself: the script degrades to an honest note.
      - name: Triage failures (sprint focus vs paused areas)
        if: ${{ !cancelled() }}
        run: node scripts/nightly-triage.mjs nightly-report.json > nightly-triage.md

      - name: Upload triage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-triage
          path: |
            nightly-triage.md
            nightly-triage.json
          retention-days: 14
          if-no-files-found: ignore

      # `!cancelled()`, NOT the default. The step above this pair is the time budget, and a failed
      # step skips every later step in the job - so on the one night the report is worth having,
      # the night the budget went red, neither of these was uploaded and the run left nothing but
      # its own log. Triaging 2026-09-07 meant reading a ten-row table out of the log and being
      # unable to say which of the other 130 spec files had moved.
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

      # The JSON the budget itself reads. The HTML report beside it is for a person; this is the
      # one a script can diff against another night, which is what a "tests got slower" verdict
      # actually needs - per spec file, not the ten slowest. Merging the eight shard blobs by hand
      # is the alternative, and it is why the comparison did not get done for a day.
      - name: Upload the merged JSON report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-report-json
          path: nightly-report.json
          retention-days: 14
          if-no-files-found: error

  verdict:
    name: Nightly verdict
    if: ${{ !cancelled() }}
    needs: [e2e, catalog, catalog-gates, report]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The issue body names the commits in the window; that needs real history.
          fetch-depth: 0

      - name: Collect the verdict
        id: verdict
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
          GATES_RESULT: ${{ needs.catalog-gates.result }}
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          failed=""
          [ "$E2E_RESULT" = "success" ] || failed="${failed}- Full E2E suite: ${E2E_RESULT}\n"
          [ "$CATALOG_RESULT" = "success" ] || failed="${failed}- Catalog calibration tripwire: ${CATALOG_RESULT}\n"
          [ "$GATES_RESULT" = "success" ] || failed="${failed}- Type floor / overflow sweep: ${GATES_RESULT}\n"
          # This job also carries the time budget, so name both - a reader who sees only
          # "report failed" would go looking for a broken merge rather than a slower suite.
          [ "$REPORT_RESULT" = "success" ] || failed="${failed}- Combined report / E2E time budget: ${REPORT_RESULT}\n"
          if [ -z "$failed" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            printf 'failed<<EOF\n%b\nEOF\n' "$failed" >> "$GITHUB_OUTPUT"
          fi

      # The window between the last green nightly and this one IS the suspect list. Without it
      # a red nightly says only "one of today's merges", which is the bisect cost that makes
      # people distrust a nightly tier in the first place.
      - name: Name the commits in the window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          LAST_GREEN="$(gh run list --workflow=nightly.yml --status=success --limit 1 --json headSha,databaseId \
            --jq "[.[] | select(.databaseId != ${RUN_ID})][0].headSha")"
          if [ -n "$LAST_GREEN" ] && git cat-file -e "${LAST_GREEN}^{commit}" 2>/dev/null; then
            LOG="$(git log --oneline "${LAST_GREEN}..HEAD" | head -50)"
            [ -n "$LOG" ] || LOG="(no new commits since the last green nightly)"
          else
            LOG="(no previous green nightly to compare against - suspect list unavailable)"
          fi
          printf 'commits<<EOF\n%s\nEOF\n' "$LOG" >> "$GITHUB_OUTPUT"

      # The per-spec triage from the report job (focus vs paused areas + the failure-set
      # hash). Absent when the report job died before merging - the verdict still files, just
      # without classification.
      - name: Download triage
        if: ${{ steps.verdict.outputs.green == 'false' }}
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: nightly-triage
          path: nightly-triage

      # The rolling-issue pattern every alarm here follows (docs/DEPLOYMENT.md): one open issue,
      # one comment per newly red night, closed by the next green. Sprint amendment
      # (docs/GOALS_ARCHIVE.md "Student release"): when the triage shows ZERO focus failures and the
      # failure SET is byte-identical to the one already reported (the hash marker in the last
      # comment), post nothing - paused-area drift is reported once per CHANGE of drift, never
      # once per night. Any focus failure always posts.
      #
      # BRANCH-GUARDED, both steps, the same as configured-suite.yml since 2026-08-24: this alarm
      # is a statement about MAIN, so a workflow_dispatch from a branch being debugged must be able
      # to neither raise nor withdraw it (docs/CI_STABILITY.md class 6 - the shape that put seven
      # identical comments on issue #38). A schedule run's ref IS main; the event test says so
      # explicitly rather than depending on it.
      - name: File / update the nightly issue
        if: ${{ steps.verdict.outputs.green == 'false' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ steps.verdict.outputs.failed }}
          COMMITS: ${{ steps.window.outputs.commits }}
        run: |
          TITLE="Nightly full test suite is red"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TRIAGE=""
          [ -f nightly-triage/nightly-triage.md ] && TRIAGE="$(cat nightly-triage/nightly-triage.md)"
          BODY="$(printf 'Nightly at %s failed.\n\n**What failed**\n%s\n%s\n\n**Commits since the last green nightly**\n```\n%s\n```\n\nRun: %s' \
            "${{ github.sha }}" "$FAILED" "$TRIAGE" "$COMMITS" "$RUN_URL")"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ] && [ -f nightly-triage/nightly-triage.json ]; then
            HASH="$(jq -r '.hash' nightly-triage/nightly-triage.json)"
            FOCUS_FAILED="$(jq -r '.focusFailed | length' nightly-triage/nightly-triage.json)"
            LAST="$(gh issue view "$EXISTING" --json comments,body --jq '(.comments | map(.body) | last) // .body')"
            if [ "$FOCUS_FAILED" = "0" ] && printf '%s' "$LAST" | grep -q "nightly-failure-set: $HASH"; then
              echo "Same paused-area failure set already reported ($HASH) and no focus failures - not commenting."
              exit 0
            fi
          fi
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "Still red. $BODY"
          fi

      - name: Close the nightly issue
        if: ${{ steps.verdict.outputs.green == 'true' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Nightly full test suite is red"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Nightly green again at ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Fail the run when the sweep was red
        if: ${{ steps.verdict.outputs.green == 'false' }}
        run: |
          echo "::error title=Nightly::The nightly sweep failed - see the rolling issue for the suspect commits."
          exit 1
