name: Inspect issue 1574 metadata (disposable)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: '39812016809'
          github-token: ${{ github.token }}
          name: hosted-results-4
          path: evidence
      - name: Read only allowlisted trace diagnostics (no trace content)
        shell: python
        run: |
          import pathlib,zipfile,json,re,collections
          from urllib.parse import urlsplit
          verbs={'play','stop','update','cue','next','snap','event'}
          paths={'control_shows','control_tail','control_show_by_slug','control_show_resolve','control_send_many','control_send_seq','control_report','token','user','documents','team_productions','teams'}
          def body(z,obj):
            sha=obj.get('_sha1'); text=obj.get('text','')
            if sha: text=z.read('resources/'+sha).decode(errors='replace')
            try: return json.loads(text)
            except: return None
          def summarize(v):
            if isinstance(v,list):
              return {'rows':len(v),'verbs':dict(collections.Counter(x.get('msg',{}).get('t') for x in v if isinstance(x,dict) and x.get('msg',{}).get('t') in verbs))}
            if isinstance(v,dict):
              return {'has_access_token':bool(v.get('access_token')),'has_error':bool(v.get('error') or v.get('message')),'statement_timeout':v.get('code')=='57014','invalid_credentials':v.get('error_code')=='invalid_credentials'}
            return {}
          def ui(v,seen):
            if not isinstance(v,list): return
            if len(v)>1 and isinstance(v[1],dict):
              a=v[1]; cls=a.get('class','')
              for label in ['auth-status','auth-error','auth-card','sync-status','auth-signin']:
                if label in cls and label not in seen: print('UI_PRESENT',label); seen.add(label)
            for c in v: ui(c,seen)
          for p in sorted(pathlib.Path('evidence').rglob('trace.zip')):
            spec='publish-guard' if 'publish-guard' in str(p) else 'relay-cold-boot' if 'relay-cold-boot' in str(p) else None
            if not spec: continue
            print('TRACE',spec,'retry' if 'retry' in str(p) else 'first')
            with zipfile.ZipFile(p) as z:
              seen=set()
              for n in z.namelist():
                if n.endswith('.network'):
                  for line in z.read(n).decode().splitlines():
                    s=json.loads(line).get('snapshot',{}); q=s.get('request',{}); r=s.get('response',{}); u=urlsplit(q.get('url','')); endpoint=u.path.split('/')[-1]
                    if endpoint not in paths or not (u.hostname or '').endswith('.supabase.co'): continue
                    print('HTTP',s.get('_monotonicTime'),q.get('method'),endpoint,round(s.get('time',0)),r.get('status'),'failed' if s.get('_failureText') else '',summarize(body(z,r.get('content',{}))))
                    if endpoint in ['control_send_many','control_send_seq']:
                      v=body(z,q.get('postData',{})) or {}; print('SEND',dict(collections.Counter(x.get('t') for x in v.get('p_msgs',[]) if isinstance(x,dict) and x.get('t') in verbs)))
                if n.endswith('.trace'):
                  for line in z.read(n).decode().splitlines():
                    e=json.loads(line)
                    if e.get('type')=='console':
                      t=e.get('text','')
                      for label in ['ERR_INSUFFICIENT_RESOURCES','Failed to fetch','LockAcquireTimeoutError','AbortError','Invalid login credentials']:
                        if label in t: print('KNOWN_ERROR',label)
                    if e.get('type')=='frame-snapshot': ui(e.get('snapshot',{}).get('html'),seen)
