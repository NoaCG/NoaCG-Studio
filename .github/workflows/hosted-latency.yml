name: hosted-latency historical trace diagnosis (disposable)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 39565846898
          github-token: ${{ github.token }}
          pattern: hosted-results-*
          path: evidence
      - name: Summarize historical failed-attempt traces without credentials or bodies
        shell: python
        run: |
          import collections, json, pathlib, re, zipfile
          from urllib.parse import urlsplit
          def endpoint(raw):
              u = urlsplit(raw)
              p = u.path
              if p.startswith('/control/') or p.startswith('/output/'):
                  p = '/' + p.split('/')[1] + '/<id>'
              return u.hostname, p
          for trace in sorted(pathlib.Path('evidence').rglob('trace.zip')):
              print('\nTRACE', trace.parent.name)
              with zipfile.ZipFile(trace) as z:
                  endpoints = collections.defaultdict(list)
                  failed, slow = [], []
                  for name in z.namelist():
                      if not name.endswith('.network'): continue
                      for line in z.read(name).decode().splitlines():
                          e = json.loads(line)
                          s = e.get('snapshot', {})
                          req, res = s.get('request', {}), s.get('response', {})
                          host, path = endpoint(req.get('url', ''))
                          if not host or host.endswith('googleapis.com') or host.endswith('gstatic.com'): continue
                          status = res.get('status', 0)
                          duration = round(s.get('time', 0))
                          key = (req.get('method'), host, path, status)
                          endpoints[key].append(duration)
                          if duration > 2000: slow.append((duration, key))
                          if status >= 400 or s.get('_failureText'):
                              failed.append((key, s.get('_failureText', '')))
                  for key, times in sorted(endpoints.items(), key=lambda kv: -max(kv[1]))[:24]:
                      print('NET', key, 'count', len(times), 'max_ms', max(times), 'total_ms', sum(times))
                  print('FAILURES', failed[-15:])
                  print('SLOW', sorted(slow, reverse=True)[:8])
                  for name in z.namelist():
                      if not name.endswith('.trace'): continue
                      for line in z.read(name).decode().splitlines():
                          e = json.loads(line)
                          if e.get('type') == 'after' and e.get('error'):
                              message = str(e['error'].get('message', '')).split('\n')[0]
                              message = re.sub(r'https?://\S+', '<url>', message)
                              print('ACTION_ERROR', message[:220])
