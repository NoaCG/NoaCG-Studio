name: hosted-latency targeted switch reproduction (disposable)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-latency
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: e2e-s4@noacg.staging
      E2E_PASSWORD: noacg-e2e-staging-pw
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - name: Refuse production and absent staging credentials
        shell: python
        run: |
          import os
          assert 'garafohbzmsybtysxphb.supabase.co' == __import__('urllib.parse', fromlist=['urlsplit']).urlsplit(os.environ['VITE_SUPABASE_URL']).hostname
          assert all(os.environ.get(k) for k in ['VITE_SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY'])
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/node-modules
      - uses: ./.github/actions/playwright-chromium
      - name: Reproduce the captured resolve-before-send race on only the switch spec
        shell: python
        run: |
          import pathlib, subprocess
          p = pathlib.Path('e2e/configured/playout-switch-mid-flight.spec.ts')
          s = p.read_text()
          needle = "test.skip(!haveCreds, 'E2E_EMAIL / E2E_PASSWORD unset - configured-mode spec');"
          assert needle in s
          fixture = """
          test.beforeEach(async ({ page }) => {
            await page.route('**/rest/v1/rpc/control_show_resolve', async route => {
              const response = await route.fetch();
              await new Promise(resolve => setTimeout(resolve, 5000));
              await route.fulfill({ response }).catch(() => {});
            });
          });
          """
          p.write_text(s.replace(needle, needle + '\n' + fixture))
          result = subprocess.run(['timeout', '300s', 'npm', 'run', 'test:e2e:live', '--', 'e2e/configured/playout-switch-mid-flight.spec.ts', '--trace=retain-on-failure'])
          raise SystemExit(result.returncode)
