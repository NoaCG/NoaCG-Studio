name: hosted-latency targeted switch reproduction (disposable)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
      inspect_traces:
        type: boolean
        default: false
      evidence_run:
        type: string
        default: '39565846898'
permissions:
  contents: read
concurrency:
  group: hosted-latency
  cancel-in-progress: false
jobs:
  reproduce:
    if: ${{ !inputs.inspect_traces }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: e2e-s4@noacg.staging
      E2E_PASSWORD: noacg-e2e-staging-pw
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - name: Refuse production and absent staging credentials
        shell: python
        run: |
          import os
          assert 'garafohbzmsybtysxphb.supabase.co' == __import__('urllib.parse', fromlist=['urlsplit']).urlsplit(os.environ['VITE_SUPABASE_URL']).hostname
          assert all(os.environ.get(k) for k in ['VITE_SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY'])
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/node-modules
      - uses: ./.github/actions/playwright-chromium
      - name: Reproduce the captured resolve-before-send race on only the switch spec
        shell: python
        run: |
          import pathlib, subprocess
          p = pathlib.Path('e2e/configured/playout-switch-mid-flight.spec.ts')
          s = p.read_text()
          needle = "test.skip(!haveCreds, 'E2E_EMAIL / E2E_PASSWORD unset - configured-mode spec');"
          assert needle in s
          fixture = """
          test.beforeEach(async ({ page }) => {
            await page.route('**/rest/v1/rpc/control_show_resolve', async route => {
              const response = await route.fetch();
              await new Promise(resolve => setTimeout(resolve, 5000));
              await route.fulfill({ response }).catch(() => {});
            });
          });
          """
          p.write_text(s.replace(needle, needle + '\n' + fixture))
          result = subprocess.run(['timeout', '300s', 'npm', 'run', 'test:e2e:live', '--', 'e2e/configured/playout-switch-mid-flight.spec.ts', '--trace=retain-on-failure'])
          raise SystemExit(result.returncode)
  inspect:
    if: ${{ inputs.inspect_traces }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          pattern: hosted-results-*
          path: evidence
      - name: Read failed UI state and browser errors from historical traces
        shell: python
        run: |
          import json, pathlib, re, zipfile
          from urllib.parse import urlsplit
          def scrub(text):
              text = re.sub(r'https?://\S+', '<url>', text)
              text = re.sub(r'eyJ[A-Za-z0-9_.-]+|sb_(?:secret|publishable)_[A-Za-z0-9_-]+', '<token>', text)
              text = re.sub(r'[\w.+-]+@[\w.-]+', '<email>', text)
              return text[:400]
          def leaves(v):
              if isinstance(v, str): return v
              if isinstance(v, list): return ' '.join(leaves(c) for c in v[2:])
              return ''
          def state(v):
              if not isinstance(v, list): return
              if len(v) > 1 and isinstance(v[1], dict):
                  cls = v[1].get('class', '')
                  if re.search('sync-status|auth-error|account-save-notice|pd-auto|panel-status', cls):
                      print('UI', cls, scrub(leaves(v)))
              for child in v: state(child)
          for trace in sorted(pathlib.Path('evidence').rglob('trace.zip')):
              print('\nTRACE', trace.parent.name)
              with zipfile.ZipFile(trace) as z:
                  seen = set()
                  timings = []
                  for name in z.namelist():
                      if not name.endswith('.network'): continue
                      for line in z.read(name).decode().splitlines():
                          s = json.loads(line).get('snapshot', {})
                          u = urlsplit(s.get('request', {}).get('url', ''))
                          if not (u.hostname or '').endswith('.supabase.co'): continue
                          code = s.get('response', {}).get('status', 0)
                          if code == 101: continue
                          timings.append((round(s.get('time', 0)), u.path, code, s.get('timings', {})))
                  print('SLOW_HTTP', sorted(timings, key=lambda row: row[0], reverse=True)[:6])
                  for name in z.namelist():
                      if not name.endswith('.trace'): continue
                      for line in z.read(name).decode().splitlines():
                          e = json.loads(line)
                          if e.get('type') == 'console' and e.get('messageType') in ['error', 'warning']:
                              msg = scrub(e.get('text', ''))
                              if msg not in seen: print('CONSOLE', msg); seen.add(msg)
                          if e.get('type') == 'frame-snapshot':
                              state(e.get('snapshot', {}).get('html'))
