# RED PULL REQUESTS NOBODY IS REPAIRING reach the owner alarm (cicd-followup cf22 fix 1).
#
# cf22 measured 72% of the time lost to bounced PRs as idle time after a failure, most of it in
# stretches where the PR had no repair owner or one with no PR wake. This check reads open PRs,
# their newest CI verdicts and their comments, and raises one owner alarm per failure that is
# unattended past its bound (scripts/repair-wake.mjs; rules in
# docs/work-specs/cicd-followup/evidence/cf22-fix-1-repair-wake.md).
#
# It runs main's code only: `workflow_run` and `schedule` run on the default branch, and nothing
# from the triggering run (its head, branch or title) is checked out or reaches a shell. It reads
# PRs and runs and writes only its alarm issue.
name: Repair wake

on:
  # After a failed CI run, so a failure that needs no grace (rule 6) alarms at once.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The bound runs out without an event, so a schedule notices it.
  schedule:
    - cron: '4,24,44 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Red PRs nobody is repairing
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One check at a time, for every trigger; a check is never cancelled part way through its
    # writes. On the job, not the workflow, so the skipped runs of green CI runs never displace a
    # waiting check (a newer waiting check may: it reads everything the older one would).
    concurrency:
      group: repair-wake
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # CI runs and their jobs
      pull-requests: read # open PRs
      issues: write # the alarm issue: open, update, comment, assign, close
    steps:
      # scripts/ alone: the check imports only the alarm helpers (a test runs it from such a copy).
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Raise or withdraw the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/repair-wake.mjs check --issue
