# NIGHTLY DRIFT - the belt against a SCHEDULED SWEEP THAT NEVER RUNS.
#
# Three schedules are watched here, from one matrixed job: nightly.yml, configured-suite.yml and
# catalog-gates.yml. One workflow because the question is identical - "did the thing that is
# supposed to happen on its own actually happen" - and because an alarm living inside any of them
# could not fire on the night that one did not run.
#
# A schedule with no watcher is the shape this exists to end, so adding one is a matrix entry
# rather than a decision (see the comment on `include`).
#
# nightly.yml alarms when the sweep goes RED. Nothing alarmed when it did not happen at all,
# and that is the more dangerous of the two: a red nightly files an issue, while an absent one
# looks exactly like a healthy night. This repo has already paid for that shape once - twenty
# production deploys failed while the repo stayed green, because nothing watched for the
# ABSENCE of a thing (docs/DEPLOYMENT.md). deploy-verify grew the same belt for deployments;
# this is the nightly's.
#
# It is a separate workflow on purpose. A check that lived inside nightly.yml could not fire
# when the nightly did not, and one bolted onto deploy-verify would tie "did last night's
# sweep happen" to a workflow about production deployments.
#
# A REPEAT SAYS NOTHING NEW, so it is not said twice. Both alarms below keep the RED - a green
# run while a schedule is dead is precisely the silence this workflow exists to prevent, and no
# amount of inbox tidiness is worth reintroducing it. What is withheld is the repeat COMMENT: a
# run whose finding is identical to the one already at the bottom of the issue adds nothing, and
# GitHub mails a person for every comment. This is the amendment nightly.yml and
# configured-suite.yml have both carried since 2026-08-25 ("Report a repeat of the same
# configured-suite failure only once"); nightly-drift was the one alarm in the repo that never
# received it, and it is the one that repeats fastest - twice a day, every day, for as long as
# the condition holds.
#
# The identity of a finding here is the LATEST value: the newest watched run the check could
# find, or the literal `none`. That is the whole state - if it has not moved, nothing about the
# world has changed since the last comment. The cutoff is deliberately NOT part of it, because
# the cutoff moves on every run and would make every repeat look new. A finding that HAS moved
# always posts, and a hard failure of any other kind was never in scope here: this workflow's
# only verdict is "did it happen".
#
# Measured 2026-08-25: 61 GitHub emails reached the owner over the preceding four days, 26 of
# them issue traffic. The classification is in docs/VERIFICATION.md, "What a red run means, and
# what actually emails".
#
# GitHub's own scheduling is why the window is generous. Scheduled runs are delayed under load
# - this repo has been observed running a 23:43 cron at 01:11 - and can be dropped entirely.
# A 26-hour window therefore tolerates several hours of ordinary drift on a daily schedule and
# only alarms when a whole night is genuinely missing. TWO check slots for the same reason:
# one dropped slot must not be able to hide a missing nightly.

name: nightly-drift

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # the failure step files/updates the rolling issue
  actions: read # the landing-coverage report reads the nightly's runs and their jobs

# Shared: every watched schedule is DAILY, so they all tolerate the same drift.
env:
  WINDOW_HOURS: '26'

jobs:
  # ONE JOB PER WATCHED SCHEDULE, from one implementation. The question is identical for every
  # entry - "did the thing that is supposed to happen on its own actually happen" - and it was
  # written out twice before catalog-gates.yml needed a third. The matrix is what keeps the three
  # alarms from drifting apart, which is the failure mode that matters here: an alarm nobody
  # noticed had stopped being maintained is the same silence it exists to break.
  #
  # Each entry carries what genuinely differs:
  #   workflow  the file to look for runs of
  #   events    `--event=schedule` where a manual dispatch must NOT close the alarm (see the
  #             configured-suite note below), empty where any run counts
  #   marker    the html comment that identifies a finding, so an OPEN issue keeps its dedup
  #             history across this refactor. Never change one without meaning to re-alarm.
  #   detail    the one paragraph that is about this workflow rather than about drift
  drift:
    # The WORKFLOW, not the prose label: a checks list wants to say which schedule is being
    # watched, and "Did the configured suite, on its schedule run?" is what the label reads like
    # when it is bent into a question.
    name: Schedule watch - ${{ matrix.workflow }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One dead schedule must not cancel the check on the other two.
      fail-fast: false
      matrix:
        include:
          # nightly.yml alarms when the sweep goes RED. Nothing alarmed when it did not happen at
          # all, and that is the more dangerous of the two: a red nightly files an issue, while an
          # absent one looks exactly like a healthy night.
          - label: the nightly sweep
            workflow: nightly.yml
            events: ''
            title: Nightly sweep has not run
            marker: nightly-drift-state
            schedule: '02:00 UTC'
            # The landing-coverage report below reads this workflow's runs (ci13).
            coverage: true
            detail: >-
              The whole exhaustive tier is what goes missing. What to check: Actions -> nightly ->
              whether the schedule is disabled (GitHub disables schedules on repos with 60 days of
              inactivity), and whether .github/workflows/nightly.yml is still on the default branch.

          # configured-suite.yml is the only nightly verdict for the authenticated surfaces the
          # 2026-09-12 production is judged on. Its cron landed on main on 2026-08-24 and, as of
          # 2026-08-25, had never once produced a run: all 16 of its runs were workflow_dispatch.
          #
          # SCHEDULE RUNS ONLY, and that filter is the whole point. Sixteen manual dispatches made
          # the suite look thoroughly exercised while the signal it is supposed to BE had never
          # fired, and dispatching it by hand is exactly what masked that for two days. A dispatch
          # proves the specs pass; it can never prove the schedule works.
          #
          # It also runs on every push to main now, and those runs are deliberately NOT counted
          # here for the same reason: a landing proves the specs, not the cron. The cron is what
          # covers a day with no landings on it.
          - label: the configured suite, on its schedule
            workflow: configured-suite.yml
            events: '--event=schedule'
            title: Configured suite is not running on its schedule
            marker: configured-schedule-state
            schedule: '01:10 UTC'
            detail: >-
              Without it the authenticated surfaces - including the four hosted-playout walks - have
              no scheduled verdict at all. What to check, cheapest first: `gh api
              repos/:owner/:repo/actions/workflows` and read this workflow state (a
              disabled_inactivity state ends it there); then that
              .github/workflows/configured-suite.yml is still on the default branch; then whether
              another run held the configured-suite concurrency group across the slot.

          # catalog-gates.yml landed on 2026-09-04 with an 11:50 UTC cron and its own admission
          # that nothing watched it. Its scheduled run is the only thing that measures what has
          # landed on main since the last green one, so a dead cron here means the catalog is
          # gated per-branch and never afterwards.
          #
          # SCHEDULE RUNS ONLY, again: its dispatch form takes an explicit `designs=` list, so a
          # manual run frequently measures one design and proves nothing about the sweep.
          #
          # EXPECT ONE ALARM THE MORNING AFTER IT LANDS. The cron has never fired, so the first
          # check inside the window finds nothing and says so - which is correct, and is exactly
          # the report wanted if GitHub never enables the schedule at all. It closes itself on the
          # first 11:50 slot that runs.
          - label: the catalog gates, on their schedule
            workflow: catalog-gates.yml
            events: '--event=schedule'
            title: Catalog gates are not running on their schedule
            marker: catalog-gates-schedule-state
            schedule: '11:50 UTC'
            detail: >-
              Without it nothing re-measures the catalog against what has landed on main since the
              last green run - the per-branch dispatch covers a branch and stops there. What to
              check: `gh api repos/:owner/:repo/actions/workflows` for a disabled state, then that
              .github/workflows/catalog-gates.yml is still on the default branch. The nightly
              remains the guaranteed tier for the catalog either way.
    env:
      ISSUE_TITLE: ${{ matrix.title }}
    steps:
      - name: Look for a run inside the window
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ matrix.workflow }}
          EVENTS: ${{ matrix.events }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "${WINDOW_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          # Any conclusion counts, whatever it is: a RED run files its own rolling issue and this
          # workflow must never double-report it. The question here is only "did it happen".
          # In-progress runs count too - a sweep that started IS a sweep.
          # shellcheck disable=SC2086  # EVENTS is either empty or one flag, and must not be quoted
          LATEST="$(gh run list --workflow="$WORKFLOW" $EVENTS --limit 30 --json createdAt \
            --jq 'if length == 0 then "" else (max_by(.createdAt).createdAt) end')"
          echo "cutoff=${CUTOFF}  latest=${LATEST:-<none>}"
          # ISO-8601 UTC sorts lexicographically, so a string compare is a time compare.
          if [ -n "$LATEST" ] && [ "$LATEST" \> "$CUTOFF" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=${LATEST:-none}" >> "$GITHUB_OUTPUT"
          echo "cutoff=${CUTOFF}" >> "$GITHUB_OUTPUT"

      # The rolling-issue pattern every alarm here follows (docs/DEPLOYMENT.md): one open
      # issue, one comment per newly failing check, closed by the next healthy state - with the
      # repeat amendment described at the top of this file.
      - name: File / update the missing-schedule issue
        if: ${{ steps.check.outputs.ok == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.check.outputs.latest }}
          CUTOFF: ${{ steps.check.outputs.cutoff }}
          LABEL: ${{ matrix.label }}
          SCHEDULED_AT: ${{ matrix.schedule }}
          DETAIL: ${{ matrix.detail }}
          MARKER_KEY: ${{ matrix.marker }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MARKER="${MARKER_KEY}: latest=${LATEST}"
          BODY="$(printf 'No run of %s since %s (window: last %s hours, cutoff %s).\n\nIt is scheduled at %s. GitHub delays scheduled runs under load and can drop them, so a single missed cycle is expected to close itself; a persistent one means the schedule is not firing.\n\n%s\n\nRun: %s\n\n<!-- %s -->' \
            "${LABEL}" "${LATEST}" "${WINDOW_HOURS}" "${CUTOFF}" "${SCHEDULED_AT}" "${DETAIL}" "$RUN_URL" "$MARKER")"
          EXISTING="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            exit 0
          fi
          # Withhold ONLY a repeat of the identical finding. `// .body` covers a freshly-created
          # issue that has no comments yet. The run still fails and the issue stays open.
          LAST="$(gh issue view "$EXISTING" --json comments,body --jq '(.comments | map(.body) | last) // .body')"
          if printf '%s' "$LAST" | grep -qF "$MARKER"; then
            echo "::notice title=Same finding already reported::${MARKER} is already the latest word on issue #${EXISTING}, so this run adds no comment. The run is still red."
            exit 0
          fi
          gh issue comment "$EXISTING" --body "Still missing. $BODY"

      - name: Close the missing-schedule issue
        if: ${{ steps.check.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.check.outputs.latest }}
          LABEL: ${{ matrix.label }}
        run: |
          EXISTING="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "${LABEL} ran at ${LATEST}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      # LANDING COVERAGE, the nightly entry only (cicd-improvement ci13). The check above asks
      # whether the nightly STARTED; this asks whether each landing has been cleared by a COMPLETE
      # green nightly at the commit that run requested, names the oldest landing still waiting, and
      # projects whether the next nightly will finish before that landing's 24-hour deadline (the
      # repair margin: a nightly dispatch on main before the deadline). A REPORT, not an alarm: it
      # writes the step summary and a warning, and a failure to read GitHub never turns this job red
      # or green. Today the full pre-merge catalog calibration in ci.yml is the catalog's
      # protection and nothing has been narrowed onto this bound; whether it ever becomes blocking
      # is decided with any activation (ci16), on the evidence in
      # docs/work-specs/cicd-improvement/evidence/phase-ci13.md. A step here rather than a job of
      # its own: it needs a checkout and node builtins only, seconds per run.
      - name: Check out history for the landing-coverage report
        if: ${{ !cancelled() && matrix.coverage }}
        continue-on-error: true
        # Inside the job's 5 minutes with room left for the failure step below.
        timeout-minutes: 1
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Landing coverage report
        if: ${{ !cancelled() && matrix.coverage }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/schedule-coverage.mjs --summary "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when the schedule is not firing
        if: ${{ steps.check.outputs.ok == 'false' }}
        run: |
          echo "::error title=Schedule drift::No run of ${{ matrix.label }} in the last ${WINDOW_HOURS} hours - see the rolling issue."
          exit 1
