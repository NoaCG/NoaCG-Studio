# Release NoaCG Bridge: build NoaCG-Bridge-<version>.exe and publish it as a GitHub Release.
#
# TWO PRODUCTS, TWO VERSION LINES (owner, 2026-10-24). NoaCG Bridge (connects NoaCG Playout to
# CasparCG or vMix, for the technical operator) and the NoaCG CLI (makes graphics from a coding
# agent, for the creator) are built from one package, cli/, and each has its own version:
#   - the NoaCG CLI: cli/package.json `version`, tag cli-vX.Y.Z -> npm, by release-cli.yml;
#   - NoaCG Bridge: cli/package.json `bridgeVersion`, tag bridge-vX.Y.Z -> a GitHub Release on
#     this repository carrying NoaCG-Bridge-<version>.exe, by THIS workflow.
# The Bridge's number moves only when the Bridge changes, so a CLI-only fix leaves it alone.
#
# "LATEST" IS RESOLVED PER PRODUCT. The Releases page carries Bridge releases only, and every one
# is created with `--latest`, so `releases/latest` is always the newest Bridge (the file name
# carries the version, so there is no fixed download URL) even though older `cli-v*` Releases from
# before the split still sit on the page. The public Downloads page (noacg.studio/downloads) goes
# one step further and asks the API for the newest `bridge-v*` release by tag, and npm for the
# CLI's `latest`, so neither product can ever be offered as the other.
#
# HOW TO RELEASE THE BRIDGE (docs/BRIDGE.md §6 is the prose):
#   1. Move `bridgeVersion` in cli/package.json and write that version's section at the top of
#      cli/BRIDGE_CHANGELOG.md, for the operator deciding whether to download again. The build
#      refuses one without the other (cli/scripts/release-notes.mjs --bridge --check). Changes not
#      ready to release can wait under an "## Unreleased" heading, which releases nothing.
#      Land it on main through /queue-merge.
#   2. That is all. Landing it releases it (owner, 2026-10-08): this workflow runs on the push to
#      main, and when `bridgeVersion` is a version the Releases page does not have yet, it builds
#      the exe on a Windows runner from that commit, proves it starts and answers /health with that
#      version, and creates the Release (and its bridge-vX.Y.Z tag) with the exe and its checksum.
#   Pushing a bridge-v* tag still re-drives a release by hand.
#
# The Actions tab's "Run workflow" button is a rehearsal by default: everything runs, and the exe
# is kept as a workflow artifact instead of a Release. Unticking dry_run publishes from the
# chosen commit, creating the tag, for when a tagged run needs re-driving.
name: Release NoaCG Bridge

on:
  # A new `bridgeVersion` with its notes landing on main is the release request; `decide` lets
  # every other change pass without releasing. A `bridge-v*` tag still re-drives a release by hand
  # (path filters do not apply to tag pushes).
  push:
    branches: [main]
    paths: ['cli/package.json', 'cli/BRIDGE_CHANGELOG.md']
    tags: ['bridge-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and prove the exe, keep it as an artifact, publish nothing.'
        type: boolean
        default: true

# A release is never superseded by a newer one.
concurrency:
  group: release-bridge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A push to main releases the Bridge only for a `bridgeVersion` that is not on the Releases page
  # yet; otherwise it says so and stays green. A tag push and a manual run
  # always go on to the release job, which keeps every refusal it had.
  decide:
    name: Does this push release the Bridge?
    if: ${{ github.repository == 'NoaCG/NoaCG-Studio' }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare the Bridge version with the Releases page
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./cli/package.json").bridgeVersion')"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "bridge-v${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::NoaCG Bridge $VERSION is already on the Releases page."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "NoaCG Bridge $VERSION is not released yet, so this push releases it."

  release:
    name: Build and publish the NoaCG Bridge exe
    needs: decide
    # Never on a fork, never on a fork's tag push, and only when `decide` found a version to release.
    if: ${{ github.repository == 'NoaCG/NoaCG-Studio' && needs.decide.outputs.release == 'true' }}
    # The exe is a copy of the runner's own node.exe with the bundle injected, so it is built
    # where it will run.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      # One Release created at the end; everything before it is a read.
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the ancestor-of-main check needs real refs.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The version is cli/package.json's `bridgeVersion`. The tag must agree with it, so a tag
      # naming a version it does not build is refused before anything is built.
      - name: Read the version being released
        id: version
        run: |
          VERSION="$(node -p 'require("./cli/package.json").bridgeVersion')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "$GITHUB_REF" ] && [ "$TAG" != "bridge-v$VERSION" ]; then
            echo "::error title=Tag/version mismatch::tag $TAG but cli/package.json's bridgeVersion is $VERSION (expected tag bridge-v$VERSION)."
            exit 1
          fi
          echo "Releasing NoaCG Bridge $VERSION from ${GITHUB_SHA}"

      # A release says what changed, to the operator deciding whether to download again. The
      # notes are the version's section of cli/BRIDGE_CHANGELOG.md, refused here when missing or
      # when it is not the newest section.
      - name: Refuse a version with no release notes a person can read
        run: node cli/scripts/release-notes.mjs --bridge --check

      # A released Bridge must be a Bridge on main. A DRY RUN of a branch is let through with a
      # notice, as in release-cli.yml: it publishes nothing, and rehearsing a release change before
      # it lands is the only way to prove it.
      - name: Refuse a commit that is not on main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice title=Not on main::${GITHUB_SHA} is not on main yet. This dry run rehearses it; a real release of it would be refused here."
              exit 0
            fi
            echo "::error title=Not on main::${GITHUB_SHA} is not an ancestor of origin/main. Land the branch first; landing a new bridgeVersion releases it."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main."

      # GitHub is the authority on what is already released. A real run refuses a taken version;
      # a dry run only says so, so a rehearsal works on any tree.
      - name: Is the version free?
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if gh release view "bridge-v${VERSION}" --json tagName >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice title=Already released::NoaCG Bridge $VERSION is already on the Releases page; this dry run rehearses the build only."
              exit 0
            fi
            echo "::error title=Already released::NoaCG Bridge $VERSION is already on the Releases page. Move bridgeVersion in cli/package.json and write its section in cli/BRIDGE_CHANGELOG.md."
            exit 1
          fi
          echo "NoaCG Bridge $VERSION is free."

      - name: Install the CLI package's dependencies
        run: npm --prefix cli ci

      # Builds the package, bundles the bridge entry, injects it into a copy of this runner's
      # node.exe, starts the result and asks /health. A build that does not answer is refused.
      - name: Build and prove the exe
        run: npm --prefix cli run build:exe

      - name: Rehearse the Release page (dry run)
        if: ${{ inputs.dry_run }}
        run: node cli/scripts/release-notes.mjs --bridge

      - name: Keep the exe as an artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: NoaCG-Bridge
          path: |
            cli/dist-exe/NoaCG-Bridge-${{ steps.version.outputs.version }}.exe
            cli/dist-exe/NoaCG-Bridge-${{ steps.version.outputs.version }}.exe.sha256

      # `--target` matters on a push to main and a manual dispatch, where there is no tag yet: gh
      # creates `bridge-vX.Y.Z` at the commit that was built. On a tag push the tag already exists.
      # `--latest` marks this release as the repository's latest explicitly, so GitHub's
      # `releases/latest` is the newest Bridge by decision rather than by creation date.
      - name: Create the Release with the exe
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node cli/scripts/release-notes.mjs --bridge > "$RUNNER_TEMP/release-notes.md"
          gh release create "bridge-v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "NoaCG Bridge ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            "cli/dist-exe/NoaCG-Bridge-${VERSION}.exe" "cli/dist-exe/NoaCG-Bridge-${VERSION}.exe.sha256"
          echo "::notice title=Released::https://github.com/${GITHUB_REPOSITORY}/releases/tag/bridge-v${VERSION}"
