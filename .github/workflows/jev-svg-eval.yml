name: Jev SVG evaluation

# The comparison and metering harness for docs/work-specs/jev-svg-import (rows 32 to 34, AC-7).
# Manual only, main only, in the protected `jev-svg-evaluation` environment. Rules:
# docs/work-specs/jev-svg-import/evidence/phase-32.md.
#
# Trust boundary: everything that runs is this workflow and the harness at the main commit that
# was dispatched. `configuration_ref` names a branch (or commit); the harness resolves it once to
# a commit and reads only docs/work-specs/jev-svg-import/evaluation/prompts.json at it, as bytes,
# through git plumbing, then validates it against a closed schema. No branch is checked out, no
# branch file is imported or executed, and no package is installed from a branch.
#
# Modes:
#   dry-run      mock gateway and mock balance; reads no secret. Proves the pipeline and metering.
#   development  paid; development designs only; continues the ledger of `receipts_run_id`, or
#                `establish_baseline` on the very first paid run.
#   holdout      paid, once; held to the freeze row 33 recorded in the ledger.
#   reconcile    reads the balance and clears a suspension with a written reason; sends nothing.
#                Also records row 33's freeze (`freeze`), accepts a reviewed harness change
#                (`accept_manifest`) or closes runs lost without a ledger (`lost_runs`).
run-name: Jev SVG evaluation (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run, development, holdout or reconcile
        required: true
        type: choice
        options: [dry-run, development, holdout, reconcile]
        default: dry-run
      configuration_ref:
        description: Branch or commit holding the configuration JSON (read as data only)
        required: true
        type: string
      receipts_run_id:
        description: Run id of the previous run of this workflow whose ledger continues (paid modes)
        required: false
        type: string
      establish_baseline:
        description: Development mode, first dispatch only - record the original balance baseline and call no model
        required: false
        type: boolean
        default: false
      regression:
        description: Also report the 51-file non-blind regression slice
        required: false
        type: boolean
        default: false
      reconcile_reason:
        description: Reconcile only - what was checked and why the ledger may continue
        required: false
        type: string
      freeze:
        description: Reconcile only - record this configuration and the harness as frozen (end of row 33)
        required: false
        type: boolean
        default: false
      lost_runs:
        description: Reconcile only - comma-separated ids of runs that left no ledger
        required: false
        type: string
      lost_attempts:
        description: Provider attempts those lost runs made, read from the gateway's records
        required: false
        type: string
      accept_manifest:
        description: Reconcile only - accept the harness now on main (a reviewed fix landed through its owning row)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# One evaluation at a time: GitHub serializes this group and never cancels a running one. It is not
# a queue: a newer dispatch replaces an older one still waiting (which never started a step, so
# spent nothing), so the coordinator checks for an in-flight run before dispatching.
concurrency:
  group: jev-svg-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'NoaCG/NoaCG-Studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: jev-svg-evaluation
    steps:
      - name: Refuse any workflow but main's
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          test "$WORKFLOW_REF" = "NoaCG/NoaCG-Studio/.github/workflows/jev-svg-eval.yml@refs/heads/main" \
            || { echo "FAIL: this workflow runs only from main"; exit 1; }

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium
        if: inputs.mode != 'reconcile'

      - name: Resolve the configuration (data only)
        id: config
        env:
          CONFIGURATION_REF: ${{ inputs.configuration_ref }}
        run: |
          if ! out="$(node scripts/jev-svg-eval.mjs fetch-config --ref "$CONFIGURATION_REF" --out "$RUNNER_TEMP/prompts.json")"; then
            echo "$out"
            exit 1
          fi
          echo "$out"
          commit="$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1);process.stdout.write(j.commit)})')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # One receipt chain (rules C1-C6 in phase-32.md): only attempt 1 of a run takes part; no run
      # number may be missing; a paid run continues the NEWEST ledger; a run that started its step
      # and left no ledger (a lost runner) refuses every later paid run until a reconcile names it;
      # the holdout is consumed once any run started decoding it.
      - name: Check the receipt chain and fetch the previous ledger
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.receipts_run_id }}
          ESTABLISH: ${{ inputs.establish_baseline }}
          LOST_RUNS: ${{ inputs.lost_runs }}
          FREEZE: ${{ inputs.freeze }}
        run: |
          runs="$RUNNER_TEMP/runs.json"
          echo '[' > "$runs"
          first=1
          # main's own commit, read once: comparing against the bare name `main` could resolve a tag.
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "FAIL: could not read main's commit"; exit 1; }
          # Read into a variable first: a failed listing then stops the step instead of looping over nothing.
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/jev-svg-eval.yml/runs?per_page=100" --jq '.workflow_runs[].id')"
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '{number: .run_number, branch: .head_branch, sha: .head_sha, event: .event, path: .path, title: .display_title}')"
            sha="$(printf '%s' "$meta" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).sha;process.stdout.write(/^[0-9a-f]{40}$/.test(v)?v:"")})')"
            # A tag called `main` reports head_branch "main" too; main must contain the run's commit.
            # Fails closed: an unanswered or unexpected comparison stops the chain check, so a run
            # is never left out because its ancestry could not be read.
            [ -n "$sha" ] || { echo "FAIL: run $id has no readable commit"; exit 1; }
            cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$main_sha" --jq '.status')"
            case "$cmp" in
              ahead|identical) onmain=true ;;
              behind|diverged) onmain=false ;;
              *) echo "FAIL: could not tell whether main contains run $id"; exit 1 ;;
            esac
            mode="$(printf '%s' "$meta" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=/^Jev SVG evaluation \((dry-run|development|holdout|reconcile)\)$/.exec(JSON.parse(s).title||"");process.stdout.write(m?m[1]:"unknown")})')"
            ledger="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "jev-svg-eval-ledger")] | length')"
            # Every attempt of the run, not only the newest: a refused re-run must not hide its first attempt.
            steps="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all&per_page=100" --jq '.jobs[].steps[]? | select(.conclusion != "skipped" and .status != "queued" and .status != "pending") | .name')"
            started=false; decoded=false
            if grep -qxE 'Run the harness|Reconcile the ledger' <<< "$steps"; then started=true; fi
            if grep -qx 'Decode the sealed holdout' <<< "$steps"; then decoded=true; fi
            [ "$first" = 1 ] || echo ',' >> "$runs"
            first=0
            printf '%s' "$meta" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);
              process.stdout.write(JSON.stringify({id:process.argv[1],number:m.number,branch:m.branch,onMain:process.argv[6]==="true",event:m.event,path:m.path,mode:process.argv[2],
              hasLedger:process.argv[3]!=="0",harnessStarted:process.argv[4]==="true",holdoutStarted:process.argv[5]==="true"})+"\n")})' \
              "$id" "$mode" "$ledger" "$started" "$decoded" "$onmain" >> "$runs"
          done
          echo ']' >> "$runs"
          node scripts/jev-svg-eval.mjs chain --runs "$runs" --mode "$MODE" --receipts-run-id "$RUN_ID" \
            --establish "$ESTABLISH" --lost-runs "$LOST_RUNS" --freeze "$FREEZE"
          if [ "$ESTABLISH" != "true" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n jev-svg-eval-ledger -D "$RUNNER_TEMP/ledger-in"
            test -s "$RUNNER_TEMP/ledger-in/ledger.json" || { echo "FAIL: missing-receipt: that run left no ledger"; exit 1; }
          fi

      # Before the secret reaches the runner: the freeze is recorded and this configuration and
      # harness are exactly the frozen ones. A refusal here leaves the holdout unopened.
      - name: Check the holdout freeze
        if: inputs.mode == 'holdout'
        run: node scripts/jev-svg-eval.mjs holdout-gate --ledger "$RUNNER_TEMP/ledger-in/ledger.json" --config "$RUNNER_TEMP/prompts.json"

      - name: Decode the sealed holdout
        if: inputs.mode == 'holdout'
        env:
          JEV_SVG_HOLDOUT_ZIP_BASE64: ${{ secrets.JEV_SVG_HOLDOUT_ZIP_BASE64 }}
        shell: python
        run: |
          import base64, os, sys
          sealed = os.environ.get('JEV_SVG_HOLDOUT_ZIP_BASE64', '')
          if not sealed:
              sys.exit('FAIL: sealed holdout unavailable')
          path = os.path.join(os.environ['RUNNER_TEMP'], 'holdout.zip')
          with open(path, 'wb') as f:
              f.write(base64.b64decode(''.join(sealed.split()), validate=True))
          print('decoded; the harness verifies every digest before opening it')

      - name: Run the harness
        if: inputs.mode != 'reconcile'
        env:
          # Paid modes only. The dry run never receives the key.
          AI_GATEWAY_API_KEY: ${{ (inputs.mode == 'development' || inputs.mode == 'holdout') && secrets.AI_GATEWAY_API_KEY || '' }}
          MODE: ${{ inputs.mode }}
          CONFIG_COMMIT: ${{ steps.config.outputs.commit }}
          ESTABLISH: ${{ inputs.establish_baseline }}
          REGRESSION: ${{ inputs.regression }}
          RUN_ID: ${{ inputs.receipts_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          args=(run --mode "$MODE" --config "$RUNNER_TEMP/prompts.json" --config-sha "$CONFIG_COMMIT"
                --ledger-out "$RUNNER_TEMP/out/ledger.json" --report "$RUNNER_TEMP/out/report.json")
          if [ "$MODE" != "dry-run" ] && [ -s "$RUNNER_TEMP/ledger-in/ledger.json" ]; then args+=(--ledger "$RUNNER_TEMP/ledger-in/ledger.json"); fi
          if [ "$ESTABLISH" = "true" ]; then args+=(--establish-baseline); fi
          if [ "$MODE" != "dry-run" ]; then args+=(--runs "$RUNNER_TEMP/runs.json" --receipts-run-id "$RUN_ID"); fi
          if [ "$REGRESSION" = "true" ]; then args+=(--regression); fi
          if [ "$MODE" = "holdout" ]; then args+=(--holdout-zip "$RUNNER_TEMP/holdout.zip"); fi
          node scripts/jev-svg-eval.mjs "${args[@]}"

      - name: Reconcile the ledger
        if: inputs.mode == 'reconcile'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          REASON: ${{ inputs.reconcile_reason }}
          ACCEPT_MANIFEST: ${{ inputs.accept_manifest }}
          FREEZE: ${{ inputs.freeze }}
          CONFIG_COMMIT: ${{ steps.config.outputs.commit }}
          RUN_ID: ${{ inputs.receipts_run_id }}
          LOST_RUNS: ${{ inputs.lost_runs }}
          LOST_ATTEMPTS: ${{ inputs.lost_attempts }}
        run: |
          test -s "$RUNNER_TEMP/ledger-in/ledger.json" || { echo "FAIL: reconcile needs receipts_run_id"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          args=(reconcile --ledger "$RUNNER_TEMP/ledger-in/ledger.json" --ledger-out "$RUNNER_TEMP/out/ledger.json" --reason "$REASON")
          if [ "$ACCEPT_MANIFEST" = "true" ]; then args+=(--accept-manifest); fi
          if [ "$FREEZE" = "true" ]; then args+=(--freeze --config "$RUNNER_TEMP/prompts.json" --config-sha "$CONFIG_COMMIT"); fi
          args+=(--runs "$RUNNER_TEMP/runs.json" --receipts-run-id "$RUN_ID")
          if [ -n "$LOST_RUNS" ]; then args+=(--lost-runs "$LOST_RUNS" --lost-attempts "$LOST_ATTEMPTS"); fi
          node scripts/jev-svg-eval.mjs "${args[@]}"

      - name: Remove the holdout archive
        if: always()
        run: rm -f "$RUNNER_TEMP/holdout.zip"

      # The ledger is the receipt chain: kept 90 days and copied into the row's evidence.
      - name: Keep the ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A dry run's mock ledger is kept apart, so it can never be taken for the chain.
          name: ${{ inputs.mode == 'dry-run' && 'jev-svg-eval-dry-run-ledger' || 'jev-svg-eval-ledger' }}
          path: ${{ runner.temp }}/out/ledger.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-svg-eval-report
          path: ${{ runner.temp }}/out/report.json
          retention-days: 90
          if-no-files-found: ignore
