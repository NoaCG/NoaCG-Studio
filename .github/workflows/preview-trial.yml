name: Local preview trial

on:
  pull_request:
    paths:
      - 'cli/plugin-preview/**'
      - 'scripts/codex-preview-trial.test.mjs'
      - 'cli/src/browser.ts'
      - 'cli/src/config.ts'
      - '.github/workflows/preview-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/plugin-preview/package-lock.json
      - run: npm ci --prefix cli/plugin-preview --no-audit --no-fund
      - run: npm run build --prefix cli/plugin-preview
      - name: Unit and protocol checks
        shell: bash
        run: |
          mkdir -p cli/plugin-preview/dist/phase2
          npm test --prefix cli/plugin-preview 2>&1 | tee cli/plugin-preview/dist/phase2/unit.log
      - run: node cli/plugin-preview/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Package preview browser checks
        shell: bash
        run: npm run test:browser --prefix cli/plugin-preview 2>&1 | tee cli/plugin-preview/dist/phase2/browser.log
      - name: Validate the native edited package with NoaCG
        working-directory: cli/plugin-preview
        run: |
          node --input-type=module <<'JS'
          import { cp, readFile, writeFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import { readSource } from './source.mjs';
          const root = './dist/native-edited-fixture';
          await cp('./fixture', root, { recursive: true });
          const css = root + '/graphic.css';
          await writeFile(css, (await readFile(css, 'utf8')).replace('font-size: 52px', 'font-size: 66px'));
          const { revision } = await readSource(root);
          assert.equal(revision, 'files-sha256:cde50027ff28af1a3e7a0b5861de719e282997fc37ce8f99e213e111560ac5ac');
          await writeFile('./dist/native-edited-source.json', JSON.stringify({ revision, edit: 'Name 52px to 66px' }, null, 2));
          JS
          (cd dist/native-edited-fixture && zip -q ../native-edited-fixture.zip *)
          npx --yes @noacg/cli@0.12.2 validate dist/native-edited-fixture.zip --screenshots dist/validation-after --json > dist/noacg-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-trial-browser-stub
          path: |
            cli/plugin-preview/dist/browser-stub.png
            cli/plugin-preview/dist/phase2/**
            cli/plugin-preview/dist/native-edited-source.json
            cli/plugin-preview/dist/noacg-validation.json
            cli/plugin-preview/dist/validation-after/**
          if-no-files-found: warn
          retention-days: 7
