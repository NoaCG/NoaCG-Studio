# THE TEST ALARM (cicd-followup cf01, #1951). One deliberate, clearly labelled alarm issue, opened
# by this workflow's own token and routed exactly like the growth, age and quarantine alarms:
# assigned to the owner scripts/growth-ceilings.json records (`ownerLogin`), by the same function
# (scripts/alarm-owner.mjs `routeToOwner`). The owner confirms receipt on #1951, so the routing
# is seen to work end to end rather than assumed.
#
#   gh workflow run alarm-test.yml --ref main -R NoaCG/NoaCG-Studio
#
# Manual only, and only on main: an alarm is a statement about main, and the routing it proves
# must be the routing main runs. No schedule, so it spends nothing unless someone asks.
name: Test alarm

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  raise:
    name: Raise one test alarm
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write # open the test alarm issue and assign it
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Open and route the test alarm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/alarm-owner.mjs test-alarm --run "$RUN_URL"
