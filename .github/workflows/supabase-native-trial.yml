# TRIAL ONLY - lives on claude/supabase-native-trial and is never landed.
#
# Measures the configured suite (configured-suite.yml's job, step for step) on three arms:
#   docker-2.111  - main today: CLI 2.111.0, the legacy Docker `supabase start`
#   docker-2.120  - the fallback if native is adopted: CLI 2.120.0, legacy Docker path
#   native-2.120  - CLI 2.120.0, SUPABASE_EXPERIMENTAL_STACK=1, `--runtime native`
# Report: docs/research/2026-10-12-supabase-native-stack.md on claude/supabase-native-stack-research.
#
# max-parallel 3 and attempt as the outer matrix key: each wave is one job per arm, so the arms see
# the same time of day, and the trial never takes more than 3 of the org's 20 concurrent jobs.

name: supabase-native-trial

on:
  push:
    branches: [claude/supabase-native-trial]

permissions:
  contents: read

jobs:
  trial:
    name: ${{ matrix.arm }} #${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        attempt: [2, 3, 4, 5]
        arm: [docker-2.111, docker-2.120, native-2.120]
        include:
          - { arm: docker-2.111, cli: 2.111.0, runtime: docker }
          - { arm: docker-2.120, cli: 2.120.0, runtime: docker }
          - { arm: native-2.120, cli: 2.120.0, runtime: native }
    env:
      E2E_EMAIL: e2e@noacg.local
      E2E_PASSWORD: noacg-e2e-local-pw
      E2E_TEAMMATE_EMAIL: e2e-teammate@noacg.local
      E2E_TEAMMATE_PASSWORD: noacg-e2e-local-pw
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: local-e2e-unused
      SUPABASE_AUTH_GOOGLE_SECRET: local-e2e-unused
      # Native arm only: the experimental stack backend. Empty elsewhere so the legacy path runs.
      SUPABASE_EXPERIMENTAL_STACK: ${{ matrix.runtime == 'native' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ matrix.cli }}

      # The native runtime downloads its service archives on first start; a real adoption would
      # cache them. Wave 1 is cold, later waves read what wave 1 saved.
      - name: Cache native service archives
        id: stackcache
        if: ${{ matrix.runtime == 'native' }}
        uses: actions/cache@v4
        with:
          path: ~/.supabase/cache/stack
          key: supabase-stack-${{ runner.os }}-${{ runner.arch }}-cli-${{ matrix.cli }}

      - name: Start the local Supabase stack
        run: |
          set -euo pipefail
          supabase --version
          psql --version || true
          if [ "${{ matrix.runtime }}" = native ]; then
            # --eager: every service up before returning, and no idle stops mid-suite.
            supabase start --runtime native --eager --exclude studio,functions
          else
            supabase start -x studio,edge-runtime
            docker ps --format '{{.Names}}\t{{.Image}}'
          fi
          free -m
          if [ "${{ matrix.runtime }}" = docker ]; then
            docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}'
          fi

      - name: Export the local stack's URL and keys
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = native ]; then
            status="$(supabase status --output-format json)"
            pick() { printf '%s' "$status" | jq -r --arg k "$1" '(.env[$k] // .[$k]) // empty'; }
            echo "runtime: $(printf '%s' "$status" | jq -r '.runtime // "unreported"')"
          else
            status="$(supabase status -o json)"
            pick() { printf '%s' "$status" | jq -r --arg k "$1" '.[$k] // empty'; }
          fi
          api_url="$(pick API_URL)"; anon="$(pick ANON_KEY)"; service="$(pick SERVICE_ROLE_KEY)"; db_url="$(pick DB_URL)"
          for pair in "API_URL=$api_url" "ANON_KEY=$anon" "SERVICE_ROLE_KEY=$service" "DB_URL=$db_url"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::status gave no ${pair%%=*}. Keys present:"
              printf '%s' "$status" | jq -r 'paths(scalars) | map(tostring) | join(".")'
              exit 1
            fi
          done
          echo "::add-mask::$service"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "SUPABASE_DB_URL=$db_url"
          } >> "$GITHUB_ENV"
          echo "Local stack at ${api_url}, db at ${db_url%%@*}@..."

      # "Healthy" for the timing: auth, PostgREST and storage answer, the buckets 0001 creates are
      # there, and a realtime broadcast makes a round trip.
      - name: Prove auth, rest, storage and realtime answer
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          echo "auth health: $(code "$VITE_SUPABASE_URL/auth/v1/health" -H "apikey: $VITE_SUPABASE_ANON_KEY")"
          echo "rest root:   $(code "$VITE_SUPABASE_URL/rest/v1/" -H "apikey: $VITE_SUPABASE_ANON_KEY")"
          buckets="$(curl -s "$VITE_SUPABASE_URL/storage/v1/bucket" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")"
          echo "storage buckets: $(printf '%s' "$buckets" | jq -c '[.[].id]')"
          [ "$(printf '%s' "$buckets" | jq 'length')" -gt 0 ] || { echo "::error::storage lists no buckets"; exit 1; }
          cat > .trial-realtime.mjs <<'EOF'
          import { createClient } from '@supabase/supabase-js';
          const c = createClient(process.env.VITE_SUPABASE_URL, process.env.VITE_SUPABASE_ANON_KEY);
          const ch = c.channel('probe-' + Date.now(), { config: { broadcast: { self: true } } });
          const timeout = (ms, what) => new Promise((_, rej) => setTimeout(() => rej(new Error(what)), ms));
          const got = new Promise((res) => ch.on('broadcast', { event: 'ping' }, res));
          await Promise.race([new Promise((res, rej) => ch.subscribe((s) => {
            if (s === 'SUBSCRIBED') res(); else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') rej(new Error(s));
          })), timeout(20000, 'not SUBSCRIBED in 20 s')]);
          await ch.send({ type: 'broadcast', event: 'ping', payload: {} });
          await Promise.race([got, timeout(10000, 'no broadcast back in 10 s')]);
          console.log('realtime broadcast round trip ok');
          process.exit(0);
          EOF
          node .trial-realtime.mjs

      # configured-suite.yml's assertions. Docker arms reach psql through the db container as main
      # does; the native arm uses the runner's psql against DB_URL.
      - name: Assert the schema, its grants, and the realtime publication
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = native ]; then
            echo 'psql() { command psql "$SUPABASE_DB_URL" -X -tA -F "|" -c "$1"; }' > .trial-psql.sh
          else
            db_container="$(docker ps --filter 'name=supabase_db' --format '{{.Names}}' | head -1)"
            printf 'psql() { docker exec -i %s psql -U postgres -d postgres -X -tA -F "|" -c "$1"; }\n' "$db_container" > .trial-psql.sh
          fi
          source .trial-psql.sh

          expected="$(find supabase/migrations -maxdepth 1 -type f | grep -cE '/[0-9]+_.*\.sql$')"
          applied="$(psql 'select count(*) from supabase_migrations.schema_migrations')"
          echo "migrations: ${applied} applied, ${expected} in the repository."
          [ "$applied" = "$expected" ] || { echo "::error::schema mismatch"; exit 1; }
          for table in chat_submissions control_events; do
            [ "$(psql "select count(*) from pg_publication_tables where pubname='supabase_realtime' and tablename='${table}'")" = 1 ] \
              || { echo "::error::${table} not published"; exit 1; }
          done
          for pair in 'authenticated documents' 'authenticated control_shows' 'authenticated control_events'; do
            set -- $pair
            [ "$(psql "select has_table_privilege('$1', 'public.$2', 'select')")" = t ] \
              || { echo "::error::${1} cannot read ${2}"; exit 1; }
          done
          echo "schema, publication and grants as configured-suite.yml asserts."

      # The comparison data: every grant the client roles hold in public, the default privileges, a
      # probe table created as postgres with no grants, extensions and their schemas.
      - name: Dump the database shape
        run: |
          set -uo pipefail
          source .trial-psql.sh
          {
            q() { echo "## $1"; psql "$2"; echo; }
            q version "select version()"
            q role "select rolname, rolsuper from pg_roles where rolname = current_user"
            q extensions "select extname, extnamespace::regnamespace from pg_extension order by 1"
            q settings "select name, setting from pg_settings where name in ('shared_preload_libraries','cron.use_background_workers','search_path') order by 1"
            q default_acl "select pg_get_userbyid(defaclrole), coalesce(defaclnamespace::regnamespace::text,'*'), defaclobjtype, defaclacl::text from pg_default_acl order by 1,2,3"
            psql "create table public.zz_grant_probe(id int)"
            q probe_grants "select grantee, string_agg(privilege_type, ',' order by privilege_type) from information_schema.role_table_grants where table_schema = 'public' and table_name = 'zz_grant_probe' group by 1 order by 1"
            psql "drop table public.zz_grant_probe"
            q public_grants "select grantee, table_name, string_agg(privilege_type, ',' order by privilege_type) from information_schema.role_table_grants where table_schema = 'public' and grantee in ('anon','authenticated','service_role','PUBLIC') group by 1,2 order by 2,1"
            q function_execute "select p.proname, r.rolname from pg_proc p join pg_namespace n on n.oid = p.pronamespace cross join (values ('anon'),('authenticated')) as r(rolname) where n.nspname = 'public' and has_function_privilege(r.rolname, p.oid, 'execute') order by 1,2"
            q buckets "select id, public from storage.buckets order by 1"
            q publication "select tablename from pg_publication_tables where pubname = 'supabase_realtime' order by 1"
            q migrations "select count(*) from supabase_migrations.schema_migrations"
          } > db-shape.txt 2>&1
          sed -n '1,40p' db-shape.txt

      - name: Create the test account and prove it can sign in
        run: |
          set -euo pipefail
          for who in "$E2E_EMAIL:$E2E_PASSWORD" "$E2E_TEAMMATE_EMAIL:$E2E_TEAMMATE_PASSWORD"; do
            email="${who%%:*}"; pw="${who#*:}"
            create="$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST "${VITE_SUPABASE_URL}/auth/v1/admin/users" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H 'Content-Type: application/json' -d "{\"email\":\"${email}\",\"password\":\"${pw}\",\"email_confirm\":true}")"
            case "$create" in 2*|422) ;; *) echo "::error::admin/users answered ${create}"; cat /tmp/create.json; exit 1 ;; esac
            token="$(curl -s -X POST "${VITE_SUPABASE_URL}/auth/v1/token?grant_type=password" -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              -H 'Content-Type: application/json' -d "{\"email\":\"${email}\",\"password\":\"${pw}\"}" | jq -r '.access_token // empty')"
            [ -n "$token" ] || { echo "::error::${email} cannot sign in"; exit 1; }
          done
          echo "both accounts authenticate."

      - name: Configured E2E suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: configured-report.json
        run: npm run test:e2e:live -- --reporter=list,json || true

      # Off main the verdict keeps every flake red, which is the stricter count for a trial.
      - name: Assert the suite actually ran
        id: assert
        run: >-
          node scripts/configured-verdict.mjs configured-report.json
          --expect e2e/configured/expected-run.json
          --label "Trial ${{ matrix.arm }}"
          --quarantine ""
          --changed ""

      - name: Stack logs (on failure)
        if: ${{ failure() }}
        run: |
          if [ "${{ matrix.runtime }}" = native ]; then
            supabase stack logs --tail 80 2>&1 || true
          else
            for c in $(docker ps -a --filter 'name=supabase_' --format '{{.Names}}'); do
              echo "===== $c ====="; docker logs --tail 60 "$c" 2>&1 || true
            done
          fi

      - name: Upload trial evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: trial-${{ matrix.arm }}-${{ matrix.attempt }}
          path: |
            configured-report.json
            db-shape.txt
          retention-days: 30
          if-no-files-found: ignore

  # A cloud agent sandbox's conditions, emulated: Ubuntu 24.04 as root with no Docker daemon.
  # Two git worktrees of this commit, one native stack each, up at the same time.
  cloud-emulation:
    name: root container, no Docker, two worktrees
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04
    env:
      SUPABASE_EXPERIMENTAL_STACK: '1'
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: local-e2e-unused
      SUPABASE_AUTH_GOOGLE_SECRET: local-e2e-unused
    steps:
      - name: Base tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates tar xz-utils jq postgresql-client procps >/dev/null
          id; ldd --version | head -1; command -v docker || echo "no docker"

      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Two worktrees, fixed ports removed
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          for wt in a b; do
            git worktree add --detach "/tmp/wt-$wt" HEAD
            # Fixed ports are exact requests; two stacks need the CLI to allocate them.
            sed -i -E '/^(port|shadow_port) *=/d' "/tmp/wt-$wt/supabase/config.toml"
          done
          grep -n port /tmp/wt-a/supabase/config.toml || echo "no port lines left"

      - name: Start as root with no Postgres user named
        continue-on-error: true
        working-directory: /tmp/wt-a
        run: timeout 300 supabase start --runtime native --eager --exclude studio,functions 2>&1 | tail -20

      - name: Start both stacks as a named non-root Postgres user
        run: |
          set -euo pipefail
          id pgrunner >/dev/null 2>&1 || useradd -m pgrunner
          export SUPABASE_NATIVE_POSTGRES_USER=pgrunner
          for wt in a b; do
            ( cd "/tmp/wt-$wt"; supabase stop >/dev/null 2>&1 || true
              start=$(date +%s); supabase start --runtime native --eager --exclude studio,functions 2>&1 | tail -5
              echo "wt-$wt started in $(( $(date +%s) - start )) s" )
          done
          supabase stack list
          free -m

      - name: Assert schema and grants in both
        run: |
          set -euo pipefail
          expected="$(find /tmp/wt-a/supabase/migrations -maxdepth 1 -type f | grep -cE '/[0-9]+_.*\.sql$')"
          for wt in a b; do
            cd "/tmp/wt-$wt"
            status="$(supabase status --output-format json)"
            db="$(printf '%s' "$status" | jq -r '.env.DB_URL // .DB_URL')"
            api="$(printf '%s' "$status" | jq -r '.env.API_URL // .API_URL')"
            anon="$(printf '%s' "$status" | jq -r '.env.ANON_KEY // .ANON_KEY')"
            applied="$(psql "$db" -X -tAc 'select count(*) from supabase_migrations.schema_migrations')"
            grant="$(psql "$db" -X -tAc "select has_table_privilege('authenticated','public.documents','select')")"
            anon_docs="$(psql "$db" -X -tAc "select has_table_privilege('anon','public.documents','select')")"
            auth="$(curl -s -o /dev/null -w '%{http_code}' "$api/auth/v1/health" -H "apikey: $anon")"
            echo "wt-$wt: api ${api}, migrations ${applied}/${expected}, authenticated reads documents: ${grant}, anon reads documents: ${anon_docs}, auth health ${auth}"
            [ "$applied" = "$expected" ] && [ "$grant" = t ] && [ "$anon_docs" = f ] && [ "$auth" = 200 ]
          done
          # Isolation: a row written in a is not in b.
          dba="$(cd /tmp/wt-a && supabase status --output-format json | jq -r '.env.DB_URL // .DB_URL')"
          dbb="$(cd /tmp/wt-b && supabase status --output-format json | jq -r '.env.DB_URL // .DB_URL')"
          psql "$dba" -X -qc "insert into public.allowlist (email, note) values ('only-in-a@example.com', 'isolation probe')"
          echo "row in a: $(psql "$dba" -X -tAc "select count(*) from public.allowlist where email = 'only-in-a@example.com'"), in b: $(psql "$dbb" -X -tAc "select count(*) from public.allowlist where email = 'only-in-a@example.com'")"
