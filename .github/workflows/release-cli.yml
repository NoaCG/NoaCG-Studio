# Publish the `noacg` CLI + MCP server (cli/, docs/AGENT_CLI.md) to npm as @noacg/cli.
#
# WHY THIS FILE EXISTS. 0.2.0 was published by hand from a laptop with a granular npm token kept
# in a gitignored `.env`. That token bypassed 2FA, expired in 30 days, and could publish as the
# owner from anywhere it leaked - and the agent door is the most distinctive thing this product
# ships, so its release path being one secret on one machine was the largest standing credential
# risk in the repository. npm TRUSTED PUBLISHING removes the secret entirely: npm is told to trust
# THIS workflow file in THIS repository, and mints a short-lived credential from the GitHub OIDC
# token at publish time. There is nothing left to leak, rotate, or forget to revoke.
#
# WHAT MAKES IT SAFE, beyond having no secret:
#   - No `pull_request` trigger at all, so a fork's PR can never reach this workflow.
#   - `github.repository` is pinned, so a fork of the repository cannot run it either.
#   - The commit being published must be an ANCESTOR OF `main`. A tag on a side branch, or a
#     dispatch against an unmerged branch, is refused before anything is built. "Published" and
#     "on main" therefore cannot come apart.
#   - The version must not already exist on the registry - npm would refuse anyway, but refusing
#     here means a readable answer at the start instead of a 403 at the end of a long job.
#   - The default dispatch is a DRY RUN. Publishing is the deliberate answer, never the default.
#
# HOW TO RELEASE (docs/AGENT_CLI.md "Releasing to npm" is the prose):
#   1. Bump `cli/package.json` version, WRITE ITS SECTION IN `cli/CHANGELOG.md` for someone who
#      uses the CLI (the changelog ships in the package, so that text is what the npm page
#      shows; the build refuses a version without one), and run `npm --prefix cli run build` -
#      that stamps the four plugin manifests (noacg and noacg-mcp, a Claude Code and a Codex
#      manifest each) and both root marketplace entries. Commit; land on main through
#      /queue-merge.
#   2. That is all. Landing the bump publishes it (owner, 2026-10-08: "When we have an update and
#      we push it out, it should be published"): this workflow runs on the push to main, sees a
#      version npm does not have yet, builds from that commit, publishes to npm with provenance and
#      to the official MCP Registry (GitHub OIDC, no secret), then tags the commit cli-vX.Y.Z.
#      docs/research/agent-marketplaces-2026-10-02/updates.md says which other directories then
#      follow on their own and which need a person.
#
# The release decision is the version bump, reviewed and gated like every change to main. A push
# that touches cli/package.json without a new version publishes nothing. Pushing a cli-v* tag or
# the "Run workflow" button still re-drive a release by hand.
#
# NO GITHUB RELEASE IS CREATED HERE. The CLI's home is npm. The repository's Releases page
# belongs to NoaCG Bridge, the other tool built from this package (release-bridge.yml): to the
# people who use them they are two products with two homes, and the studio's download link
# resolves `releases/latest` to the newest Bridge only because nothing else is released there.
name: Release CLI to npm

on:
  # A version bump landing on main is the release request; the `decide` job below lets every other
  # change to cli/package.json pass without publishing. A `cli-v*` tag still re-drives a release by
  # hand (path filters do not apply to tag pushes). `cli-v*` rather than `v*` because this
  # repository publishes exactly one package out of a subdirectory.
  push:
    branches: [main]
    paths: ['cli/package.json']
    tags: ['cli-v*']
  # The manual door: a dry run by default (prove the whole path without burning a version), and a
  # real publish when a tagged run needs re-driving. GitHub only offers the button once this
  # trigger is on the DEFAULT branch.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test and pack, stop before the registry call.'
        type: boolean
        default: true
      distribution_only:
        description: 'Only rebuild the agent-toolkit-dist branch from the released commit (tag cli-vX.Y.Z) of the version on this ref. Publishes nothing; with dry run checked it prepares the branch without pushing.'
        type: boolean
        default: false

# A release is never superseded by a newer one. Two publishes racing is exactly the case where
# cancel-in-progress would leave a half-answered question behind.
concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A push to main publishes only when it carries a version npm does not have yet, and otherwise
  # says so and stays green. A tag push and a manual run always go on to the publish job, which
  # keeps every refusal it had.
  decide:
    name: Does this push release a version?
    if: ${{ github.repository == 'NoaCG/NoaCG-Studio' }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare cli/package.json with npm
        id: decide
        run: |
          VERSION="$(node -p 'require("./cli/package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND="$(npm view "@noacg/cli@$VERSION" version 2>/dev/null || true)"
          if [ -n "$FOUND" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::@noacg/cli@$VERSION is already on npm; this push changed cli/package.json without a new version."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "@noacg/cli@$VERSION is not on npm yet, so this push releases it."
          fi

  publish:
    name: Publish @noacg/cli
    needs: decide
    # Never on a fork, never on a fork's tag push, only when `decide` found a version to release,
    # and never for a dispatch that asked only for the distribution branch.
    if: ${{ github.repository == 'NoaCG/NoaCG-Studio' && needs.decide.outputs.release == 'true' && !inputs.distribution_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The checkout, the ancestor check and the build are all reads, and nothing here writes
      # to the repository.
      contents: read
      # GitHub mints an OIDC token, npm trades it for a short-lived credential.
      id-token: write
    steps:
      # Full history: the ancestor-of-main check below needs real refs, not a shallow cone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node 24 (LTS) is the version this project is developed on. `registry-url` is what makes
      # setup-node write the .npmrc pointing npm at registry.npmjs.org; no token goes with it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm today, but a
      # release path must not silently depend on which npm a runner image happens to carry - so
      # upgrade, then ASSERT, because "npm install -g npm@latest" succeeding proves nothing about
      # which binary is now on PATH.
      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version), node $(node --version)"
          NPM_VERSION="$(npm --version)" node -e '
            const need = [11, 5, 1];
            const got = process.env.NPM_VERSION.split(".").map(Number);
            const ok = got[0] > need[0]
              || (got[0] === need[0] && (got[1] > need[1] || (got[1] === need[1] && got[2] >= need[2])));
            if (!ok) {
              console.error(`npm ${process.env.NPM_VERSION} cannot publish with OIDC; 11.5.1 or later is required.`);
              process.exit(1);
            }
          '

      # Re-read the version rather than trusting the tag: cli/package.json is the one number a
      # release bumps (cli/scripts/build-skill.mjs stamps everything else FROM it).
      - name: Read the version being released
        id: version
        run: |
          VERSION="$(node -p 'require("./cli/package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing @noacg/cli@$VERSION from ${GITHUB_SHA}"

      # A RELEASE SAYS WHAT CHANGED, TO THE PERSON DECIDING WHETHER TO UPDATE. The notes are the
      # version's own section of cli/CHANGELOG.md, written by hand with the version bump and
      # shipped in the package, and a version without one is refused HERE - before the build,
      # long before the publish that cannot be taken back. `npm run build` runs the same check,
      # so this only fires for a tag pushed at a commit that never built.
      - name: Refuse a version with no release notes a person can read
        run: node cli/scripts/release-notes.mjs --check

      # A published version must be a version on main. Both triggers land here: a tag pushed from
      # a side branch and a dispatch against an unmerged branch are refused identically. A DRY RUN
      # of a branch is let through with a notice: it publishes nothing (every step that writes to
      # a registry is gated on `!inputs.dry_run`), and rehearsing a release change before it lands
      # is the only way to prove that change works before the release that depends on it.
      - name: Refuse a commit that is not on main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice title=Not on main::${GITHUB_SHA} is not on main yet. This dry run rehearses it; a real publish of it would be refused here."
              exit 0
            fi
            echo "::error title=Not on main::${GITHUB_SHA} is not an ancestor of origin/main. Land the branch first (/queue-merge); landing a new version publishes it."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main."

      # A tag that disagrees with the version it claims to release is a mistake every time.
      - name: Refuse a tag that disagrees with cli/package.json
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "cli-v$VERSION" ]; then
            echo "::error title=Tag/version mismatch::tag $TAG but cli/package.json says $VERSION (expected tag cli-v$VERSION)."
            exit 1
          fi
          echo "Tag $TAG matches cli/package.json."

      # The registry is the authority on what already exists. A real publish must refuse a taken
      # version; a DRY RUN must not, or the rehearsal would only ever work in the narrow window
      # between bumping the version and releasing it - which is exactly when nobody rehearses.
      - name: Is the version free?
        id: free
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # `npm view <pkg>@<missing-version> version` prints nothing; whether it exits 0 or E404
          # depends on whether the PACKAGE exists, and both mean "free to publish". So the answer
          # is the OUTPUT, not the exit code - `|| true` keeps the E404 from failing the step.
          FOUND="$(npm view "@noacg/cli@$VERSION" version 2>/dev/null || true)"
          if [ -z "$FOUND" ]; then
            echo "free=true" >> "$GITHUB_OUTPUT"
            echo "@noacg/cli@$VERSION is free."
            exit 0
          fi
          echo "free=false" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=Version already published::@noacg/cli@$VERSION is already on the registry, so this dry run rehearses everything except the registry call itself. Bump cli/package.json to rehearse that too."
            exit 0
          fi
          # npm holds it. If the MCP Registry does not, this is the re-drive of a release whose npm
          # publish went through and whose registry publish did not (the registry step is last and
          # can fail on its own): carry on, skip npm, publish only the registry record.
          SERVER="$(node -p 'encodeURIComponent(require("./cli/server.json").name)')"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$SERVER/versions/$VERSION")"
          if [ "$STATUS" = "404" ]; then
            echo "::notice title=npm only::@noacg/cli@$VERSION is on npm but not in the MCP Registry, so this run publishes only the registry record."
            exit 0
          fi
          echo "::error title=Already published::@noacg/cli@$VERSION is already on npm (and the MCP Registry answered $STATUS for it). Bump cli/package.json."
          exit 1

      # THE TRAP (cli/scripts/build-skill.mjs): a version bump must run the skill generator, which
      # stamps the four plugin manifests and both marketplace entries. A bump committed without it
      # ships a plugin that advertises the previous version. `--check` is the same comparison
      # `npm run build` makes, asked BEFORE anything can rewrite the answer.
      - name: Refuse manifests that are out of step with the version
        run: npm --prefix cli run check:skill

      - name: Install the CLI package's dependencies
        run: npm --prefix cli ci

      - name: Typecheck and build
        run: npm --prefix cli run typecheck && npm --prefix cli run build

      # The build just RAN the generator. If it changed a tracked file, the committed tree was
      # stale in a way `--check` did not cover - belt for the braces above.
      - name: Refuse a build that changed a tracked file
        run: git diff --exit-code

      - name: Test
        run: npm --prefix cli test

      - name: Generate and validate independent directory packages
        run: npm run toolkit:dist -- "$RUNNER_TEMP/toolkit-release"

      # Upload the actual reproducible ZIPs, rather than relying on artifact service ZIP layout.
      - name: Keep directory packages and measurements as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: noacg-agent-toolkit-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/toolkit-release/*.zip
            ${{ runner.temp }}/toolkit-release/measurements.json
          if-no-files-found: error

      # Build the exact tarball a publish would upload, and print its contents. `prepack` re-runs
      # the full build, so what is packed here is what would be packed for real - which is also why
      # a stale local dist/ can never be shipped. This step touches no registry, so it proves the
      # packaging whatever the version's state.
      - name: Pack exactly as a publish would
        working-directory: cli
        run: npm pack --dry-run

      # THE MCP REGISTRY (registry.modelcontextprotocol.io) lists `noacg mcp` from cli/server.json,
      # which build-skill.mjs keeps at this version and checks against cli/package.json `mcpName`.
      # Its publisher is a single binary, PINNED to a version and to the archive's SHA-256: this job
      # holds an OIDC token that can publish to npm, so it runs nothing fetched as "latest".
      # To move the pin: download the new release's mcp-publisher_linux_amd64.tar.gz, take its
      # sha256sum, and change both lines.
      - name: Install the MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
          ./mcp-publisher --version

      # The registry's own validation (schema and semantic rules), asked of the registry without
      # publishing. It does not check npm ownership, which needs the version on npm; build-skill.mjs
      # asked that question offline, by comparing the name with `mcpName`.
      - name: Validate the MCP Registry record
        run: ./mcp-publisher validate cli/server.json

      # Prove the registry accepts this workflow's identity BEFORE npm, so a registry that would
      # refuse us is found while nothing has been published. GitHub OIDC grants the namespace
      # io.github.<repository owner>/*, here io.github.NoaCG/*. The token lasts five minutes, so
      # the publish step below signs in again.
      - name: Sign in to the MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # The last step before the upload, and the first that talks to the registry: it resolves the
      # package, refuses a taken version, and reports the tag and access it would publish with.
      # Only reachable with a free version - see "Is the version free?" above.
      - name: Rehearse the publish
        if: ${{ steps.free.outputs.free == 'true' }}
        working-directory: cli
        run: npm publish --dry-run

      - name: Stop here (dry run)
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FREE: ${{ steps.free.outputs.free }}
        run: |
          if [ "$FREE" = "true" ]; then
            echo "::notice title=Dry run::@noacg/cli@$VERSION packed cleanly and rehearsed against the registry. Nothing was published. Landing the bump on main publishes it; re-run with dry_run unchecked to publish this commit by hand."
          else
            echo "::notice title=Dry run::@noacg/cli@$VERSION packed cleanly. Nothing was published, and the registry rehearsal was skipped because that version already exists."
          fi

      # The publish itself. No NODE_AUTH_TOKEN, no .npmrc secret, nothing to leak: npm exchanges
      # the GitHub OIDC token for a short-lived credential, which is what `id-token: write` is for.
      # PROVENANCE is automatic here - this repository is public and the package is public, so npm
      # attaches a signed provenance statement without `--provenance` being passed. Passing the
      # flag would also work; leaving it off keeps the command identical to npm's own documented
      # trusted-publishing example, which is the version these docs are kept in step with.
      #
      # `inputs.dry_run` is null on a push (tag or main), so `!inputs.dry_run` is true there: a push
      # that reaches this job publishes.
      #
      # WHY VERBOSE. npm's OIDC exchange is silent by design: every path in npm's own
      # `lib/utils/oidc.js` returns undefined and logs at `verbose`, and the default level is
      # `notice`. So a trusted publish npm cannot authenticate prints nothing at all, and then
      # fails with `E404 Not Found - PUT` on a package that plainly exists - because npm carries
      # on and sends the placeholder `_authToken` setup-node wrote, and the registry masks its
      # 403 as a 404 so an unauthenticated caller cannot probe for private packages. At
      # `verbose` the log carries one line naming the real answer: either `oidc Successfully
      # retrieved and set token`, or `oidc Failed token exchange request with body message:`
      # and npm's own reason. That line is the difference between an hour of comparing runs and
      # reading one log - paid for on 2026-09-09, when 0.3.1 was refused because the repository
      # had moved and nothing in the log said so.
      #
      # It leaks nothing. `oidc.js` never logs the credential it obtains, and npm redacts auth
      # material from every log level except `notice` (`lib/utils/display.js`).
      # `free` is false on a real run only for the registry-only re-drive (see "Is the version free?").
      - name: Publish
        if: ${{ !inputs.dry_run && steps.free.outputs.free == 'true' }}
        working-directory: cli
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish

      # The MCP Registry reads the version back from npm and refuses it unless the package's
      # `mcpName` names this server - and npm answers a publish with 202 and serves the version
      # about two minutes later (measured on 0.3.2, scripts/release-cli.mjs). So wait until npm
      # serves this version with its mcpName, then publish, retrying the registry's own transient
      # answers. Every directory that reads the MCP Registry picks the version up from here; it
      # has no review step and needs no person.
      - name: Publish to the MCP Registry
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          WANT="$(node -p 'require("./cli/package.json").mcpName')"
          for i in $(seq 1 60); do
            GOT="$(npm view "@noacg/cli@$VERSION" mcpName 2>/dev/null || true)"
            [ "$GOT" = "$WANT" ] && break
            sleep 10
          done
          if [ "$GOT" != "$WANT" ]; then
            echo "::error title=npm not ready::npm did not serve @noacg/cli@$VERSION with mcpName $WANT within 10 minutes (got '$GOT'). Re-run this workflow with dry_run unchecked; it skips npm and publishes only the registry record."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish cli/server.json; then
              echo "::notice title=MCP Registry::$WANT $VERSION is in the MCP Registry: https://registry.modelcontextprotocol.io/v0.1/servers?search=$WANT"
              exit 0
            fi
            sleep 30
          done
          echo "::error title=MCP Registry refused::npm has @noacg/cli@$VERSION, the MCP Registry does not. Read the publisher's message above, fix, and re-run this workflow with dry_run unchecked; it skips npm and publishes only the registry record."
          exit 1

      - name: Say what landed
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice title=Published::@noacg/cli@$VERSION is on npm and in the MCP Registry - check the provenance badge at https://www.npmjs.com/package/@noacg/cli"

  # A release landed from main is tagged here, so `cli-vX.Y.Z` still marks every published version.
  # A tag pushed with the workflow's own token starts no new run, so this cannot publish twice.
  tag:
    name: Tag the release
    needs: [decide, publish]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag the published commit
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          TAG="cli-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists."
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "::notice title=Tagged::$TAG at $GITHUB_SHA"

  # THE CLAUDE DIRECTORY validates a GitHub repository, and this one archives at over 100 MiB
  # against its 50 MiB limit (#842). So a published release also replaces the generated
  # `agent-toolkit-dist` branch: the marketplace and the two plugin folders, with its own root
  # commit and no application history, each snapshot naming its source commit in PROVENANCE.json.
  # It writes only that branch, never main, and a dry run never pushes it.
  #
  # The "distribution_only" dispatch re-drives just this job for a version already on npm, from
  # that version's tag, without the publish job. That is how a release whose npm publish went
  # through and whose branch update failed (CLI 0.10.1) gets its branch without a new version.
  distribution:
    name: Update the generated toolkit distribution branch
    needs: publish
    # `!cancelled()` lets the distribution-only dispatch run although it skipped `publish`.
    if: ${{ !cancelled() && github.repository == 'NoaCG/NoaCG-Studio' && (inputs.distribution_only || (needs.publish.result == 'success' && !inputs.dry_run)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # History for the newer-snapshot ancestry check, file contents only for this commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The snapshot is the released commit, never a later main that may carry unreleased plugin
      # changes under the same version number. The tag is written only after a publish succeeds.
      - name: Check out the released commit (distribution only)
        if: ${{ inputs.distribution_only }}
        run: |
          TAG="cli-v$(node -p 'require("./cli/package.json").version')"
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" main
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error title=Not on main::$TAG is not on main, so it is not a released commit."
            exit 1
          fi
          git checkout --detach "$TAG"
          echo "Building the distribution from $TAG ($(git rev-parse HEAD))."
      # The script commits and pushes from a fresh repository in a temporary folder, so the
      # checkout's own credential does not reach it. `gh auth setup-git` makes git ask gh, and gh
      # answers with GH_TOKEN, which must therefore be set for the push itself, not only for the
      # setup (CLI 0.10.1 failed with "could not read Username" when it was set only there).
      - name: Replace the distribution tree from the published source commit
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          gh auth setup-git --hostname github.com
          if [ "$DRY_RUN" = "true" ]; then
            node cli/scripts/publish-toolkit-distribution.mjs
          else
            node cli/scripts/publish-toolkit-distribution.mjs --push
          fi
