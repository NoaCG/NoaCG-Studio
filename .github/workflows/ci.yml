# The per-change tier of the test pyramid: build, the factory checks, and the offline E2E specs
# that COVER THIS CHANGE - not the whole suite. The full suite runs nightly (nightly.yml), which
# is where exhaustive sweeps belong; here the question is "did this change break something", and
# the answer arrives in minutes on the commit that caused it.
#
# The cheap gates never tier. Build (typecheck + lint + bundle) runs on every change at ~70 s and
# is what catches the class of fault that once broke production for a week, so it is not
# something the plan is allowed to skip.
#
# Scoping is only ever safe because scripts/e2e-affected.mjs fails TOWARD running more: an
# unmapped file, a shared-core file, or an unusable diff base all escalate to the full suite.
# Playwright pins offline mode itself, so no secrets belong in this workflow. Live and
# authenticated flows remain maintainer-only.
name: CI

# Every branch, not only main. The gate here is STRICTER than anything a laptop runs before a
# merge (build + the sharded affected suite + the factory gates + the catalog tripwire, on a
# clean checkout) and it costs nothing: this repo is public, so Actions minutes are free and
# unmetered. Before this, a branch push triggered nothing at all, so the entire verification
# burden fell on the developer's machine - measured at 59 concurrent browser shells and 35 MB
# of free RAM on a 16 GB laptop, for an answer GitHub produces in six to nine minutes on
# hardware nobody is trying to work on.
#
# `'**'` is branches only, never tags. A same-repo pull request therefore gets two runs (one for
# the branch push, one for the PR); that is accepted rather than worked around, because the
# alternatives all mean per-job `if:` conditions that make the gate harder to read than a
# duplicate run is to ignore. `pull_request` stays because a FORK's branch never pushes here.
on:
  push:
    # The merge queue's temporary branches are pushed by GitHub and get their run from the
    # `merge_group` event below; a push run on the same ref shared its concurrency group with
    # that run and cancelled it within seconds, which the queue read as a failed check.
    branches: ['**', '!gh-readonly-queue/**']
  pull_request:
  # The merge queue (docs/WORKFLOW_ARCHITECTURE.md §5.2): GitHub builds a temporary merge of the
  # queued pull requests on top of main and runs this workflow on it; `CI gate` on that commit is
  # what lets the group merge. The plan below measures from the group's base, which is main.
  merge_group:
  # The manual door, for when the automatic ones are shut. On 2026-08-06 an Actions incident
  # throttled webhook delivery to ~15%, so pushes stopped producing runs at all - and with only
  # push and pull_request triggers there was no way to ask for one. A dispatched run has no
  # `github.event.before`, so the plan below finds no diff base and escalates to the FULL suite,
  # which is the right answer for a run someone asked for by hand. Note GitHub only offers the
  # button once this trigger exists on the DEFAULT branch - it cannot rescue the outage it was
  # written during, only the next one.
  workflow_dispatch:
    inputs:
      # NOT everybody who dispatches wants everything. `auto-merge.mjs` dispatches when the push
      # webhook is late, as a STAND-IN for the push run - and on 2026-09-03 that stand-in was the
      # thing that killed two landings (j-0438, j-0445): the full suite it escalated to cannot
      # finish inside a landing's 45-minute cap, so both were killed with no verdict at all,
      # after their push runs had already planned a subset correctly.
      #
      # So a dispatch may say what to measure from. A landing passes the main sha it just
      # integrated, which is the same base that run's own fork-point recovery would find - the
      # two plan identically. Empty is the default and what the button gives, and empty still
      # means the full suite, so the manual door is exactly as wide as it was.
      diff_base:
        description: 'Plan from this commit instead of running everything. Empty (the default) runs the full suite.'
        required: false
        default: ''

# Superseded runs cancel on branches and PRs, but never on main: a landed commit must keep
# its verdict (cancelled main runs left commits with NO CI answer while they were already
# deployed to production). Within the main group, newer pushes queue; GitHub keeps only the
# newest queued run, so main's HEAD always ends with a completed run.
#
# WHAT THAT LAST SENTENCE DOES AND DOES NOT BUY, measured 2026-08-25 over three days. "Keeps
# only the newest queued run" means the ones it does not keep are CANCELLED - so a main commit
# that lands while an earlier main run is still executing, and is itself superseded before a
# runner frees up, ends with a run of ZERO jobs and no verdict of its own. Three did:
# 32894928634, 32852667652, 32849327749, each `jobs: []`. `cancel-in-progress: false` protects
# main's HEAD, which is the commit production serves; it does not give every main commit its
# own answer, and this comment used to read as though it did.
#
# Left as it is, deliberately. The fix would be a per-SHA group on main so no two main runs
# ever share one, and that trades a verdict nothing reads for queue time on the branch gates
# that everyone waits on: a full main run is 16 jobs against a 20-concurrent-job ceiling, and
# runs starting while two branches were mid-gate have been measured waiting 22 to 45 minutes
# for a shard (see the shard-count comment below). The dropped verdict costs
# nothing real - landings are `--ff-only`, so the superseded SHA was already green on its
# branch, and the run that supersedes it tests a tree that CONTAINS it. A cancelled run also
# raises no notification, so this is not an inbox problem either
# (docs/VERIFICATION.md, "What a red run means, and what actually emails").
concurrency:
  # A merge-group run keys on its own id: nothing may cancel the run the queue is waiting on.
  group: ci-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node 24 (LTS) is the version the project is developed on, so npm validates the
      # lockfile exactly the way the machine that wrote it does.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - name: Build (typecheck + lint + bundle)
        run: npm run build

      # The NoaCG CLI is its own package (cli/, docs/AGENT_CLI.md): own lockfile, own typecheck,
      # own build. Its offline tests run here - the flag grammar, the workspace <-> zip boundary,
      # the credential store, the AMCP reader, the exit-code contract, and the MCP server's tool
      # surface (which tools exist, their arguments, and that `caspar` is not among them) - while
      # the bridge-driving smoke needs a dev server and a browser and is `npm run bench:cli` on a
      # developer machine, skipping itself with a message when no bridge answers.
      #
      # Releasing the package is NOT this workflow's job: .github/workflows/release-cli.yml
      # publishes it from a `cli-vX.Y.Z` tag on main, with npm trusted publishing (no token).
      - name: CLI package (typecheck + build + offline tests)
        run: npm --prefix cli ci && npm --prefix cli run typecheck && npm --prefix cli run build && npm --prefix cli test

  # Did Vercel even accept this commit? On main only, and deliberately outside the gate below.
  #
  # Vercel validates vercel.json and the function budget BEFORE it creates a deployment, so a
  # refusal produces no build, no deployment row and no deployment_status event - nothing but a
  # `Vercel` commit status here on GitHub. On 2026-08-07 that froze production for eight commits
  # while every gate stayed green, and the only thing that eventually noticed was deploy-verify's
  # drift belt, hours later (docs/DEPLOYMENT.md). The status arrives within a minute of the push,
  # so asking for it here turns hours into minutes at the cost of one cheap job.
  #
  # The two local gates (check-vercel-config, check-function-budget) are what should catch this
  # before a push; this is the belt for the classes they cannot know about - a plan limit that
  # changed, a project setting, anything Vercel decides on its side.
  deployable:
    name: Vercel accepted the commit
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Wait for Vercel's verdict on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Poll rather than assume: the status is usually up within a minute, but a queued
          # deployment can take longer, and "no status yet" must never read as a refusal.
          #
          # The list endpoint, not the combined one: it is documented as reverse chronological,
          # so element 0 is the CURRENT verdict. Vercel posts pending first and then the result,
          # and reading the wrong one of those would either alarm early or miss the refusal.
          for i in $(seq 1 20); do
            # `|| true`: the step runs under `bash -e`, and a transient API failure must not be
            # reported as Vercel refusing the commit. No answer simply means keep waiting.
            VERDICT="$(gh api "repos/$GH_REPO/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0] | "\(.state) \(.description) \(.target_url)"' || true)"
            STATE="${VERDICT%% *}"
            case "$STATE" in
              failure|error)
                echo "::error title=Vercel refused this commit::${VERDICT#* }"
                echo "No deployment exists for it, so the Vercel dashboard shows nothing at all."
                echo "Reproduce locally: npm run check:vercel-config && npm run check:function-budget"
                exit 1
                ;;
              success)
                echo "Vercel accepted $SHA."
                exit 0
                ;;
            esac
            sleep 15
          done
          # Vercel is under no obligation to answer on our schedule, and a missing verdict is not
          # a refusal. deploy-verify's drift belt is what catches a deployment that never happens.
          echo "No Vercel verdict for $SHA within five minutes - leaving it to deploy-verify."

  # What can this change actually have broken? The answer decides both which specs run and how
  # many runners they are worth. It needs no dependencies - scripts/e2e-affected.mjs is node
  # builtins and git - so this job costs seconds, and every other E2E job waits on it.
  # THE REVIEW CHECK. `npm run queue:merge` posts the /check verdict as the `noacg/reviewed`
  # commit status on the branch tip; this job turns it into a check the merge queue can require.
  # On a pull request it reads the tip directly. On a merge group the commit under test is a
  # temporary merge GitHub made, so the pull request is read off the group's ref
  # (`gh-readonly-queue/main/pr-<n>-<base>`) and the status is looked up on ITS head. A branch
  # with no review status - or a failing one - cannot enter or pass the queue.
  reviewed:
    name: Reviewed
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Find the review status on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then
            NUMBER="$(echo "$GROUP_REF" | sed -nE 's#.*/pr-([0-9]+)-.*#\1#p')"
            [ -n "$NUMBER" ] || { echo "::error::cannot read a pull request number off $GROUP_REF"; exit 1; }
            SHA="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          else
            SHA="$PR_HEAD"
          fi
          STATE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '[.statuses[] | select(.context == "noacg/reviewed")][0].state // "missing"')"
          DESC="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '[.statuses[] | select(.context == "noacg/reviewed")][0].description // ""')"
          echo "noacg/reviewed on ${SHA}: ${STATE} ${DESC}"
          if [ "$STATE" != "success" ]; then
            echo "::error::no passing noacg/reviewed status on ${SHA} - queue with npm run queue:merge, which posts the /check stamp"
            exit 1
          fi

  plan:
    name: E2E plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: write` is for one thing: a main run that finds main already past its own commit
    # cancels itself (the "superseded" exit below). Cancelling is how it stays out of
    # main-health's verdicts - that script skips cancelled runs by design.
    permissions:
      contents: read
      actions: write
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      catalog: ${{ steps.plan.outputs.catalog }}
      matrix: ${{ steps.plan.outputs.matrix }}
      # The ASSIGNMENT: a JSON array of arrays, one explicit spec-file list per shard, bin-packed
      # by measured duration. `matrix` is sized from this same array, so the runner count and the
      # work handed out cannot disagree.
      shardSpecs: ${{ steps.plan.outputs.shardspecs }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The plan IS a diff, so the default shallow clone has nothing to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Work out what this change can affect
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.diff_base }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          # Student-release sprint (docs/GOALS_ARCHIVE.md "Student release"): a would-be FULL
          # escalation runs the focus set instead; the nightly still runs everything.
          # Delete this line when the sprint ends (scripts/e2e-lists.mjs says what else goes).
          # It deliberately does not apply to main - see the main branch below.
          E2E_SPRINT_FOCUS: '1'
        run: |
          set -euo pipefail
          # SUPERSEDED MAIN RUNS STOP HERE. main runs the full suite (below), and with landings
          # arriving every few minutes the full runs used to queue up behind each other: 496 of
          # 512 main runs in the 30 days to 2026-09-06 re-tested a commit that was already green
          # on its branch, 42% of all runner minutes. A run whose commit main has already moved
          # past answers a question nobody is asking - the newer run covers it - so it cancels
          # itself. Cancelled, not skipped-as-success: main-health and red-main-issue skip a
          # cancelled run rather than reading it as a verdict about that commit.
          # Both a push to main and a dispatch on main count: since the lander pushes main with
          # the workflow's token, main's runs arrive by dispatch. If the cancel itself fails, the
          # run simply carries on - a superseded run that completes costs minutes, a plan step
          # that fails would read as red main.
          if [ "$REF" = "refs/heads/main" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha 2>/dev/null || true)"
            if [ -n "$LATEST" ] && [ "$LATEST" != "$GITHUB_SHA" ]; then
              echo "::notice title=E2E plan::main is already at ${LATEST} - this run for ${GITHUB_SHA} is superseded and cancels itself."
              if gh run cancel "$GITHUB_RUN_ID"; then
                sleep 30
                exit 1
              fi
            fi
          fi
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; elif [ "$EVENT" = "merge_group" ]; then BASE="$MERGE_GROUP_BASE"; else BASE="$PUSH_BEFORE"; fi
          # The fork-point base below asks "is this merge's second parent contained in main?",
          # which needs a main ref to ask it OF. `fetch-depth: 0` above brings the remote branches
          # with it, but a missing `origin/main` would make that question answer "no merge here"
          # and quietly hand back the narrow base - a silent hole where a loud one belongs. So
          # fetch it if it is absent, and if it still cannot be had, run everything.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main' || true
          fi
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::warning title=E2E plan::No origin/main to measure a merge against - running the FULL suite."
            BASE=""
          fi
          # A DISPATCH THAT WAS TOLD WHAT TO MEASURE FROM. Only `auto-merge.mjs` passes one, and
          # only because its dispatch stands in for a push run the webhook was late delivering;
          # planning the full suite there asks for about three times the work with minutes left
          # on the landing's clock, which is how j-0438 and j-0445 died on 2026-09-03. The base
          # it passes is the main sha it integrated, so `--integration` below moves to the same
          # fork point the push run would have used and the two runs plan identically. A base
          # that is empty or unreachable falls through to the escalation below, unchanged: this
          # can only ever make a dispatch narrower ON PURPOSE, never by accident.
          #
          # It carries the same `origin/main` condition as the fork-point recovery below, and for
          # the same reason: `--integration` asks whether this commit merged something main does
          # not have, and without a main ref that question answers "no merge here" and quietly
          # hands back a narrow base. A run that has already given up on finding main runs
          # everything, whatever it was told.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${DISPATCH_BASE:-}" ] \
            && git rev-parse --verify --quiet origin/main >/dev/null \
            && git cat-file -e "${DISPATCH_BASE}^{commit}" 2>/dev/null; then
            echo "::notice title=E2E plan::Dispatched with diff_base ${DISPATCH_BASE} - planning what changed since it rather than running everything."
            BASE="$DISPATCH_BASE"
          fi
          # RECOVER A BASE INSTEAD OF ESCALATING - but only for an ordinary branch PUSH.
          # `github.event.before` is all zeros on the FIRST push of a branch, so a brand-new
          # branch had no diff base and ran the FULL suite whatever it contained. That is not a
          # rare corner here: the rhythm is a fresh worktree and a new branch per task, and
          # safe-merge Phase 3 pushes that branch to get its verdict - so EVERY safe-merge paid
          # for a full suite before anything else happened. Measured 2026-08-25 on
          # `claude/vercel-team-rename`: two files, both already in the planner's IGNORE list
          # (`docs/` and `.github/`), classifier verdict `mode: none` - and 9 shards ran.
          #
          # The fork point answers the same question honestly. It is an ancestor of HEAD, so its
          # diff covers this branch's own work PLUS anything main did since the fork: it can only
          # ever plan MORE than the truth, never less. That is the same argument `--integration`
          # below already rests on.
          #
          # Deliberately NOT applied to `workflow_dispatch`. A dispatched run has no base either,
          # and that is exactly how `gh workflow run ci.yml --ref <branch>` forces a full suite -
          # the documented way to answer a preflight that refuses a skipped-shard run. Recovering
          # a base there would quietly remove the one manual door for demanding everything.
          # `main` is untouched too: it runs everything by the block below, on purpose.
          #
          # Since 2026-09-06 the fork point is the base of EVERY branch push, not only a first
          # one. `github.event.before` is the previous push, and a plan measured from it covers
          # only the delta since then; when a follow-up push cancelled the run in flight, the new
          # run planned past a delta nothing had covered and reported green having skipped every
          # shard (the class of failure `warn-command.mjs`'s push notice exists to point at, 16
          # handoffs deep). The fork point is an ancestor of HEAD whatever came before, so the
          # plan is the same honest answer every time: this branch's whole work, plus what main
          # brought in since the fork. It can only plan MORE than `before`, never less.
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ] \
            && git rev-parse --verify --quiet origin/main >/dev/null; then
            FORK="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            if [ -n "$FORK" ] && git cat-file -e "${FORK}^{commit}" 2>/dev/null; then
              # On a branch that has merged main this is the merged-in main sha, and `--integration`
              # below walks it back to the true fork point; the two agree on what to plan.
              echo "::notice title=E2E plan::Measuring from the merge-base with main, ${FORK} (the base of every branch push)."
              BASE="$FORK"
            fi
          fi
          # MAIN RUNS EVERYTHING. Every other run tests what THIS change can affect, which is
          # the right economics for a branch and the wrong one for the branch production ships
          # from: a spec no change maps to is never selected, so it can break and stay green
          # for as long as nobody escalates. That is not hypothetical - on 2026-08-07
          # e2e/public-service.spec.ts was red on main through eight consecutive green main
          # runs, and what finally surfaced it was an unrelated branch touching package.json
          # and escalating to the full suite by accident.
          #
          # The nightly already runs everything, so this buys LATENCY, not coverage: minutes
          # instead of up to a day, on the branch where a regression is already live. It costs
          # about two minutes of wall clock (the eight shards run in parallel) and no money -
          # the repo is public. The sprint's focus collapse is skipped here on purpose; focus
          # is a device for keeping BRANCH runs cheap, and main is where the paused areas are
          # supposed to be watched.
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "::notice title=E2E plan::main - running the FULL suite regardless of the diff."
            PLAN="$(node scripts/e2e-affected.mjs --json --all)"
          # An absent, all-zero or garbage-collected base means we cannot know what changed.
          # Then we do not guess: the fallback is the whole suite, because the one thing a
          # fallback must never do is run LESS than the truth. Since the fork-point recovery
          # above, this is the LAST resort rather than the first push of every branch - it is
          # what a dispatched run, or a branch with no reachable `origin/main`, still lands on.
          elif [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice title=E2E plan::No usable diff base ('${BASE}') - running the FULL suite."
            PLAN="$(node scripts/e2e-affected.mjs --json --all)"
          else
            # `--integration` is what makes a MERGE COMMIT honest. Without it the base is the
            # pre-merge branch tip, so the diff is only what `main` brought in and the branch's
            # own work - the half that has never been tested against this tree - is invisible.
            # Replayed over the last 120 merge-of-main commits here, 71 (59%) would have been
            # planned differently: 17 skipped the catalog calibration gate the combined tree
            # needed, and 8 skipped E2E entirely with `mode: none`, reporting green on a
            # combination nothing had run. The flag moves the base to the FORK POINT, which is
            # always an ancestor of this one, so it can only ever plan MORE. On a branch that
            # merged nothing it does nothing at all, and `$BASE` is used exactly as before.
            PLAN="$(node scripts/e2e-affected.mjs --json --integration "$BASE")"
          fi
          echo "plan: $PLAN"
          # The shard count comes WITH the plan (scripts/e2e-affected.mjs `shardsFor`), sized from
          # measured minutes per spec file rather than from a file count. It used to be computed
          # here, as `full ? 9 : min(4, floor(files / 4))`, and the cap was expensive: a "subset"
          # under sprint focus is routinely 70-100 of the 128 spec files, so run 32174589727 put
          # 58.3 minutes of tests on four runners - 14.6 min a shard, against 7.4 on the full run
          # beside it. Arithmetic that decides how long everyone waits belongs in the tested
          # module, not in a YAML string nothing can exercise.
          # `shardspecs` is the per-runner file list and `matrix` is sized from its length, so a
          # shard index always has work: an EMPTY Playwright filter list is not "no tests", it is
          # every test, and a matrix wider than the assignment would hand some runner exactly that.
          # Shard balance is only as good as the durations table, and a stale one now costs a
          # cancelled run rather than only wall clock. Its own command, NOT redirected into
          # $GITHUB_OUTPUT - a workflow command written there would corrupt the step's outputs
          # instead of annotating the run.
          node -e '
            const plan = JSON.parse(process.argv[1]);
            if (plan.unmeasured && plan.unmeasured.length) {
              console.log("::warning title=E2E plan::" + plan.unmeasured.length +
                " spec file(s) have no measured duration and were packed at the median: " +
                plan.unmeasured.join(", ") + ". Refresh with: npm run record:e2e-durations");
            }
            // The plan now states the WALL CLOCK it expects of each runner - measured tests plus
            // the measured per-job overhead - so a run that cannot fit its own cap says so before
            // it starts rather than arriving as a cancelled shard nobody can read a verdict from.
            if (plan.overCap) {
              console.log("::warning title=E2E plan::" + plan.overCap + " of " + plan.predicted.length +
                " shard(s) predicted too close to the 20-minute job cap (minutes: " + plan.predicted.join(", ") +
                "). Re-measure with: npm run record:e2e-durations, or narrow the plan (docs/TEST_SELECTION.md).");
            }
          ' "$PLAN"

          node -e '
            const plan = JSON.parse(process.argv[1]);
            const shards = plan.shardSpecs.length || 1;
            console.log([
              `mode=${plan.mode}`,
              `specs=${plan.specs.join(" ")}`,
              `catalog=${plan.catalog}`,
              `shardspecs=${JSON.stringify(plan.shardSpecs)}`,
              `matrix=${JSON.stringify({ shardIndex: Array.from({ length: shards }, (_, i) => i + 1), shardTotal: [shards] })}`,
            ].join("\n"));
          ' "$PLAN" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E ${{ matrix.shardIndex }}/${{ matrix.shardTotal }} (${{ needs.plan.outputs.mode }})
    needs: plan
    # 'none' means the change cannot reach the offline E2E surface at all (docs, a workflow's
    # own prose, a script the app never loads). Skipping is the plan being believed, not the
    # gate being weakened - anything it is unsure about became 'full' upstream.
    if: ${{ needs.plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish so one failure cannot hide another and all evidence reaches
      # the combined report.
      fail-fast: false
      # Sized by the plan job, not fixed here, and since 2026-08-19 sized from MEASURED MINUTES
      # (scripts/e2e-affected.mjs `shardsFor`, scripts/e2e-durations.json): about three minutes
      # of test execution per runner, capped at nine. The full suite is 66.9 measured minutes, so
      # a full plan is held at nine by the cap - the count this comment has argued for since
      # 2026-08-08, unchanged.
      #
      # What changed is the SUBSET, which used to be capped at four runners however big it was:
      # under sprint focus and the curated map a subset is routinely 70-100 of the 128 spec
      # files, so run 32174589727 put 58.3 minutes of tests on four shards (14.6 min each) while
      # the full run beside it did 66.9 on nine (7.4 min each). A targeted run that finishes
      # later than the exhaustive one is not a cheaper answer, it is a slower one.
      #
      # Three minutes and not more because a shard is now CHEAP to add - about one minute all in
      # (0.3 of job setup, 0.7 of Playwright start and dev-server boot), where before the apt
      # change below it was 3.5. That is why the old "one runner per ~4 spec files, capped at
      # four" was right at the time and is wrong now.
      #
      # "ABOUT ONE MINUTE" WAS A READING FROM A GOOD DAY, and on 2026-09-04 it was corrected. The
      # 0.3 assumed a cached `npm ci` costing 0.13 min; measured over the 90 shard jobs of the ten
      # runs to that morning, the install averaged 6.4 minutes and reached 10.2 at the p90 - not
      # workload but registry variance, with one shard of run 33854844447 installing 304 packages
      # in 8 seconds while another took 10 minutes for the same 304, same lockfile, same run. That
      # is what killed two shards of the first bin-packed run, each carrying only 9.8 measured
      # minutes. `./.github/actions/node-modules` takes npm out of a capped job's critical path,
      # and `scripts/e2e-durations.json` now RECORDS the per-job cost so the plan predicts wall
      # clock instead of assuming the good day. See docs/VERIFICATION.md.
      #
      # Nine and not twelve, even though the arithmetic keeps improving: every shard is an
      # independent runner doing its own checkout and install, so the chance that ONE of them
      # hits an infrastructure hiccup grows with the count, and with retries: 0 and
      # fail-fast: false a single hiccup reds the whole gate. Nine takes most of the win for
      # a fraction of the added surface, and leaves room under the 20-concurrent-job ceiling
      # for an overlapping PR run - which is a real constraint here, not a theoretical one:
      # measured over the 60 runs to 2026-08-19, runs that started while two other branches
      # were mid-gate waited 22 to 45 minutes in the queue before a shard began.
      #
      # THE NINTH SHARD IS HEADROOM, NOT SPEED. That much is unchanged; what changed on
      # 2026-09-04 is how the work reaches those nine runners.
      #
      # Until then Playwright split the plan itself with `--shard=i/n`, which divides by test
      # COUNT, and this comment argued the residual imbalance was tolerable. It stopped being
      # tolerable. Measured across the 30 ci.yml runs on main from 2026-09-02 23:06 to
      # 2026-09-04 02:23, the per-shard mean on the 26 green runs was 8.8 / 14.6 / 10.1 / 12.5 /
      # 11.0 / 11.1 / 13.0 / 12.3 / 12.4 min - a 1.66x spread with nothing wrong, shard 2 sitting
      # at 14.6 against this 20-minute cap while shard 1 idled at 8.8. Ordinary runner variance on
      # top of that tipped 4 of those 30 runs over the cap, and a shard killed by `timeout-minutes`
      # is recorded as `cancelled`, which makes the whole RUN cancelled and leaves every gate
      # downstream reading a verdict that was never reached.
      #
      # So the plan job now BIN-PACKS spec files by measured duration (`packShards`,
      # scripts/e2e-affected.mjs) and hands each runner an explicit file list. The nine bins come
      # out at 11.05-11.11 min against a balanced 11.08 - a 1.005 spread - which turns shard 2's
      # 2.6 minutes of headroom into about eight.
      #
      # THE OBJECTION THIS COMMENT USED TO RAISE IS ANSWERED, not ignored: an explicit file list
      # means a spec missing from the assignment is a spec nobody runs. `packShards` therefore
      # enumerates the suite from the e2e DIRECTORY and uses the durations table for weights only,
      # so an unmeasured spec is packed at the median rather than dropped, and it asserts that the
      # union of the bins is exactly its input, throwing here in the plan job if it is not.
      #
      # Raising timeout-minutes remains refused for the reason it always was: a loose budget makes
      # the timeout stop distinguishing a genuinely hung shard from a busy one, which is the whole
      # reason the limit exists. Keep it at 20 and make the shards fit.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      # Cache the browser binary rather than pulling ~170 MB from the Playwright CDN once per
      # shard, and bound the apt call that used to hang. Shared with the two gate jobs below.
      - uses: ./.github/actions/playwright-chromium

      - name: E2E shard
        env:
          SHARD_SPECS: ${{ needs.plan.outputs.shardSpecs }}
          SHARD_INDEX: ${{ matrix.shardIndex }}
          # Without `--shard` Playwright would write `report.zip` on every runner, and the report
          # job flattens all nine artifacts into one directory - see playwright.config.ts.
          NOACG_BLOB_NAME: report-${{ matrix.shardIndex }}.zip
        # This shard's own file list, as anchored Playwright filters. `specFilterArg` builds them
        # in tested code rather than here, because the anchoring is load-bearing: Playwright's
        # positional args are REGEXES over the file path, so a bare `control.spec.ts` also selects
        # `ai-more-control.spec.ts` and `hosted-control.spec.ts`. Under the old `--shard=i/n` that
        # cost nothing; handing out per-shard lists, it would run five spec files twice.
        #
        # An empty list is refused rather than passed on. Playwright reads no filter as EVERY
        # test, so an assignment gone wrong must stop the shard instead of quietly running the
        # whole suite nine times.
        #
        # `$SPECS` is then deliberately unquoted, so word splitting turns it back into separate
        # arguments. That also exposes each filter to PATHNAME EXPANSION, and every one of them
        # opens with `[\\/]` - a glob bracket. It is safe because no file matches, and bash leaves
        # a non-matching pattern as its literal self; checked by expanding the real filters, which
        # come through byte-identical. It would stop being safe under `failglob` or `nullglob`,
        # so do not set either here.
        run: |
          SPECS="$(node -e '
            const bins = JSON.parse(process.env.SHARD_SPECS ?? "[]");
            const mine = bins[Number(process.env.SHARD_INDEX) - 1];
            if (!Array.isArray(mine) || mine.length === 0) {
              console.error(`shard ${process.env.SHARD_INDEX} has no spec files in the plan`);
              process.exit(1);
            }
            import("./scripts/e2e-affected.mjs").then((m) => console.log(mine.map(m.specFilterArg).join(" ")));
          ')"
          echo "::notice title=E2E shard ${SHARD_INDEX}::$(echo "$SPECS" | wc -w) spec file(s)"
          npm run test:e2e -- $SPECS

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The catalog calibration tripwire benches every variant, so it is far too heavy to run on
  # every change - but a pack merge is exactly when it earns its cost, and waiting for the
  # nightly would let a broken variant sit in main all day. The plan raises this flag only for
  # changes that can move catalog output or the bench itself, so most merges never see it.
  e2e-catalog:
    name: Catalog calibration gate
    needs: plan
    if: ${{ needs.plan.outputs.catalog == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      # The cheap half first, and on purpose. It answers the SOURCE questions - every design's
      # emitted html/css/js against the committed fingerprints, the hidden-data-holder rule and
      # the name collisions - in about three seconds, with no dev server and no /app boot, so a
      # drifted emit is named before the 25-minute tripwire below has finished starting.
      - name: Catalog emit fingerprints
        run: npm run check:catalog-emit

      - name: Catalog calibration tripwire
        run: npm run test:e2e:catalog

  factory:
    name: Factory gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node_modules from cache, or `npm ci` on a miss - the action carries the measurement.
      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      # No dev server needed: it bundles the catalog into a blank Chromium page, so it runs
      # BEFORE the factory's server and answers in about two seconds. Outside `npm run build`
      # for the same reason `check:catalog-emit` is - the search index is built out of CREATED
      # designs, and creating one parses the html it just emitted, so it needs a real DOM. It had
      # no CI home at all until an occasion widened the credits vocabulary and the miss reached
      # the merge queue.
      - name: Search and occasion gates
        run: npm run test:use-case-search

      # Four node-level gates that are outside `npm run build` on purpose: they spawn servers
      # and subprocesses, and roughly doubling the build's test time on every laptop to catch
      # them is a bad trade. On a runner they cost about twelve seconds together, and until now
      # they ran only when somebody typed the command. `check:gate-coverage` keeps this honest.
      - name: Node gates outside the build
        run: |
          npm run test:ports
          npm run test:sample-names
          npm run test:local-relay
          npm run test:ai-lite-semantic

      # The factory needs a dev server. Its dedicated runner prevents a collision with the
      # offline-pinned Playwright servers, and the shell trap always cleans the process up.
      - name: Run factory gates
        run: |
          npm run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          PORT="$(node scripts/dev-port.mjs)"
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/app" > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Dev server did not become ready on port ${PORT}" >&2
            exit 1
          fi
          node scripts/factory.mjs --json factory-report.json

      - name: Upload factory report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-report
          path: factory-report.json
          retention-days: 7
          if-no-files-found: ignore

  # CONVENIENCE, NOT A GATE. This job runs no test and asserts nothing about the code: it
  # stitches the shards' blob reports into one browsable HTML report. It is deliberately absent
  # from the `gate` job's `needs` below, and the reason is written there.
  e2e-report:
    name: Combined E2E report
    # Nothing to merge when the plan ran no specs: there are no blob reports, and the merge
    # would fail on an empty input rather than say "there was nothing to report".
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'none' }}
    needs: [plan, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout stays (it costs a couple of seconds and gives us the lockfile); the `npm ci`
      # that used to follow it does not. Merging blob reports needs exactly one package, so
      # installing this repository's entire dependency tree to reach it was ~40 s of work per
      # run for a job that tests nothing. The version is read from the lockfile rather than
      # from an installed tree, so the merger is exactly the Playwright the shards wrote those
      # blobs with - a mismatch there is the one way this step can fail for a real reason.
      # `setup-node` goes with it: the runner image's own Node is enough to parse one JSON file
      # and run one `npx`, and this job builds nothing that could depend on the version.
      # The other way it fails is not real: `npx` fetches the package from the registry every
      # time, and on 2026-09-05 one ECONNRESET there turned a run whose every shard was green
      # into a red main that held the landing queue until a person re-ran it. Hence the retry.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Resolve the Playwright version from the lockfile
        id: playwright-version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "Merging with @playwright/test@${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: |
          set -uo pipefail
          # Three tries, because the fetch is the flaky half and the merge is deterministic.
          for attempt in 1 2 3; do
            if npx --yes "@playwright/test@${PLAYWRIGHT_VERSION}" merge-reports --reporter=html ./all-blob-reports; then
              exit 0
            fi
            echo "merge-reports attempt ${attempt} failed - retrying in 20 s"
            sleep 20
          done
          echo "::error title=Combined report::merge-reports failed three times - registry fetch or a real merge fault; read the attempts above."
          exit 1

      - name: Upload combined E2E report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  gate:
    name: CI gate
    if: ${{ !cancelled() }}
    # `e2e-report` is deliberately NOT here. Everything else in this list runs the repository's
    # code and can therefore be wrong about it; the report job merges artifacts and runs no
    # test, so its failure says only that nobody gets a browsable HTML report. It adds no
    # coverage either: a shard that produced no blob report already fails IN THE SHARD, via
    # `if-no-files-found: error` on its upload, and the shards are required below.
    #
    # This is not a relaxation of the strictness below - that stands, and should. For a job
    # that tests code, "died on infrastructure" is genuinely indistinguishable from "found a
    # fault", so the doctrine is to fail toward noise. For a job that tests nothing, both
    # readings say the same thing about the commit: nothing at all. On 2026-08-06 a GitHub
    # Actions outage killed this job twice on `main` (runs 31113465980 and 31123645874) while
    # every code-testing job passed, and both times the gate went red and filed the rolling
    # red-main issue against a commit nothing was wrong with. A gate whose verdict can be
    # flipped by a job with no opinion about the code is reporting on the wrong thing.
    needs: [build, plan, e2e, e2e-catalog, factory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the main-branch failure steps file/close a rolling issue
      actions: read # read this run's own jobs, to name WHAT failed
      checks: read # and their annotations - Playwright's github reporter puts the spec there
    steps:
      # The failure step below runs a script, so the scripts have to be here. One directory, in
      # cone mode, and nothing else: this job needs no dependencies (red-main-issue.mjs and the
      # ci-failure-set.mjs it imports are node builtins plus `gh`), and no setup-node - the runner
      # image's own Node runs them, the same argument `e2e-report` makes for its `node -p`. A
      # couple of seconds on a job that is otherwise pure waiting.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      # A stable final check is easier to protect than a set of generated matrix-job names.
      # Each failed gate is named as an error annotation, so a red run says WHICH job to
      # open instead of only being red.
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CATALOG_RESULT: ${{ needs.e2e-catalog.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          status=0
          exhausted=0
          fail() {
            echo "::error title=CI gate::$1 finished '$2' - open that job's log; the failing command and test names are annotated there."
            status=1
          }
          # RAN OUT OF CLOCK IS NOT FOUND A FAULT. A job killed by its own `timeout-minutes` is
          # recorded by GitHub as 'cancelled', and this gate used to call that a failure - so on
          # 2026-09-04 run 33829325663, where four E2E shards hit the 20-minute cap and every
          # other job was green, the gate went red and the alarm below filed issue #52 saying it
          # could not name what failed. It could not, because nothing had.
          #
          # The run is still NOT A PASS - no verdict was reached, and a gate that exits 0 here
          # would close the red-main issue and paint the commit green on the strength of tests
          # that never finished. So this still exits non-zero. What changes is what it SAYS.
          #
          # WHAT THIS STEP CANNOT SEE, and why it does not decide: `needs.e2e.result` collapses
          # nine matrix legs into one word, so a run where one shard FAILED a spec and another was
          # killed at the cap can reach here as 'cancelled'. Naming a fault is therefore left to
          # the alarm step below, which reads the run's own per-job conclusions
          # (`failureSet`/`anyFailed`) and can tell those two apart. This wording says what the
          # aggregate suggests; that script says what is true.
          exhaust() {
            echo "::warning title=CI gate::$1 finished '$2' - no leg reported a fault, so this looks like running out of time rather than finding one. No verdict either way, so the run is not a pass. The red-main step below reads the per-job conclusions and decides whether anything is actually broken."
            exhausted=1
          }
          # Always runs, so anything but success is a fault. The plan belongs here: if it
          # cannot decide what to test, no downstream skip may be read as approval.
          require() {
            [ "$2" = "success" ] || fail "$1" "$2"
          }
          # Runs only when the plan asked for it. 'skipped' here is the plan being believed -
          # and the plan is itself required above, so a skip can never be covering for a
          # crashed planner.
          optional() {
            case "$2" in
              success|skipped) ;;
              cancelled) exhaust "$1" "$2" ;;
              *) fail "$1" "$2" ;;
            esac
          }
          require "Build (typecheck + lint + bundle)" "$BUILD_RESULT"
          require "E2E plan" "$PLAN_RESULT"
          require "Factory gates" "$FACTORY_RESULT"
          optional "E2E shards" "$E2E_RESULT"
          optional "Catalog calibration gate" "$CATALOG_RESULT"
          # Exhausted with nothing failed is still a non-zero exit: no verdict is not a pass.
          if [ "$status" = "0" ] && [ "$exhausted" = "1" ]; then
            exit 1
          fi
          exit "$status"

      # Fail-loud on main, the weekly-audit pattern: ONE rolling issue, closed by the next green.
      #
      # WHAT IT SAYS AND WHEN is scripts/red-main-issue.mjs, with the reasoning and the receipts in
      # its header and its unit tests. In one line: a re-run of a reported commit is silent (as
      # before), a repeat of the SAME failing spec set is silent (new since 2026-08-29 - that is
      # the 27-emails-for-one-bug fix), and anything else - a new spec, a changed set, a set this
      # gate could not identify - always comments. The run goes red either way.
      #
      # THIS STEP DECIDES WHETHER A RUN WAS MERELY EXHAUSTED, and it is deliberately the only
      # thing that does. A workflow-level condition could only test `needs.e2e.result`, which
      # collapses nine matrix legs into one word - so a run with one failed shard and one killed
      # at the cap would be skipped as "exhausted" and a real regression would go unreported.
      # `planRedMainComment` reads the per-job conclusions instead and can tell them apart.
      - name: File / update the red-main issue
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/red-main-issue.mjs

      - name: Close the red-main issue
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI is red on main"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Green again at ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
