name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landing-worker-pilot
  cancel-in-progress: false
jobs:
  pilot:
    name: Pilot ${{ matrix.arm }} workers ${{ matrix.workers }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { arm: baseline-a, workers: 1 }
          - { arm: two, workers: 2 }
          - { arm: four, workers: 4 }
          - { arm: baseline-b, workers: 1 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/node-modules
      - uses: ./.github/actions/playwright-chromium
      - name: Hardware
        run: |
          lscpu
          free -m
      - name: E2E pilot
        env:
          PILOT_ARM: ${{ matrix.arm }}
        run: |
          /usr/bin/time -v npx playwright test 'e2e/wizard-kit.spec.ts$' 'e2e/editor-model-proposals.spec.ts$' 'e2e/editor-commands.spec.ts$' 'e2e/playout-feedback-health.spec.ts$' --workers=${{ matrix.workers }} --reporter=line,./scripts/landing-pilot-reporter.mjs,./scripts/e2e-run-integrity.mjs
      - name: Warm page boot
        if: matrix.arm == 'baseline-a'
        run: npx playwright test 'e2e/landing-boot-pilot.spec.ts$' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ matrix.arm }}
          path: |
            pilot.json
            boot-pilot.json
            test-results
          retention-days: 7
