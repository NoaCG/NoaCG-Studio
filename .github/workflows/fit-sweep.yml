# THE FIT SWEEP, EVERY NIGHT - so the text-fit ladder is tried over every combination without
# anybody having to remember to run it (issue #778). The owner, 2026-09-03: "I wish that this could
# just be automated - the testing - and that it would try all the combinations until it works."
#
# WHAT IT RUNS is `scripts/svg-import-sweep.mjs --ladder`: every bound field of every corpus file,
# times every too-long option, times every value length (`scripts/ladder-values.mjs`), asserting the
# ladder's ORDER rather than a table of numbers. About 3,000 cases, so the corpus is split over
# four runners (`--shard i/n`), each with its own dev server: about fifteen minutes each.
#
# WHAT FAILS IT is a REGRESSION, not a finding. The corpus carries known findings, and a job that is
# red every night is a job nobody reads. `scripts/fit-sweep-verdict.mjs` compares tonight with the
# LAST FIVE GREEN RUNS of this workflow on main - their findings are the artifact the verdict
# uploads - and fails on a defect none of them had, on a file the newest swept but tonight did not,
# or on a shard that sent nothing. Five rather than one because a few lines answer differently from
# run to run (the verdict's header says which and why), and one flip should not be an alarm. A
# green run becomes a baseline, so a fix drops out on its own and a regression stays red every
# night until it is fixed. To live with a new finding on purpose, dispatch with `accept`: that run
# records its findings and is not judged.
#
# The table is the job summary: file, field, defect, and the options and lengths it fired on.
#
# PROVEN BEFORE IT LANDED with a temporary push trigger, since a dispatch-only workflow cannot run
# on the branch that adds it. Runs 38008094093 and 38008156945 swept one tree and agreed case for
# case (3,072 cases); before the sweep read the document it asked for, two runs of one tree
# (37998979439, 38001827740) differed by over 200 findings. Prove it the same way after changing
# how the sweep waits.
#
# NOT WATCHED BY nightly-drift.yml YET. Its watch alarms on the first check after a schedule lands
# if the cron has not fired, so the entry goes in once a scheduled run exists.

name: fit-sweep

on:
  schedule:
    # 01:35 UTC: a minute no other cron here uses, after the nightly's 00:20. GitHub fires
    # scheduled events one to three hours late (nightly.yml has the measurements), which still
    # lands this before the start of the day in Helsinki.
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      accept:
        description: 'Record this run as the baseline instead of judging it (for findings decided to be acceptable).'
        type: boolean
        default: false

concurrency:
  group: fit-sweep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the verdict downloads the recent green runs' findings

jobs:
  sweep:
    name: Fit sweep ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      # The dev server and its readiness poll are catalog-gates.yml's, which is proven. The sweep
      # drives this checkout's reserved port by default, the same one `dev-port.mjs` prints here.
      # It exits 0 with findings: judging them is the verdict job's work.
      - name: Sweep this shard of the corpus
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npm run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          PORT="$(node scripts/dev-port.mjs)"
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/app" > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Dev server did not become ready on port ${PORT}" >&2
            exit 1
          fi
          node scripts/svg-import-sweep.mjs --ladder --shard "${SHARD}/4" --json "ladder-${SHARD}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: fit-sweep-shard-${{ matrix.shard }}
          path: ladder-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

  verdict:
    name: Fit sweep verdict
    needs: sweep
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: fit-sweep-shard-*
          path: shards
          merge-multiple: true

      # The last five GREEN runs on main, newest first, whatever started them - a dispatch with
      # `accept` is a green run on purpose. Not this run, and best effort: with none (the first
      # night, or past the artifact's retention) the verdict says so and tonight becomes the
      # baseline. The paths are written in order, so the verdict knows which run is the newest.
      - name: Fetch the recent green runs' findings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          : > baselines.txt
          for ID in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow fit-sweep.yml --branch main --status success \
            --limit 6 --json databaseId --jq ".[] | select(.databaseId != ${RUN_ID}) | .databaseId" | head -5); do
            if gh run download "$ID" --repo "$GITHUB_REPOSITORY" --name fit-sweep-findings --dir "baseline/$ID"; then
              echo "baseline/$ID/fit-sweep-findings.json" >> baselines.txt
            else
              echo "Run $ID has no findings to compare with."
            fi
          done
          echo "Comparing with $(wc -l < baselines.txt) green run(s)."

      # `$(cat baselines.txt)` unquoted on purpose: one argument per path, none holding a space.
      - name: Judge
        env:
          ACCEPT: ${{ inputs.accept && '--accept' || '' }}
        run: |
          node scripts/fit-sweep-verdict.mjs --shards 4 \
            --current shards/ladder-*.json \
            --baseline $(cat baselines.txt) \
            --out fit-sweep-findings.json --summary "$GITHUB_STEP_SUMMARY" $ACCEPT

      # Uploaded whatever the verdict, so a red night can be read; only a GREEN run's copy is
      # ever used as a baseline, because the fetch above asks for successful runs alone.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: fit-sweep-findings
          path: fit-sweep-findings.json
          retention-days: 90
          if-no-files-found: ignore
