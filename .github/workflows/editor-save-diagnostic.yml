name: Editor save diagnostic
on:
  push:
    branches: [codex/editor-save-context-fix]
  pull_request:
    branches: [main]
jobs:
  diagnose:
    if: github.ref_name == 'codex/editor-save-context-fix' || github.head_ref == 'codex/editor-save-context-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: ./.github/actions/node-modules
      - uses: ./.github/actions/playwright-chromium
      - name: Preserve original Chromium protocol error
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'node_modules/playwright-core/lib/coreBundle.js';
          const source = fs.readFileSync(file, 'utf8');
          const message = 'throw new Error("Execution context was destroyed, most likely because of a navigation.");';
          if (!source.includes(message)) throw new Error('Playwright diagnostic location changed');
          fs.writeFileSync(file, source.replaceAll(message, 'throw new Error("Original browser error: " + error.message);'));
          NODE
      - name: Reproduce with CI tracing
        run: npx playwright test e2e/editor-base-edits.spec.ts --workers=1 --trace=on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-save-diagnostic-${{ github.event_name }}
          path: test-results/
