# The landing queue, on GitHub's runners (docs/WORKFLOW_ARCHITECTURE.md §5.2).
#
# A pull request against main that carries the `land` label is landed by scripts/land.mjs: main
# is merged into the branch, the merge commit gets its own ci.yml run (by dispatch, with the main
# sha it integrated as the diff base), and on a green `CI gate` main is fast-forwarded to it. One
# landing at a time - the `landing` concurrency group is the queue, and GitHub keeps at most one
# waiting run per group, so a burst of labels lands in label order without anything cancelled.
#
# This replaced the laptop lander (scripts/auto-merge.mjs under scripts/jobs.mjs) on 2026-09-06.
# Nothing here depends on any machine but a GitHub-hosted runner, and a ruleset
# (scripts/landing-ruleset.mjs) lets only this workflow and the repository admin push main.
#
# The `land` job needs no npm install: scripts/land.mjs and what it imports are dependency-free.
# The `migrate` job applies whatever production and staging are missing, from the `production`
# environment's SUPABASE_ACCESS_TOKEN; with no token it says so and the landing stands.
name: Land

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to land'
        required: true

concurrency:
  group: landing
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  land:
    name: Land
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'land'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      landed: ${{ steps.land.outputs.landed }}
    steps:
      # The scripts come from main, never from the branch being landed: a branch cannot change
      # how it is landed.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Land the pull request
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr || github.event.pull_request.number }}
        run: |
          git config user.name "noacg-lander"
          git config user.email "lander@noacg.studio"
          node scripts/land.mjs --pr "$PR"

  migrate:
    name: Apply migrations
    needs: land
    if: needs.land.outputs.landed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.land.outputs.landed }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/node-modules
      - name: Push what production and staging are missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice title=Migrations::No SUPABASE_ACCESS_TOKEN in the production environment - migrations stay on the maintainer's machine (supabase/AGENTS.md)."
            exit 0
          fi
          node scripts/migration-drift.mjs || true
          # Production first, then staging by name - db-push defaults to production, so the
          # staging push must say which project (scripts/supabase-projects.mjs).
          node scripts/db-push.mjs
          node scripts/db-push.mjs --ref "$(node -e "import('./scripts/supabase-projects.mjs').then((m) => console.log(m.stagingRef(process.env)))")"
