# ENDURANCE - one long software run, on demand only.
#
# The production-page plan needs a 60-minute endurance run of the whole election data path
# (docs/work-specs/playout-expanded-acceptance/spec.md, phase E8.1b) and, earlier, a short smoke
# of the election replay server and trusted agent (docs/work-specs/playout-external-connectors/
# spec.md, phase E4.1). Neither fits a pull-request job. And no phase of an unattended run should
# have to land a workflow file, because that needs a token with the `workflow` scope and would
# wait for the owner. So this generic workflow lands before the run opens, and those phases add
# only the npm scripts it runs.
#
# MANUAL DISPATCH ONLY: it never runs on a push or a pull request, so it is never a required
# check. Its own 90-minute job timeout leaves room for a 60-minute run plus install and teardown;
# no other workflow's timeout changed for it (owner, 2026-10-20).
#
# The script gets `--minutes <n>` and writes whatever it wants kept to `endurance-output/`, which
# is uploaded as an artifact even when the run fails. With `local-supabase` on, the local stack is
# started as configured-suite.yml starts it (scripts/configured-stack.mjs, which exports
# SUPABASE_WORKDIR); the script reads its identity with `supabase status -o json` itself, and the
# stack is taken down and proved gone after the run, a failure or a cancellation.

name: endurance

on:
  workflow_dispatch:
    inputs:
      script:
        description: The npm script to run, for example `endurance:election`
        required: true
        type: string
      minutes:
        description: How long the script runs, passed as --minutes (1 to 75)
        required: false
        default: '60'
        type: string
      local-supabase:
        description: Start the local Supabase stack first
        required: false
        default: false
        type: boolean

concurrency:
  group: endurance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.script }} for ${{ inputs.minutes }} min
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Inputs reach the shell only through env, never interpolated into the script text.
      - name: Check the inputs
        env:
          SCRIPT: ${{ inputs.script }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          case "$SCRIPT" in
            ''|*[!A-Za-z0-9:._-]*) echo "::error title=Bad script::the script input is not an npm script name"; exit 1 ;;
          esac
          # A pattern, not arithmetic: a long digit string would overflow `[ -lt ]`, which then
          # fails as a condition instead of stopping the step.
          case "$MINUTES" in
            [1-9]|[1-6][0-9]|7[0-5]) ;;
            *) echo "::error title=Bad minutes::minutes must be a whole number from 1 to 75, so the run ends inside the 90-minute job"; exit 1 ;;
          esac

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/node-modules

      - uses: ./.github/actions/playwright-chromium

      - name: Require the script in package.json
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          node -e 'const name = process.argv[1]; if (!(require("./package.json").scripts ?? {})[name]) { console.log(`::error title=No such script::package.json has no script "${name}"`); process.exit(1); }' "$SCRIPT"

      # Same CLI version as configured-suite.yml, for the same reason given there.
      - if: inputs.local-supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # Allocated, started and checked as the configured jobs do it (scripts/configured-stack.mjs).
      - name: Start the local Supabase stack
        if: inputs.local-supabase
        run: node scripts/configured-stack.mjs up --exclude studio,edge-runtime

      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
          MINUTES: ${{ inputs.minutes }}
        run: npm run "$SCRIPT" -- --minutes "$MINUTES"

      # After a failure or a cancellation too: stop this job's stacks and prove nothing is left of it
      # (no container, volume, network or process of it, no port of its block held). cf04.
      # The Realtime and Postgres logs, so a late or lost frame can be matched to what the stack did
      # at that moment (#2204: a tenant initialising, or an `ErrorSendingBroadcastMessage` warning).
      - name: Keep the stack's Realtime and Postgres logs
        if: always()
        run: |
          [ -n "$NOACG_STACK_PROJECT" ] || exit 0
          mkdir -p endurance-output/stack-logs
          for c in $(docker ps -a --filter "label=com.supabase.cli.project=$NOACG_STACK_PROJECT" --format '{{.Names}}' | grep -E 'realtime|_db_'); do
            docker logs --timestamps "$c" > "endurance-output/stack-logs/$c.log" 2>&1 || true
          done

      - name: Take the local stack down and prove it gone
        if: always()
        run: '[ ! -f scripts/configured-stack.mjs ] || node scripts/configured-stack.mjs down'

      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-${{ github.run_id }}
          path: endurance-output/
          if-no-files-found: ignore
          retention-days: 30
