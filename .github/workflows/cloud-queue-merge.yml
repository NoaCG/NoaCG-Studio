# Queue a cloud session's branch for landing: `/queue-merge` for a session that has no `gh`.
#
# `npm run queue:merge` needs a machine with a signed-in `gh`. A cloud session (Claude Code on the
# web) pushes its branch and opens its pull request with the GitHub tools it has, then dispatches
# THIS workflow with the tip it reviewed and its verdict in one line. The workflow's token posts the
# `noacg/reviewed` status on that exact tip and labels the pull request `land`. Then it waits for the
# pull request's own CI run and re-runs its `Reviewed` job if that had already given up on the
# stamp, because GitHub holds the pull request out of the queue while that red job stands. The
# session turns auto-merge on itself: a workflow token's auto-merge never reaches the merge queue.
# From there the queue lands it on CI like any other branch. scripts/cloud-queue.mjs is the prose
# and the refusals.
#
# Main's code does the stamping, never the branch's: the checkout is `main`, and a dispatch from any
# other ref is refused, so a branch cannot rewrite what stamps it.
name: Queue a cloud session's branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to land (its pull request against main must already be open).'
        required: true
        type: string
      sha:
        description: 'The full sha of the tip that was reviewed. A branch that moved since is refused.'
        required: true
        type: string
      review:
        description: 'The review verdict, one line: what was checked and that it passed.'
        required: true
        type: string

# One queueing per branch at a time; a second dispatch for the same branch waits for the first.
concurrency:
  group: cloud-queue-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    name: Stamp, label and queue
    if: ${{ github.repository == 'NoaCG/NoaCG-Studio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Most of this is waiting: a `Reviewed` job can only be re-run once the pull request's own run
    # has finished, and a full-suite run takes about twenty minutes (the script gives up at forty).
    timeout-minutes: 45
    permissions:
      # `read` again: `write` was only ever for enablePullRequestAutoMerge, and auto-merge thrown by
      # this token never reached the queue (pull request 393), so the session throws it instead.
      contents: read
      pull-requests: write # the `land` label
      issues: write # creating the label if it is missing
      statuses: write # the `noacg/reviewed` stamp
      actions: write # re-running the pull request's `Reviewed`, or dispatching ci.yml when it has no run
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Queue the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
          REVIEW: ${{ inputs.review }}
        run: node scripts/cloud-queue.mjs
