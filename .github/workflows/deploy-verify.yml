# Disposable, manual, contents-read-only probe. Never land this workflow.
name: deploy-verify
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Already verified production commit containing PR 968
        required: true
        type: string
permissions:
  contents: read
jobs:
  production-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify landed ordinary editor task on production
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: npx playwright test --config e2e/layer-property-production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landed-layer-property-task
          path: test-results/production/
