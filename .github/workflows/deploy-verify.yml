name: Leave-editor repair diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        ref: [ef3ada8f664d7da3976ad71bbaf33c58384590f9, fa468b2431530a7c3b64a6f28fa0fc842afaf5ef]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-player-host.mjs
      - run: npx playwright test e2e/editor-commands.spec.ts e2e/ograf-conformance.spec.ts e2e/project.spec.ts --grep 'commit receipt stays separate|two DIFFERENT graphics|the wizard mounts the same door' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-${{ matrix.ref }}
          path: test-results/
