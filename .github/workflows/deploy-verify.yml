# Disposable verification probe. Never land this branch or this workflow.
name: deploy-verify
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  canvas-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused layout camera gestures and group navigation
        run: npx playwright test e2e/editor-canvas-short-height.spec.ts --workers=1
      - name: Unchanged protected layer property transform CLI and entry regressions
        if: always()
        run: npx playwright test e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts e2e/editor-alpha-entry.spec.ts --workers=1
      - name: Desktop laptop and actual 125 percent cumulative journey
        if: always()
        run: xvfb-run -a npx playwright test e2e/independent-967-task.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-short-height-981-after
          path: test-results/
