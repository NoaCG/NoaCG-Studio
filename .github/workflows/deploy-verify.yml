name: Leave-editor repair-2 probe (disposable, never merge)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Bounded repair-2 verification selection
        type: choice
        options: [reproduce, complete]
        default: reproduce
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-player-host.mjs
      - name: Newer edit while Discard waits (carried probe and both waits)
        if: always()
        run: npx playwright test e2e/new-graphic-guard.spec.ts --grep 'newer edit' --workers=1 --retries=0 --output=.noacg/results/newer-edit
      - name: Fetch pinned references
        if: always() && inputs.scope == 'complete'
        run: |
          mkdir -p .noacg
          curl -fL https://github.com/zerodensity/ograf-studio/releases/download/v0.17/OGrafStudioServer-linux-x64 -o .noacg/studio-server
          echo '9ba1de317cdc8380c38a694f1d201964d7b805833597419111dab9eea9a02681  .noacg/studio-server' | sha256sum -c -
          chmod +x .noacg/studio-server
          git clone https://github.com/Eyevinn/ograf-editor.git .noacg/reference-eyevinn
          git -C .noacg/reference-eyevinn checkout 616841bd949e3a21137579451123f66c292543f0
          npm ci --prefix .noacg/reference-eyevinn
      - name: Execute pinned lifecycle tasks
        if: always() && inputs.scope == 'complete'
        env:
          REFERENCE_EXE: ${{ github.workspace }}/.noacg/studio-server
        run: xvfb-run -a npx playwright test e2e/leave-reference.spec.ts --workers=1 --retries=0 --output=.noacg/results/references
      - name: Complete lifecycle and preserved regressions
        if: always() && inputs.scope == 'complete'
        run: npx playwright test e2e/new-graphic-guard.spec.ts e2e/library.spec.ts e2e/wizard-draft-guard.spec.ts e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts e2e/editor-canvas-short-height.spec.ts e2e/editor-commands.spec.ts e2e/project.spec.ts e2e/route-transition-flash.spec.ts e2e/leave-checker.spec.ts --workers=1 --retries=0 --output=.noacg/results/maintained
      - name: Two sequential exported graphics
        if: always() && inputs.scope == 'complete'
        run: npx playwright test e2e/ograf-conformance.spec.ts --grep 'two DIFFERENT' --workers=1 --retries=0 --output=.noacg/results/export
      - name: Cumulative interaction and native zoom
        if: always() && inputs.scope == 'complete'
        run: xvfb-run -a npx playwright test e2e/interaction-probe-task.spec.ts e2e/interaction-checker-nested.spec.ts --workers=1 --retries=0 --output=.noacg/results/cumulative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leave-receipts
          include-hidden-files: true
          path: .noacg/results
