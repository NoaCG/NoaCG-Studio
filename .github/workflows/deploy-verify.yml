# Disposable independent checker. Never land this workflow.
name: deploy-verify
on:
  workflow_dispatch:
    inputs:
      scope:
        type: string
        default: fresh
        description: all also runs unchanged maintained regressions
permissions:
  contents: read
jobs:
  independent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch and verify official Studio v0.17
        run: |
          mkdir -p .noacg/independent-991
          curl -fL https://github.com/zerodensity/ograf-studio/releases/download/v0.17/OGrafStudioServer-linux-x64 -o .noacg/independent-991/studio-server
          echo '9ba1de317cdc8380c38a694f1d201964d7b805833597419111dab9eea9a02681  .noacg/independent-991/studio-server' | sha256sum -c -
          chmod +x .noacg/independent-991/studio-server
      - name: Unchanged layout layer property transform CLI and entry regressions
        if: inputs.scope == 'all'
        run: npx playwright test e2e/editor-canvas-short-height.spec.ts e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts e2e/editor-alpha-entry.spec.ts --workers=1
      - name: Fresh independent cumulative and actual native zoom checks
        env:
          REFERENCE_EXE: ${{ github.workspace }}/.noacg/independent-991/studio-server
        run: xvfb-run -a npx playwright test e2e/independent-991-task.spec.ts e2e/independent-991-reference.spec.ts e2e/independent-991-workspace.spec.ts --workers=1
      - name: Fresh served production journey and executable outputs
        env:
          EXPECTED_SHA: 5896c25a819132112e4f1a53664d153afe4080a1
          EXPECTED_IMPLEMENTATION: 0a04f77022b3e9f11d78615192956dca55edb549
        run: npx playwright test --config e2e/independent-991-production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-short-height-991
          path: test-results/
