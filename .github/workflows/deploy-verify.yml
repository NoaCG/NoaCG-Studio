name: Leave-editor repair verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-player-host.mjs
      - run: npx playwright test e2e/editor-commands.spec.ts e2e/ograf-conformance.spec.ts:386 e2e/project.spec.ts e2e/new-graphic-guard.spec.ts e2e/wizard-draft-guard.spec.ts e2e/route-transition-flash.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-verification
          path: test-results/
