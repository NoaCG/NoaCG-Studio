name: Leave-editor qualification probe
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [reproduce, complete, references, focused, mutation, visual]
        default: reproduce
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-player-host.mjs
      - name: Current product reproduction
        if: inputs.scope == 'reproduce'
        run: npx playwright test e2e/leave-probe.spec.ts --workers=1 --output=.noacg/results/reproduce
      - name: Fetch pinned references
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'references' || inputs.scope == 'reproduce')
        run: |
          mkdir -p .noacg
          curl -fL https://github.com/zerodensity/ograf-studio/releases/download/v0.17/OGrafStudioServer-linux-x64 -o .noacg/studio-server
          echo '9ba1de317cdc8380c38a694f1d201964d7b805833597419111dab9eea9a02681  .noacg/studio-server' | sha256sum -c -
          chmod +x .noacg/studio-server
          git clone https://github.com/Eyevinn/ograf-editor.git .noacg/reference-eyevinn
          git -C .noacg/reference-eyevinn checkout 616841bd949e3a21137579451123f66c292543f0
          npm ci --prefix .noacg/reference-eyevinn
      - name: Execute pinned lifecycle tasks
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'references' || inputs.scope == 'reproduce')
        env:
          REFERENCE_EXE: ${{ github.workspace }}/.noacg/studio-server
        run: xvfb-run -a npx playwright test e2e/leave-reference.spec.ts --workers=1 --output=.noacg/results/references
      - name: Complete lifecycle and preserved regressions
        if: inputs.scope == 'complete'
        run: npx playwright test e2e/new-graphic-guard.spec.ts e2e/library.spec.ts e2e/wizard-draft-guard.spec.ts e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts e2e/editor-canvas-short-height.spec.ts --workers=1 --output=.noacg/results/maintained
      - name: Final focused lifecycle
        if: inputs.scope == 'focused'
        run: npx playwright test e2e/new-graphic-guard.spec.ts --workers=1 --output=.noacg/results/focused
      - name: Mutate navigation boundary
        if: inputs.scope == 'mutation'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/router.ts')
          s=p.read_text()
          before="if (navigationGuard && routeHash(route) !== routeHash(useRouter.getState().route)) navigationGuard(proceed);\n  else proceed();"
          assert before in s
          p.write_text(s.replace(before,'proceed();'))
          PY
          mkdir -p .noacg
          set +e
          npx playwright test e2e/leave-probe.spec.ts --workers=1 --output=.noacg/results/mutation > .noacg/mutation.log 2>&1
          result=$?
          cat .noacg/mutation.log
          test "$result" -ne 0 && grep -q "getByTestId('editor-foundation')" .noacg/mutation.log
      - name: Cumulative interaction and native zoom
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'visual')
        run: xvfb-run -a npx playwright test e2e/interaction-probe-task.spec.ts e2e/interaction-checker-nested.spec.ts --workers=1 --output=.noacg/results/cumulative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leave-receipts
          include-hidden-files: true
          path: .noacg/results
