name: Editor interaction qualification probe
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification subset
        type: choice
        options: [reproduce, changed, complete, references]
        default: reproduce
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Reproduce missing interactions
        if: inputs.scope == 'reproduce' || inputs.scope == 'changed'
        run: npx playwright test e2e/editor-layer-property-qualification.spec.ts --grep 'modifier drag|keyboard duplicate|property reveal' --workers=1
      - name: Preserved cumulative regressions
        if: inputs.scope == 'complete'
        run: npx playwright test e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts e2e/editor-canvas-short-height.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-receipts
          path: |
            test-results
            blob-report

