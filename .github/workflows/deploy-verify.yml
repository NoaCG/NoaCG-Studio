name: Third independent leave-editor check (disposable, never merge)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Bounded independent verification selection
        type: choice
        options: [unchanged, complete, third, references, visual, export]
        default: unchanged
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-player-host.mjs
      - name: Unchanged original independent assertions
        if: inputs.scope == 'unchanged'
        run: npx playwright test e2e/leave-checker.spec.ts --workers=1 --output=.noacg/results/original
      - name: Unchanged second-checker assertions (lines 91 and 106, assertion 135)
        if: always() && inputs.scope == 'unchanged'
        run: npx playwright test e2e/leave-second-checker.spec.ts --workers=1 --output=.noacg/results/second
      - name: Unchanged reproduction recipe of run 38798506098
        if: always() && inputs.scope == 'unchanged'
        run: |
          npx playwright test e2e/leave-checker.spec.ts --workers=1 --output=.noacg/results/repro-original
          npx playwright test e2e/leave-second-checker.spec.ts --grep 'during autosave confirmation' --workers=1 --output=.noacg/results/autosave-race
      - name: Third checker adversarial challenges
        if: always() && (inputs.scope == 'third' || inputs.scope == 'complete')
        run: npx playwright test e2e/leave-third-checker.spec.ts --workers=1 --output=.noacg/results/third
      - name: Fetch pinned references
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'references')
        run: |
          mkdir -p .noacg
          curl -fL https://github.com/zerodensity/ograf-studio/releases/download/v0.17/OGrafStudioServer-linux-x64 -o .noacg/studio-server
          echo '9ba1de317cdc8380c38a694f1d201964d7b805833597419111dab9eea9a02681  .noacg/studio-server' | sha256sum -c -
          chmod +x .noacg/studio-server
          git clone https://github.com/Eyevinn/ograf-editor.git .noacg/reference-eyevinn
          git -C .noacg/reference-eyevinn checkout 616841bd949e3a21137579451123f66c292543f0
          npm ci --prefix .noacg/reference-eyevinn
      - name: Hash pinned reference sources
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'references')
        run: |
          git clone -q https://github.com/zerodensity/ograf-studio.git .noacg/reference-studio
          mkdir -p .noacg/results/source
          python3 - <<'PY'
          import hashlib, json, subprocess
          studio = ['apps/editor/src/panels/Menubar.tsx','apps/editor/src/state/fileIO.ts','apps/editor/src/state/fileIO.test.ts','apps/editor/src/state/projectStore.ts','apps/editor/src/state/projectStore.test.ts','apps/editor/src/state/projectTimelineSync.test.ts','apps/editor/src/state/useAutosave.ts','apps/editor/src/canvas/Stage.tsx','apps/editor/src/canvas/LayerNode.tsx','apps/editor/src/state/historyStore.ts']
          eyevinn = ['src/main.js','src/services/TemplateManager.js','src/models/OGrafTemplate.js','src/components/VisualEditor.js','src/components/PropertyPanel.js','test/bugfix-model-io.test.js','test/ograf-lifecycle.test.js']
          def show(repo, ref, path):
              r = subprocess.run(['git','-C',repo,'show',f'{ref}:{path}'], capture_output=True)
              if r.returncode: return None
              blob = subprocess.run(['git','-C',repo,'rev-parse',f'{ref}:{path}'], capture_output=True, text=True).stdout.strip()
              return blob, hashlib.sha256(r.stdout).hexdigest()
          out = []
          for p in studio:
              a = show('.noacg/reference-studio','3142fc7d02934494931eb14e7dc255393e4110d0',p); b = show('.noacg/reference-studio','a1e9776120fa19d9f3f9d40ab4b10ae1be034347',p)
              out.append({'repository':'zerodensity/ograf-studio','pin':'3142fc7d02934494931eb14e7dc255393e4110d0','release':'a1e9776120fa19d9f3f9d40ab4b10ae1be034347','path':p,'blob':a and a[0],'sha256':a and a[1],'releaseIdentical':bool(a and a==b)})
          for p in eyevinn:
              a = show('.noacg/reference-eyevinn','616841bd949e3a21137579451123f66c292543f0',p)
              out.append({'repository':'Eyevinn/ograf-editor','pin':'616841bd949e3a21137579451123f66c292543f0','path':p,'blob':a and a[0],'sha256':a and a[1]})
          json.dump(out, open('.noacg/results/source/reference.json','w'), indent=2)
          print(json.dumps(out, indent=1))
          PY
          sha256sum .noacg/studio-server | tee .noacg/results/source/studio-binary.sha256
      - name: Execute pinned lifecycle tasks
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'references')
        env:
          REFERENCE_EXE: ${{ github.workspace }}/.noacg/studio-server
        run: xvfb-run -a npx playwright test e2e/leave-reference.spec.ts --workers=1 --output=.noacg/results/references
      - name: Complete lifecycle and preserved regressions
        if: always() && inputs.scope == 'complete'
        run: npx playwright test e2e/new-graphic-guard.spec.ts e2e/library.spec.ts e2e/wizard-draft-guard.spec.ts e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts e2e/editor-canvas-short-height.spec.ts e2e/editor-commands.spec.ts e2e/project.spec.ts e2e/route-transition-flash.spec.ts e2e/leave-checker.spec.ts e2e/leave-second-checker.spec.ts --workers=1 --output=.noacg/results/maintained
      - name: Two sequential exported graphics
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'export')
        run: npx playwright test e2e/ograf-conformance.spec.ts --grep 'two DIFFERENT' --workers=1 --output=.noacg/results/export
      - name: Cumulative interaction and native zoom
        if: always() && (inputs.scope == 'complete' || inputs.scope == 'visual')
        run: xvfb-run -a npx playwright test e2e/interaction-probe-task.spec.ts e2e/interaction-checker-nested.spec.ts --workers=1 --output=.noacg/results/cumulative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leave-receipts
          include-hidden-files: true
          path: .noacg/results
