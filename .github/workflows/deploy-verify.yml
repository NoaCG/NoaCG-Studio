# Disposable checker probe. This workflow must never land.
name: deploy-verify
on:
  workflow_dispatch:
    inputs:
      scope:
        description: all includes unchanged regressions; fresh reruns only checker probes
        default: fresh
        type: string
permissions:
  contents: read
jobs:
  independent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch and verify official reference binary
        run: |
          mkdir -p .noacg/independent-967
          curl -fL https://github.com/zerodensity/ograf-studio/releases/download/v0.17/OGrafStudioServer-linux-x64 -o .noacg/independent-967/studio-server
          echo '9ba1de317cdc8380c38a694f1d201964d7b805833597419111dab9eea9a02681  .noacg/independent-967/studio-server' | sha256sum -c -
          chmod +x .noacg/independent-967/studio-server
      - name: Unchanged protected and layer-property regressions
        if: inputs.scope == 'all'
        run: npx playwright test e2e/editor-layer-property-qualification.spec.ts e2e/editor-transform-qualification.spec.ts e2e/editor-cli-round-trip.spec.ts --workers=1
      - name: Independent cumulative reference and physical zoom tasks
        env:
          REFERENCE_EXE: ${{ github.workspace }}/.noacg/independent-967/studio-server
        run: xvfb-run -a npx playwright test e2e/independent-967-task.spec.ts e2e/independent-967-reference.spec.ts --workers=1
      - name: Fresh served-production task
        env:
          EXPECTED_SHA: 80780c23f11ef959cb977bfc66ce5f9707a004ba
        run: npx playwright test --config e2e/independent-967-production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-layer-property-967
          path: test-results/
