name: deploy-verify
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch pinned official reference
        run: |
          mkdir -p .noacg/reference
          curl -fL https://github.com/zerodensity/ograf-studio/releases/download/v0.17/OGrafStudioServer-linux-x64 -o .noacg/reference/studio
          echo '9ba1de317cdc8380c38a694f1d201964d7b805833597419111dab9eea9a02681  .noacg/reference/studio' | sha256sum -c -
          chmod +x .noacg/reference/studio
      - name: Run bounded baseline and reference
        env:
          REFERENCE_EXE: .noacg/reference/studio
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test e2e/editor-layer-property-qualification.spec.ts e2e/editor-layer-property-zoom-research.spec.ts --workers=1
      - name: Repeat explicit reference history
        env:
          REFERENCE_EXE: .noacg/reference/studio
        run: npx playwright test e2e/editor-layer-property-research.spec.ts --grep "pinned Studio" --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-property-research
          path: test-results/



