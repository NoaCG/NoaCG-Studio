# WEEKLY DEPENDENCY AUDIT — the time-driven half of repo health.
#
# Everything commit-driven (build, the offline e2e suite, the factory gates) runs in ci.yml on
# every push and PR — a scheduled repeat of those would only re-prove yesterday, since npm ci
# is lockfile-pinned. What drifts WITHOUT a commit is what belongs here: the advisory database,
# upstream releases of the libraries we VENDOR, and the model ids we PIN. Weekly is deliberate —
# advisory latency of a few days is acceptable for a client-side app with pinned dependencies
# (docs/NIGHTLY_AUTOMATION_PLAN.md job A, re-scoped).
#
# The two checks beside `npm audit` exist because npm cannot see the things most likely to
# rot (docs/STACK_FRESHNESS.md):
#   - GSAP and the Lottie player are COMMITTED FILES, not dependencies, and they ship inside
#     every exported graphic. Nothing warned while GSAP sat five minor versions behind.
#   - A retired OpenRouter model id fails in PRODUCTION, never in a build: nothing references a
#     version of it, so typecheck, lint and the e2e suite all stay green while a user's
#     generation returns a provider error.
#
# This job REPORTS; it never bumps anything. Several pins here are deliberate (Remotion is
# exact-pinned across three package files for licence isolation, and the Vite target must stay
# es2017 while CasparCG 2.3.x is supported — docs/CLOUD_PLAYOUT.md §3), so an auto-merged
# upgrade could pass every check and still take playout off air.
#
# Secret-free — both new checks read public, keyless endpoints and spend no tokens. The AI
# generation pipeline (plan jobs B/C) is a separate, separately-approved workflow when its §10
# decisions are made.

name: weekly-audit

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # the failure step files/updates a rolling issue

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Staleness report (non-blocking)
        run: npm outdated || true

      # The two sibling packages are exact-pinned and never installed here — `npm outdated`
      # reads package.json against the registry, so it reports Wanted-vs-Latest without one.
      # Non-blocking for the same reason the root report is: a new upstream release is news,
      # not a fault, and Remotion has to move in all three files at once.
      - name: Staleness report — render-worker and player-host (non-blocking)
        run: |
          npm --prefix render-worker outdated || true
          npm --prefix player-host outdated || true

      # Blocking: a vendored library that is behind, or a calendar review that is due.
      - name: Vendored libraries and manual reviews
        run: npm run check:vendored

      # Blocking: a pinned model id that upstream no longer lists. This is the check that
      # catches a production-only failure, so it must be able to turn the run red.
      - name: Pinned model ids
        run: npm run check:models

      # Blocking: the EBU's published OGraf schemas moved, or our transcription of them no
      # longer agrees with them. Both are time-driven — they change when the EBU publishes,
      # never when someone here commits — and the transcription is the export gate every
      # OGraf package passes, so drift ships invalid packages while CI stays green
      # (docs/OGRAF.md, docs/IBC_LISTING_CHECKLIST.md).
      - name: OGraf conformance against the published schemas
        run: npm run check:ograf-schema

      # Fails on high/critical only — the tracked low/moderate advisories (repo maintenance
      # notes) stay a report, not a weekly alarm.
      #
      # LAST on purpose. A step that exits non-zero ends the job, so while this ran first, three
      # weeks of dev-only advisories in the build toolchain silently prevented the two checks
      # above from running at all — and those are the ones that catch a failure only production
      # would show. The advisory database is also the noisiest input here (it moves without a
      # commit, and most of what it flags lives in tooling that never reaches a user), so it is
      # the step most likely to be red for a reason nobody needs to act on this week. Anything
      # that can block the signal must therefore come after it.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # Fail-loud: one rolling tracking issue, updated per red run.
      #
      # BRANCH-GUARDED, like the three siblings (docs/CI_STABILITY.md class 6). This file was the
      # deliberate exception, on the reasoning that a dispatch from a branch cannot misstate
      # something "about the repository". Measured 2026-09-08 on the branch that FIXED the
      # browserslist advisory, which is the likeliest branch anyone dispatches this from: the run
      # is green, so the close step fires and posts "Audit green again at <a branch sha>" while
      # `main` is still red and the alarm is still true. A rolling alarm is a statement about
      # `main`, so nothing else may raise or withdraw it. A schedule run's ref IS main; the event
      # test says so explicitly rather than depending on it.
      - name: File / update the failure issue
        if: ${{ failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly dependency audit is red"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n%s\n\n%s' \
            "One of: a new high/critical advisory, a vendored library behind upstream, a due manual review, or a pinned model id upstream no longer lists." \
            "The run log says which; docs/STACK_FRESHNESS.md says what to do about each." \
            "Run: $RUN (commit ${{ github.sha }})")
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still red. $BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      # …and self-closing, like every rolling issue here (docs/DEPLOYMENT.md): a green run
      # means the advisories are cleared, so the alarm must not stay latched.
      - name: Close the failure issue
        if: ${{ success() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly dependency audit is red"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Audit green again at ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
