# After a landing: apply whatever production and staging are missing, then ask the advisors
# about what that just changed.
#
# main is written only by GitHub's merge queue (docs/WORKFLOW_ARCHITECTURE.md §5), and that
# merge is an ordinary push, so this fires on every landing. The token comes from the
# `production` environment's SUPABASE_ACCESS_TOKEN; without it the job says so and nothing
# fails - a refused statement in db-push never fails a landing either, it reports and files.
#
# The advisor step is the one thing here that CAN turn the run red on purpose, and its own
# comment says why that is the right shape for a job which by definition runs too late to block
# anything.
name: Post-landing

on:
  push:
    branches: [main]

concurrency:
  group: post-land
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/node-modules
      - name: Push what production and staging are missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice title=Migrations::No SUPABASE_ACCESS_TOKEN in the production environment - migrations stay on the maintainer's machine (supabase/AGENTS.md)."
            exit 0
          fi
          node scripts/migration-drift.mjs || true
          # Production first, then staging by name - db-push defaults to production, so the
          # staging push must say which project (scripts/supabase-projects.mjs).
          node scripts/db-push.mjs
          node scripts/db-push.mjs --ref "$(node -e "import('./scripts/supabase-projects.mjs').then((m) => console.log(m.stagingRef(process.env)))")"

      # ASK THE ADVISORS ABOUT WHAT JUST APPLIED - the only moment they can be asked. They read
      # the LIVE project, so a new `SECURITY DEFINER` function or a new table with no policies
      # exists for them to find only after the push above, and that push only happens after the
      # merge. "Post-land runs after the merge" is therefore a fact about the subject, not an
      # argument for putting this somewhere else: there is no earlier place.
      #
      # IT FAILS THE JOB rather than emitting a `::warning` into a green run. The defect this
      # closes was a gate that ran nowhere and sat red for thirteen days unnoticed; a warning
      # inside a run that concludes `success` is that same defect with a paper trail. A RED
      # CONCLUSION is the one channel this repo already reads - `scripts/ci-watch.mjs` polls
      # every run in the repository, reports each red one and logs it where the morning reads -
      # and it is the channel a failed `db-push` above already uses to say the same kind of
      # thing: the database is not in the state this repository expects.
      #
      # It cannot decay into a standing red for accepted noise, because the script exits 1 only
      # for a finding that is NEW against `supabase/advisor-baseline.json`, and never for one
      # that cleared. When it does fire, docs/STACK_FRESHNESS.md says what to do with it.
      #
      # EXIT 3 IS THE ONLY CODE THAT MERELY WARNS: the Management API would not answer, or
      # answered something this script could not compare. Turning every landing red over an
      # upstream outage nobody can act on is how an alarm teaches people to ignore it.
      #
      # EXIT 2 REDS LIKE EXIT 1, because it is a defect on OUR side - a missing or mangled
      # `supabase/advisor-baseline.json`, an unconfigured project ref. The token half of exit 2 is
      # unreachable here, since the guard below returns first; what is left is a tracked file that
      # is gone or unreadable, and letting that only warn would switch the alarm off permanently
      # while every landing stayed green. That is the exact shape this step exists to refuse.
      #
      # IT RUNS EVEN IF A PUSH ABOVE FAILED. The production push and the staging push are separate
      # statements, so production can change and staging then fail - which is precisely when the
      # advisors have something new to say. Without this the finding would surface on the NEXT
      # landing instead, whose author would be told to fix or accept something they did not write.
      # `success() || failure()` rather than `always()`, so a cancelled run still stops.
      - name: Ask the advisors about what just applied
        if: ${{ success() || failure() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice title=Advisors::No SUPABASE_ACCESS_TOKEN in the production environment - the advisors were not asked."
            exit 0
          fi
          status=0
          node scripts/supabase-advisors.mjs || status=$?
          case "$status" in
            0) ;;
            1)
              echo "::error title=Advisors::A Supabase advisor finding that is new since supabase/advisor-baseline.json. Read it in the log above, then either fix it or re-record the baseline with the judgement written down (docs/STACK_FRESHNESS.md). If the migration that caused it landed before this one, say so when you re-record."
              exit 1
              ;;
            3)
              echo "::warning title=Advisors::The advisors could not be asked, so this landing was not checked. See the error above; nothing here needs fixing if the Management API was simply unavailable."
              ;;
            *)
              echo "::error title=Advisors::The advisor check could not run (exit $status) - that is a defect in this repository, not an upstream outage. See the error above."
              exit 1
              ;;
          esac
