# Release the NoaCG Companion module: build noacg-studio-<version>.tgz and publish it as a GitHub
# Release next to NoaCG Bridge.
#
# The module has its own version line, like the Bridge and the CLI (release-bridge.yml says why):
# companion-module/package.json `version`, tag companion-vX.Y.Z. companion/manifest.json keeps the
# 0.0.0 placeholder on purpose: `companion-module-build` writes the package's version into the
# packaged manifest, and that is the version Companion shows. scripts/companion-release.mjs checks
# the result.
#
# THE BRIDGE KEEPS `releases/latest`. Every Bridge release is created with `--latest`, and the
# Bridge's no-JavaScript link and the status page rely on that, so every module release is created
# with `--latest=false`. The public Downloads page asks the API for the newest `companion-v*`
# release by tag, as it does for `bridge-v*`.
#
# HOW TO RELEASE THE MODULE:
#   1. Move `version` in companion-module/package.json and write that version's section at the top
#      of companion-module/CHANGELOG.md, for the operator deciding whether to import again. Changes
#      not ready to release wait under its "## Unreleased" heading, which releases nothing.
#      scripts/companion-release.test.mjs refuses a version without its section in the build.
#      Land it on main through /queue-merge.
#   2. Run this workflow from main with dry_run unticked (Actions tab, or
#      `gh workflow run release-companion.yml -f dry_run=false`). It tests and packages the module
#      from that commit, checks the package, and creates the Release (and its tag) with the .tgz and
#      its checksum. It refuses a commit that is not on main and a version already released.
#
# RUN BY HAND, UNLIKE THE BRIDGE'S. Landing a version does not release it, because any job a landing
# starts is priced per landing whatever its path filter says, and the overhead tier is past its line
# (scripts/growth-controls.mjs), so the capacity gate refuses one. A run started by hand costs a
# landing nothing. Starting this from a landing again is a capacity decision, not a bug fix.
#
# The default is a rehearsal: everything runs, and the package stays a workflow artifact. Once this
# file is on main, `--ref <branch>` rehearses a branch.
name: Release NoaCG Companion module

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: test and package the module, keep it as an artifact, publish nothing.'
        type: boolean
        default: true

# Two runs of one version cannot both publish: `gh release create` refuses a tag that already has
# a release, so this needs no concurrency group.
permissions:
  contents: read

jobs:
  decide:
    name: Rehearse or release?
    if: ${{ github.repository == 'NoaCG/NoaCG-Studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dry_run: ${{ steps.decide.outputs.dry_run }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      # Full history: the ancestor-of-main check needs real refs.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare the module's version with the Releases page
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/companion-release.mjs decide

  # Everything that runs the module's code and its dependencies, without a write token.
  package:
    name: Test and package the module
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refuse a version with no release notes a person can read, or show its Release page
        run: node scripts/companion-release.mjs notes
      - name: Install the module's dependencies
        working-directory: companion-module
        run: |
          corepack enable
          yarn install --immutable
      - name: Test the module
        working-directory: companion-module
        run: yarn test
      - name: Package the module
        working-directory: companion-module
        run: yarn package
      - name: Check the package is what Companion imports
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "companion-module/noacg-studio-${VERSION}.tgz" -C "$RUNNER_TEMP/unpacked"
          node scripts/companion-release.mjs verify "$RUNNER_TEMP/unpacked"
          (cd companion-module && sha256sum "noacg-studio-${VERSION}.tgz" > "noacg-studio-${VERSION}.tgz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: noacg-companion-module
          retention-days: 14
          path: |
            companion-module/noacg-studio-${{ needs.decide.outputs.version }}.tgz
            companion-module/noacg-studio-${{ needs.decide.outputs.version }}.tgz.sha256

  publish:
    name: Publish the module's Release
    needs: [decide, package]
    if: ${{ needs.decide.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # One Release created here, from the package the job above tested.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: noacg-companion-module
          path: ${{ runner.temp }}/package
      # There is no tag yet: gh creates `companion-vX.Y.Z` at the commit that was built.
      - name: Create the Release with the package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
          PACKAGE_DIR: ${{ runner.temp }}/package
        run: |
          node scripts/companion-release.mjs notes > "$RUNNER_TEMP/release-notes.md"
          gh release create "companion-v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "NoaCG Companion module ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest=false \
            "$PACKAGE_DIR/noacg-studio-${VERSION}.tgz" "$PACKAGE_DIR/noacg-studio-${VERSION}.tgz.sha256"
          echo "::notice title=Released::https://github.com/${GITHUB_REPOSITORY}/releases/tag/companion-v${VERSION}"
