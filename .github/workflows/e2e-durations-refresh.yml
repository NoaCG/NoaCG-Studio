# Disposable read-only measurement probe; never queue this branch.
name: e2e-durations-refresh
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Comma-separated successful full CI run IDs to measure.'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-measure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/node-modules
      - name: Read optimized full reports without running tests
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.runs }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { readTable, fullRunRefusal, slowRunnerMinutes } from './scripts/e2e-durations.mjs';
          import { assess } from './scripts/e2e-capacity.mjs';
          import { specFilesOnDisk } from './scripts/e2e-durations.mjs';
          const optimized = '299ee5fd9afe6a53695b245234cbef83882dc2d6';
          const baseline = readTable();
          const measurements = [];
          const ids = process.env.RUN_IDS.split(',').map(s => s.trim());
          if (!ids.length || !ids.every(id => /^\d+$/.test(id))) throw Error('Expected numeric run IDs');
          for (const id of ids) {
            const meta = JSON.parse(execFileSync('gh', ['run', 'view', id, '--json', 'headSha,event,status,conclusion,jobs'], { encoding: 'utf8' }));
            const refusal = fullRunRefusal(meta.jobs);
            if (refusal || meta.status !== 'completed' || meta.conclusion !== 'success') throw Error(`Run ${id} is not a successful complete full CI: ${refusal ?? meta.conclusion}`);
            execFileSync('git', ['fetch', '--no-tags', 'origin', meta.headSha], { stdio: 'inherit' });
            execFileSync('git', ['diff', '--exit-code', optimized, meta.headSha, '--', 'src', 'e2e', 'playwright.config.ts', 'package.json', 'package-lock.json'], { stdio: 'inherit' });
            execFileSync('node', ['scripts/e2e-durations.mjs', '--record', id], { stdio: 'inherit' });
            measurements.push({ id, sha: meta.headSha, event: meta.event, table: JSON.parse(readFileSync('scripts/e2e-durations.json', 'utf8')) });
          }
          const latest = measurements.at(-1).table;
          const minutes = slowRunnerMinutes(measurements.map(m => m.table.minutes));
          // Never enlarge the current envelope through a lower overhead reading.
          const overhead = { ...latest.overhead,
            jobMinutes: Math.max(baseline.overhead.jobMinutes, ...measurements.map(m => m.table.overhead.jobMinutes)),
            testFactor: Math.max(baseline.overhead.testFactor, ...measurements.map(m => m.table.overhead.testFactor)),
          };
          const table = { source: {
            run: measurements.at(-1).id, runs: ids, workflow: 'ci.yml', branch: 'codex/reduce-ci-trace-overhead',
            sha: optimized, mode: 'full', recordedAt: new Date().toISOString().slice(0, 10), percentile: 0.8,
            observations: measurements.map(({id, sha, event}) => ({run: id, sha, event})),
            why: 'Complete full CI on identical optimized product/test/configuration bytes, recorded by the existing recorder. Overhead cannot enlarge the previous envelope.'
          }, minutes, overhead };
          const result = assess({ table, suite: [...specFilesOnDisk(), 'save-copy-arrival.spec.ts'], changed: ['save-copy-arrival.spec.ts'], exceptions: [] });
          console.log('OPTIMIZED_CAPACITY', JSON.stringify(result));
          console.log('RUNTIME_TABLE_BEGIN');
          console.log(JSON.stringify(table, null, 2));
          console.log('RUNTIME_TABLE_END');
          JS
