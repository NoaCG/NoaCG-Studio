# TRIAL ONLY - lives on claude/supabase-native-trial-grants and is never landed.
# The configured-suite guard query, on each kind of stack: 0 means no default privileges hand
# public tables to anon or authenticated.

name: supabase-native-grants

on:
  push:
    branches: [claude/supabase-native-trial-grants]

permissions:
  contents: read

jobs:
  guard:
    name: guard on ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: docker 2.111.0, cli: 2.111.0, stack: '' }
          - { label: docker 2.120.0, cli: 2.120.0, stack: '' }
          - { label: native 2.120.0, cli: 2.120.0, stack: '1' }
          - { label: native 2.120.0 revoked first, cli: 2.120.0, stack: '1', revoke: true }
    env:
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: local-e2e-unused
      SUPABASE_AUTH_GOOGLE_SECRET: local-e2e-unused
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ matrix.cli }}
      - name: Start and ask
        run: |
          set -euo pipefail
          GUARD="select count(*) from pg_default_acl d, aclexplode(d.defaclacl) a where d.defaclrole = 'postgres'::regrole and d.defaclnamespace = 'public'::regnamespace and d.defaclobjtype = 'r' and a.grantee in ('anon'::regrole, 'authenticated'::regrole) and a.privilege_type in ('SELECT', 'INSERT', 'UPDATE', 'DELETE')"
          if [ -n "${{ matrix.stack }}" ]; then
            export SUPABASE_EXPERIMENTAL_STACK=1
            if [ "${{ matrix.revoke }}" = true ]; then
              mv supabase/migrations "$RUNNER_TEMP/m"; mkdir supabase/migrations; mv supabase/seed.sql "$RUNNER_TEMP/seed.sql"
            fi
            supabase start --runtime native --eager --exclude studio,functions >/dev/null
            db="$(supabase status --output-format json | jq -r '.env.DB_URL // .DB_URL')"
            psql() { command psql "$db" -X -tA -c "$1"; }
            if [ "${{ matrix.revoke }}" = true ]; then
              psql "alter default privileges for role postgres in schema public revoke all on tables from anon, authenticated, service_role"
              rmdir supabase/migrations; mv "$RUNNER_TEMP/m" supabase/migrations; mv "$RUNNER_TEMP/seed.sql" supabase/seed.sql
              supabase migration up >/dev/null
            fi
          else
            supabase start -x studio,edge-runtime >/dev/null
            c="$(docker ps --filter 'name=supabase_db' --format '{{.Names}}' | head -1)"
            psql() { docker exec -i "$c" psql -U postgres -d postgres -tAc "$1"; }
          fi
          echo "${{ matrix.label }}: guard count = $(psql "$GUARD"), migrations = $(psql 'select count(*) from supabase_migrations.schema_migrations')"
