name: Disposable cloud recovery proof
on:
  push:
    branches: [scratch/cloud-recovery-proof]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/cloud-queue.test.mjs
