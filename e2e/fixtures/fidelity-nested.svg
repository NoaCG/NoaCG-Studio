<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="plate-gradient" x2="1" y2="1"><stop stop-color="#14324d"/><stop offset="1" stop-color="#386983"/></linearGradient>
    <clipPath id="plate-clip"><rect x="0" y="0" width="320" height="140" rx="16"/></clipPath>
    <mask id="soft-mask"><rect width="320" height="140" fill="white"/></mask>
  </defs>
  <g id="backdrop" data-name="Backdrop"><rect width="960" height="540" fill="#17212b"/></g>
  <g id="parent" data-name="Transformed parent" transform="translate(100 80) rotate(30) scale(2)">
    <g id="card" data-name="Clipped card" clip-path="url(#plate-clip)" mask="url(#soft-mask)">
      <rect width="320" height="140" fill="url(#plate-gradient)"/>
      <g data-name="Unnamed badge" transform="translate(12 12)"><circle cx="18" cy="18" r="18" fill="#eeb844"/><path d="M8 18 L16 26 L29 10" fill="none" stroke="#17212b" stroke-width="4"/></g>
      <text id="headline" data-name="Headline" x="58" y="44" font-family="Arial" font-size="22" fill="#ffffff">Evening report</text>
      <g id="outlined" data-name="Outlined letters" transform="translate(58 66)"><path d="M0 24V0H6L18 14V0H24V24H18L6 10V24Z" fill="#eeb844"/></g>
      <image id="logo" data-name="Logo" x="264" y="82" width="40" height="40" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLttAAAAABJRU5ErkJggg=="/>
    </g>
  </g>
  <g id="sibling" data-name="Sibling" transform="translate(760 420) rotate(-12)"><rect width="140" height="50" rx="8" fill="#eeb844"/></g>
</svg>
