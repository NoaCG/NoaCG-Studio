<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG corpus / family "illustrator".
     Exporter: Adobe Illustrator 2024, File > Export > Export As... > SVG, Styling: Internal CSS,
     Font: SVG, Object IDs: Layer Names, Decimal: 2, Minify off, Responsive off.
     What they drew: a headline strap for a live stream. One navy plate holds the headline on the
     left and, inside the same plate near its right end, a red dot that says the feed is live.
     The dot sits on the headline's row, so it is what a long headline would run into. -->
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .cls-1 {
        fill: #0f1d33;
      }

      .cls-2 {
        fill: #e2231a;
      }

      .cls-3 {
        fill: #fff;
        font-family: Inter-SemiBold, Inter;
        font-size: 42px;
        font-weight: 600;
      }
    </style>
  </defs>
  <rect id="Strap_plate" data-name="Strap plate" class="cls-1" x="160" y="870" width="1180" height="92" rx="4" ry="4"/>
  <circle id="Live_dot" data-name="Live dot" class="cls-2" cx="1280" cy="916" r="18"/>
  <text id="Headline" class="cls-3" transform="translate(200 931.26)"><tspan x="0" y="0">Parliament votes on the budget</tspan></text>
</svg>
