<?xml version="1.0" encoding="UTF-8"?>
<!-- A QUIZ drawn as a LOWER THIRD in Adobe Illustrator 2026 and saved with File > Save a Copy > SVG
     (Use Artboards, Fonts: SVG with Subsetting: None, Images: Embed, Preserve Illustrator Editing
     Capabilities off, CSS: Style Elements). Three edits by hand: the Arial font names became Archivo
     and Inter, width/height were added beside the viewBox, and the empty Layer_1 group Illustrator
     leaves behind was removed. Question, Answer A to Answer D, the hidden A selected / A correct /
     A wrong groups per row and Locked. It was a public docs example until 2026-09-21, when the docs
     went to one example per type (docs/backlog/one-layer-naming-system-for-every-graphic.md); it stays
     here because the question band above two rows of two answers is the shape the wrap walk in
     e2e/import-svg-behaviour.spec.ts measures. -->
