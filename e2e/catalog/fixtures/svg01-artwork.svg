<?xml version="1.0" encoding="UTF-8"?>
<!-- An Illustrator-shaped test fixture (e2e/import-svg.spec.ts): layer names as ids with
     Illustrator's escape/uniquify conventions, data-name carrying original spellings for
     DUPLICATE layer names, one multi-tspan text block, class-based <style>, two font
     families (one bundled match, one not), and an f:-free naming scheme so every text
     defaults ON. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 270">
  <defs>
    <style>
      .cls-name { font-family: Archivo; font-weight: 700; }
      .cls-meta { font-family: 'Neue Machina'; }
    </style>
  </defs>
  <g id="Backplate">
    <rect x="40" y="60" width="880" height="150" rx="10" fill="#10131a" opacity="0.92"/>
    <rect x="40" y="60" width="8" height="150" fill="#f6a623"/>
  </g>
  <g id="Text_x20_Layer" data-name="Text Layer">
    <text id="Name" class="cls-name" x="80" y="130" font-size="44" fill="#ffffff">Alexandra Riva</text>
    <text id="Title_00000012345678901234567890123456789012_" data-name="Title" class="cls-meta" x="80" y="172" font-size="24" fill="#b7bcc4">Chief Correspondent</text>
  </g>
  <g id="Details" data-name="Text Layer">
    <text class="cls-meta" font-size="18" fill="#8b919c">
      <tspan id="Location" x="80" y="200">Helsinki</tspan>
      <tspan x="220" y="200">22:40</tspan>
    </text>
  </g>
  <image id="Crest" x="850" y="80" width="48" height="48" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII="/>
</svg>
