<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The browser-output RENDERER (docs/CLOUD_PLAYOUT.md §3): a transparent full-frame page a
         production client (CasparCG HTML producer, OBS/vMix browser source) loads once and keeps
         loaded. Reached only by its capability URL (?production=<output_slug>); the head stays
         deliberately quiet (the /admin pattern) — nothing here should read like a page worth
         indexing or previewing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Chromium paints an iframe opaque when parent and child color-schemes disagree; every
         composed srcdoc declares dark, so the renderer page must too or the stage goes white. -->
    <meta name="color-scheme" content="dark" />
    <title>Output</title>
    <style>
      /* Transparent by construction — the page IS the broadcast key layer. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!-- Old-CEF runtime shims. CasparCG 2.3.x LTS - the common school/student install -
         embeds a Chromium 71 CEF: `vite.config.ts`'s es2017 target handles the SYNTAX it
         cannot parse (a real 2.3.2 server rejected the es2020 bundle with "Uncaught
         SyntaxError: Unexpected token ?"), and these guards cover the runtime APIs that
         engine predates. Each one is used by code this page actually loads: globalThis and
         Object.fromEntries by supabase-js and composeDocument, AbortController by the fetch
         paths, queueMicrotask by the promise plumbing. Written ES5 in a classic script, so
         it runs before the module bundle on every engine. -->
    <script>
      window.globalThis || (window.globalThis = window);
      window.queueMicrotask || (window.queueMicrotask = function (fn) { Promise.resolve().then(fn); });
      Object.fromEntries || (Object.fromEntries = function (entries) {
        var out = {};
        // Array.from, not slice.call: the real one takes ANY iterable of [k, v] pairs, and an
        // iterator is not array-like, so slice would silently yield {} for a Map's entries().
        var list = Array.isArray(entries) ? entries : Array.from(entries);
        for (var i = 0; i < list.length; i++) out[list[i][0]] = list[i][1];
        return out;
      });
      if (typeof AbortController === 'undefined') {
        // Enough for libraries that create one defensively; nothing here aborts requests.
        window.AbortController = function () {
          this.signal = { aborted: false, addEventListener: function () {}, removeEventListener: function () {} };
        };
        window.AbortController.prototype.abort = function () { this.signal.aborted = true; };
      }
    </script>
    <script type="module" src="/src/output/main.ts"></script>
  </body>
</html>
