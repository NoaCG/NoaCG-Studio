<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The browser-output RENDERER (docs/CLOUD_PLAYOUT.md §3): a transparent full-frame page a
         production client (CasparCG HTML producer, OBS/vMix browser source) loads once and keeps
         loaded. Reached only by its capability URL (?production=<output_slug>); the head stays
         deliberately quiet (the /admin pattern) — nothing here should read like a page worth
         indexing or previewing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Chromium paints an iframe opaque when parent and child color-schemes disagree; every
         composed srcdoc declares dark, so the renderer page must too or the stage goes white. -->
    <meta name="color-scheme" content="dark" />
    <title>Output</title>
    <style>
      /* Transparent by construction — the page IS the broadcast key layer. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!-- Old-CEF runtime shims. CasparCG 2.3.x LTS - the common school/student install -
         embeds a Chromium 71 CEF: `vite.config.ts`'s es2017 target handles the SYNTAX it
         cannot parse (a real 2.3.2 server rejected the es2020 bundle with "Uncaught
         SyntaxError: Unexpected token ?"), and these guards cover the runtime APIs that
         engine predates. Each one is used by code this page actually loads: globalThis and
         Object.fromEntries by supabase-js and composeDocument, AbortController by the fetch
         paths, queueMicrotask by the promise plumbing. `npm run check:output-reader` fails
         the build when the output bundle calls a built-in Chromium 71 lacks that is not
         shimmed here (#2603). Written ES5 in a classic script, so
         it runs before the module bundle on every engine. -->
    <script>
      window.globalThis || (window.globalThis = window);
      window.queueMicrotask || (window.queueMicrotask = function (fn) { Promise.resolve().then(fn); });
      Object.fromEntries || (Object.fromEntries = function (entries) {
        var out = {};
        // Array.from, not slice.call: the real one takes ANY iterable of [k, v] pairs, and an
        // iterator is not array-like, so slice would silently yield {} for a Map's entries().
        var list = Array.isArray(entries) ? entries : Array.from(entries);
        for (var i = 0; i < list.length; i++) out[list[i][0]] = list[i][1];
        return out;
      });
      if (typeof AbortController === 'undefined') {
        // Enough for libraries that create one defensively; nothing here aborts requests.
        window.AbortController = function () {
          this.signal = { aborted: false, addEventListener: function () {}, removeEventListener: function () {} };
        };
        window.AbortController.prototype.abort = function () { this.signal.aborted = true; };
      }
      // Chrome 76. The asset loader awaits it; same result shape as the real one.
      Promise.allSettled || (Promise.allSettled = function (items) {
        return Promise.all(Array.from(items, function (item) {
          return Promise.resolve(item).then(
            function (value) { return { status: 'fulfilled', value: value }; },
            function (reason) { return { status: 'rejected', reason: reason }; });
        }));
      });
      // Chrome 98. The production model clones looks, cues and history with it. Those are plain
      // data, so a deep copy of objects, arrays, Date, RegExp, Map and Set (cycles kept) matches
      // the real one; a function refuses as the real one does. Typed arrays and ArrayBuffers are not
      // plain data and come back as plain objects: nothing the output clones holds one.
      window.structuredClone || (window.structuredClone = function (root) {
        var seen = new Map();
        function copy(value) {
          if (typeof value === 'function' || typeof value === 'symbol') throw new DOMException('could not be cloned', 'DataCloneError');
          if (value === null || typeof value !== 'object') return value;
          if (seen.has(value)) return seen.get(value);
          var out;
          if (value instanceof Date) out = new Date(value.getTime());
          else if (value instanceof RegExp) out = new RegExp(value.source, value.flags);
          else if (value instanceof Map) { out = new Map(); seen.set(value, out); value.forEach(function (v, k) { out.set(copy(k), copy(v)); }); return out; }
          else if (value instanceof Set) { out = new Set(); seen.set(value, out); value.forEach(function (v) { out.add(copy(v)); }); return out; }
          else if (Array.isArray(value)) { out = new Array(value.length); seen.set(value, out); for (var i = 0; i < value.length; i++) if (i in value) out[i] = copy(value[i]); return out; }
          else {
            out = {}; seen.set(value, out);
            // defineProperty, not assignment: a key named __proto__ stays an own field, as in the real one.
            Object.keys(value).forEach(function (k) { Object.defineProperty(out, k, { value: copy(value[k]), writable: true, enumerable: true, configurable: true }); });
            return out;
          }
          seen.set(value, out);
          return out;
        }
        return copy(root);
      });
    </script>
    <script type="module" src="/src/output/main.ts"></script>
  </body>
</html>
