# Supabase project config for the OPEN, self-hostable app (Era 5). A self-hoster runs
#   supabase db push    # or `supabase start` for a local stack
# to stand up a working instance from this file + the migrations in ./migrations.
#
# Only the OPEN features are declared here (auth, db, storage). The private repo's edge functions
# (billing, metered AI gateway, social ingestion) are intentionally NOT declared — they are wired
# in at deploy time on the hosted instance only. Secrets are referenced via env(NAME); no literal
# secret ever lives in this file. See docs/ERA5_PLAN.md.

project_id = "noacg-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Fonts/images sync to a private bucket (see migrations/0001). 50 MiB is ample for a single asset.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5174"]
jwt_expiry = 3600

# Signup is OPEN (Era 5.6, migration 0006): the Before-User-Created hook below now allows every
# sign-up. The hook stays wired so re-closing to the invite allowlist is a one-function migration
# (restore the 0002 body of enforce_allowlist) — no auth reconfiguration needed either way.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Confirmations OFF (2026-08-24): a student makes an account and starts working; we do not
# need to prove they own the address yet. Sign-in is email+password or Google, never a magic
# link, so no mail is needed to get in - only password reset sends anything.
# THIS FILE IS LOCAL DEV ONLY. The hosted project is changed in the dashboard, and
# `supabase config push` must never be run - it would push site_url=localhost to production.
# Rationale and the SMTP story: docs/DEPLOYMENT.md, "Auth email".
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

# Before-User-Created hook: the signup switch (permissive since 0006; allowlist gate in 0002).
# Postgres-function form so the check never leaves the instance and a self-hoster needs no
# extra service.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/enforce_allowlist"

# The OAuth 2.1 server a chat client signs in through to reach the remote MCP connector
# (docs/REMOTE_MCP_PLAN.md, key decision 2). Dynamic client registration on: Claude.ai and ChatGPT
# register a fresh client per connection. Supabase sends the user to site_url + this path with
# `?authorization_id=`, so the consent page is a query route on the studio's root, beside `?agent=`.
#
# SIGNING KEYS. The OAuth server needs asymmetric keys. A local stack already signs ES256 with the
# CLI's built-in development key (2.111.0 sets it whenever `signing_keys_path` is unset), so nothing
# is set here and no private key is committed. A self-hoster must give GoTrue an asymmetric key
# (`supabase gen signing-key`, then `signing_keys_path`); the hosted projects already sign ES256.
# scripts/connector-oauth-spike.mjs checks the alg and the JWKS on every run.
[auth.oauth_server]
enabled = true
allow_dynamic_registration = true
authorization_url_path = "/"

# Custom Access Token hook: a token issued to an OAuth client (it carries `client_id`) gets the
# `noacg_connector` database role, which holds no grants and which the API roles cannot assume, so
# a connector token reaches no table, function or storage object through PostgREST or Storage.
# It also moves the user id from `sub` to `noacg_uid` and points `session_id` at no session, so
# Supabase Auth's own account endpoints (password, email, MFA, consent) refuse the token too
# (issue #1083). First-party sessions pass through unchanged. Migration 0089 creates the role and
# the function; 0091 adds the account lock.
# Enabling this on a hosted project is the owner's step (docs/REMOTE_MCP_PLAN.md, "Owner's steps").
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/connector_access_token"
