<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoaCG Studio — Editor</title>
    <meta
      name="description"
      content="The NoaCG Studio app: create on-air lower thirds, tickers, scoreboards and more without code, run them live from your browser, and export to OGraf, CasparCG, SPX Graphics, H2R Graphics, LiveOS, OBS and vMix."
    />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/noacg-icon-256.png" />
    <!-- Bundled brand typefaces (no CDN) — preload so the wordmark paints without a flash. -->
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="NoaCG Studio" />
    <meta property="og:description" content="Create live graphics. Run the show. Premium on-air graphics, driven live from your browser or exported for OGraf, CasparCG, SPX Graphics, H2R Graphics, LiveOS, OBS and vMix." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <!-- BOOT WATCHDOG + CONNECTION CHECK. Inline and dependency-free ON PURPOSE: this script
         is the one part of /app that still runs when a filtering proxy blocks the JS chunks
         themselves (the failure class a real demo hit, docs/GOALS.md "the SVG road"). Two jobs:
         (1) if the module boot has not reached 'mounted' in time, paint a plain-HTML
             diagnosis instead of leaving a white screen;
         (2) on /app?diag=1, render the connection check the app links to - src/main.tsx
             stands down on that URL. Checks report to the PERSON (screenshot-friendly);
             nothing here phones home. -->
    <script>
      (function () {
        window.__noacgBootStage = 'html';
        var qs = new URLSearchParams(location.search);
        var esc = function (s) {
          return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        };

        if (!qs.has('diag')) {
          // ── The watchdog ──────────────────────────────────────────────────────
          var waitMs = Math.max(500, Number(qs.get('bootTimeoutMs')) || 9000);
          setTimeout(function () {
            if (window.__noacgBootStage === 'mounted') return;
            var root = document.getElementById('root');
            if (!root || root.children.length > 0) return; // something rendered - stand down
            var stuck = window.__noacgBootStage === 'js'
              ? 'The app files started loading and then stalled.'
              : 'The app files never started - the network may be blocking them.';
            document.body.style.background = '#0a0c10';
            root.innerHTML =
              '<div style="max-width:560px;margin:18vh auto 0;padding:0 24px;font:14px/1.6 system-ui,sans-serif;color:#e8eaf0">' +
              '<h1 style="font-size:19px;margin:0 0 10px">NoaCG Studio could not finish loading</h1>' +
              '<p style="margin:0 0 8px;color:#aab0bf">' + stuck +
              ' On a managed or filtered network this usually means a proxy blocked part of the app.</p>' +
              '<p style="margin:0 0 18px;color:#aab0bf">Nothing is wrong with your saved work.</p>' +
              '<p style="margin:0" data-noacg-boot-fallback>' +
              '<button onclick="location.reload()" style="padding:8px 14px;margin-right:12px;cursor:pointer">Try again</button>' +
              '<a href="/app?diag=1" style="color:#f0b429">Run the connection check</a></p></div>';
          }, waitMs);
          return;
        }

        // ── The connection check (/app?diag=1) ──────────────────────────────────
        var ROWS = [
          { id: 'app', name: 'App server', hint: 'the page and its files' },
          { id: 'fonts', name: 'Bundled fonts', hint: '/fonts on this server' },
          { id: 'api', name: 'API routes', hint: '/api on this server' },
          { id: 'storage', name: 'Browser storage (IndexedDB)', hint: 'where saved work lives' },
          { id: 'localstorage', name: 'Browser storage (settings)', hint: 'localStorage' },
          { id: 'iframe', name: 'Preview sandbox', hint: 'the graphic preview frame' },
          { id: 'internet', name: 'Third-party internet', hint: 'optional - only Google Fonts search needs it' },
        ];
        var results = {};
        var timeoutAfter = function (ms) {
          return new Promise(function (resolve) {
            setTimeout(function () { resolve({ ok: false, note: 'no answer after ' + ms / 1000 + 's' }); }, ms);
          });
        };
        var render = function () {
          var root = document.getElementById('root');
          if (!root) return;
          document.body.style.background = '#0a0c10';
          var rows = ROWS.map(function (r) {
            var res = results[r.id];
            var state = !res ? 'RUNNING' : res.ok ? 'PASS' : 'FAIL';
            var color = !res ? '#aab0bf' : res.ok ? '#4cc38a' : '#e5484d';
            return (
              '<div data-testid="diag-row-' + r.id + '" data-status="' + state + '" ' +
              'style="display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid #1c2028">' +
              '<span style="width:56px;flex:none;font-weight:600;color:' + color + '">' + state + '</span>' +
              '<span style="flex:1;min-width:0"><strong>' + esc(r.name) + '</strong>' +
              ' <span style="color:#6b7180">— ' + esc(r.hint) + '</span>' +
              (res && res.note ? '<br><span style="color:#aab0bf;font-size:12px">' + esc(res.note) + '</span>' : '') +
              '</span></div>'
            );
          }).join('');
          root.innerHTML =
            '<div data-testid="diag-root" style="max-width:640px;margin:8vh auto 0;padding:0 24px 48px;font:14px/1.6 system-ui,sans-serif;color:#e8eaf0">' +
            '<h1 style="font-size:19px;margin:0 0 4px">NoaCG connection check</h1>' +
            '<p style="margin:0 0 16px;color:#aab0bf">For locked-down networks: every FAIL row names what this ' +
            'network or browser is blocking. Copy the report or screenshot this page.</p>' +
            rows +
            '<p style="margin:16px 0 0">' +
            '<button data-testid="diag-copy" style="padding:8px 14px;margin-right:12px;cursor:pointer">Copy report</button>' +
            '<a href="/app" style="color:#f0b429">Back to the studio</a></p>' +
            '<p style="margin:14px 0 0;font-size:12px;color:#6b7180">' + esc(navigator.userAgent) +
            ' — ' + new Date().toISOString() + '</p></div>';
          var copy = root.querySelector('[data-testid="diag-copy"]');
          if (copy) {
            copy.addEventListener('click', function () {
              var text = 'NoaCG connection check ' + new Date().toISOString() + '\n' + location.origin + '\n' +
                navigator.userAgent + '\n' +
                ROWS.map(function (r) {
                  var res = results[r.id];
                  return (!res ? 'RUNNING' : res.ok ? 'PASS' : 'FAIL') + '  ' + r.name +
                    (res && res.note ? ' (' + res.note + ')' : '');
                }).join('\n');
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () { copy.textContent = 'Copied'; });
              } else {
                window.prompt('Copy the report:', text);
              }
            });
          }
        };
        var done = function (id, ok, note) {
          results[id] = { ok: ok, note: note || '' };
          render();
        };
        render();

        // App server: any HTTP answer proves the origin is reachable; version.json also names
        // the deployed build when it parses (docs/DEPLOYMENT.md).
        Promise.race([
          fetch('/version.json', { cache: 'no-store' }).then(function (r) {
            if (!r.ok) return { ok: true, note: 'reachable (status ' + r.status + ')' };
            return r.json().then(
              function (v) { return { ok: true, note: 'build ' + ((v && (v.commit || v.version)) || 'unknown') }; },
              function () { return { ok: true, note: 'reachable' }; }
            );
          }, function () { return { ok: false, note: 'this server did not answer' }; }),
          timeoutAfter(6000),
        ]).then(function (r) { done('app', r.ok, r.note); });

        Promise.race([
          fetch('/fonts/space-grotesk.woff2', { cache: 'no-store' }).then(function (r) {
            return { ok: r.ok, note: r.ok ? '' : 'status ' + r.status };
          }, function () { return { ok: false, note: 'blocked or unreachable' }; }),
          timeoutAfter(6000),
        ]).then(function (r) { done('fonts', r.ok, r.note); });

        // Any HTTP status counts as reachable - the routes themselves may refuse a bare GET.
        Promise.race([
          fetch('/api/events', { cache: 'no-store' }).then(function (r) {
            return { ok: true, note: 'reachable (status ' + r.status + ')' };
          }, function () { return { ok: false, note: 'blocked or unreachable' }; }),
          timeoutAfter(6000),
        ]).then(function (r) { done('api', r.ok, r.note); });

        // IndexedDB: a locked-down browser either throws on open (site-data policy) or never
        // answers (a wedged backend) - both are exactly what this row exists to show.
        Promise.race([
          new Promise(function (resolve) {
            try {
              var req = indexedDB.open('noacg-connection-check', 1);
              req.onupgradeneeded = function () { req.result.createObjectStore('t'); };
              req.onerror = function () { resolve({ ok: false, note: String(req.error || 'open refused') }); };
              req.onsuccess = function () {
                try {
                  var dbh = req.result;
                  var tx = dbh.transaction('t', 'readwrite');
                  tx.objectStore('t').put('ok', 'k');
                  tx.oncomplete = function () {
                    dbh.close();
                    indexedDB.deleteDatabase('noacg-connection-check');
                    resolve({ ok: true, note: '' });
                  };
                  tx.onerror = function () { resolve({ ok: false, note: 'write refused' }); };
                } catch (e) { resolve({ ok: false, note: String(e) }); }
              };
            } catch (e) { resolve({ ok: false, note: 'blocked by browser policy' }); }
          }),
          timeoutAfter(4000),
        ]).then(function (r) { done('storage', r.ok, r.note); });

        try {
          localStorage.setItem('noacg-connection-check', '1');
          localStorage.removeItem('noacg-connection-check');
          done('localstorage', true, '');
        } catch (e) {
          done('localstorage', false, 'blocked by browser policy');
        }

        // The preview renders graphics in a sandboxed srcdoc iframe; some security tooling
        // strips or blocks those wholesale, which looks like "the preview is black".
        (function () {
          var settledFrame = false;
          var frame = document.createElement('iframe');
          frame.setAttribute('sandbox', 'allow-scripts');
          frame.style.display = 'none';
          frame.srcdoc = '<' + 'script>parent.postMessage("noacg-diag-frame-ok","*")<' + '/script>';
          window.addEventListener('message', function (e) {
            if (e.data === 'noacg-diag-frame-ok' && !settledFrame) {
              settledFrame = true;
              done('iframe', true, '');
            }
          });
          setTimeout(function () {
            if (!settledFrame) done('iframe', false, 'sandboxed preview frames are blocked here');
          }, 4000);
          document.body.appendChild(frame);
        })();

        // no-cors: an opaque response resolves on success and rejects when the network
        // refuses - all this row asks. The app itself never needs a third-party host.
        Promise.race([
          fetch('https://fonts.googleapis.com/css2?family=Inter', { mode: 'no-cors', cache: 'no-store' }).then(
            function () { return { ok: true, note: '' }; },
            function () { return { ok: false, note: 'third-party requests are blocked (the studio still works; Google Fonts search will not)' }; }
          ),
          timeoutAfter(6000),
        ]).then(function (r) { done('internet', r.ok, r.note); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
