<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Bracket</title>
  <desc>NoaCG Clean Studio template. A four-team bracket: the Stage, Semi 1 to Semi 4, the two finalists in Final 1 and Final 2, and the Champion; type a name into the next round to move a team on.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="300" y="200" width="1320" height="680" rx="20" fill="#FFFFFF"/>
    <rect id="Semi_box_1" inkscape:label="Semi box 1" x="340" y="300" width="360" height="64" rx="10" fill="#EEF1F6"/>
    <rect id="Semi_box_2" inkscape:label="Semi box 2" x="340" y="380" width="360" height="64" rx="10" fill="#EEF1F6"/>
    <rect id="Semi_box_3" inkscape:label="Semi box 3" x="340" y="620" width="360" height="64" rx="10" fill="#EEF1F6"/>
    <rect id="Semi_box_4" inkscape:label="Semi box 4" x="340" y="700" width="360" height="64" rx="10" fill="#EEF1F6"/>
    <rect id="Final_box_1" inkscape:label="Final box 1" x="780" y="400" width="360" height="64" rx="10" fill="#EEF1F6"/>
    <rect id="Final_box_2" inkscape:label="Final box 2" x="780" y="560" width="360" height="64" rx="10" fill="#EEF1F6"/>
    <rect id="Champion_box" inkscape:label="Champion box" x="1220" y="500" width="360" height="90" rx="14" fill="#2E5BFF"/>
    <text inkscape:label="static:Champion label" x="1240" y="480" text-anchor="start" font-size="20" font-weight="800" fill="#5B6478" letter-spacing="2" font-family="Manrope, sans-serif">CHAMPION</text>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Stage" x="340" y="262" text-anchor="start" font-size="28" font-weight="800" fill="#2E5BFF" letter-spacing="2">PLAYOFFS</text>
    <text id="Semi_1" inkscape:label="Semi 1" x="364" y="342" text-anchor="start" font-size="28" font-weight="800" fill="#0F1729">Harbour</text>
    <text id="Semi_2" inkscape:label="Semi 2" x="364" y="422" text-anchor="start" font-size="28" font-weight="800" fill="#0F1729">Valley</text>
    <text id="Semi_3" inkscape:label="Semi 3" x="364" y="662" text-anchor="start" font-size="28" font-weight="800" fill="#0F1729">Ridge</text>
    <text id="Semi_4" inkscape:label="Semi 4" x="364" y="742" text-anchor="start" font-size="28" font-weight="800" fill="#0F1729">Nova</text>
    <text id="Final_1" inkscape:label="Final 1" x="804" y="442" text-anchor="start" font-size="28" font-weight="800" fill="#0F1729">Harbour</text>
    <text id="Final_2" inkscape:label="Final 2" x="804" y="602" text-anchor="start" font-size="28" font-weight="800" fill="#0F1729">Nova</text>
    <text id="Champion" x="1400" y="558" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">Harbour</text>
  </g>
</svg>
