<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Route</title>
  <desc>Editable NoaCG SVG source. A tour along a rail from the start to Stop 1 to Stop 4, each stop's name a field. Next stop draws the hidden Track piece to the next stop and then shows its Reached dot; Previous stop takes it back.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="160" y="830" width="1600" height="170" fill="#1d2b53"/>
    <rect id="Edge" x="160" y="830" width="1600" height="6" fill="#ffcc00"/>
    <line id="Rail" x1="440" y1="905" x2="1680" y2="905" stroke="#3a4b80" stroke-width="10" stroke-linecap="round"/>
    <circle id="Start_dot" inkscape:label="Start dot" cx="440" cy="905" r="17" fill="#ffcc00"/>
    <circle id="Dot_1" inkscape:label="Dot 1" cx="750" cy="905" r="14" fill="#1d2b53" stroke="#3a4b80" stroke-width="6"/>
    <circle id="Dot_2" inkscape:label="Dot 2" cx="1060" cy="905" r="14" fill="#1d2b53" stroke="#3a4b80" stroke-width="6"/>
    <circle id="Dot_3" inkscape:label="Dot 3" cx="1370" cy="905" r="14" fill="#1d2b53" stroke="#3a4b80" stroke-width="6"/>
    <circle id="Dot_4" inkscape:label="Dot 4" cx="1680" cy="905" r="14" fill="#1d2b53" stroke="#3a4b80" stroke-width="6"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="Track_1" inkscape:label="Track 1" style="display:none">
      <line x1="440" y1="905" x2="728" y2="905" stroke="#ffcc00" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g id="Track_2" inkscape:label="Track 2" style="display:none">
      <line x1="750" y1="905" x2="1038" y2="905" stroke="#ffcc00" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g id="Track_3" inkscape:label="Track 3" style="display:none">
      <line x1="1060" y1="905" x2="1348" y2="905" stroke="#ffcc00" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g id="Track_4" inkscape:label="Track 4" style="display:none">
      <line x1="1370" y1="905" x2="1658" y2="905" stroke="#ffcc00" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g id="Reached_1" inkscape:label="Reached 1" style="display:none">
      <circle cx="750" cy="905" r="17" fill="#ffcc00"/>
    </g>
    <g id="Reached_2" inkscape:label="Reached 2" style="display:none">
      <circle cx="1060" cy="905" r="17" fill="#ffcc00"/>
    </g>
    <g id="Reached_3" inkscape:label="Reached 3" style="display:none">
      <circle cx="1370" cy="905" r="17" fill="#ffcc00"/>
    </g>
    <g id="Reached_4" inkscape:label="Reached 4" style="display:none">
      <circle cx="1680" cy="905" r="17" fill="#ffcc00"/>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Oswald, sans-serif">
    <text id="Title" x="200" y="922" font-size="44" font-weight="700" fill="#ffcc00">ON TOUR</text>
    <text id="Stop_1" inkscape:label="Stop 1" x="750" y="967" text-anchor="middle" font-size="32" font-weight="500" fill="#ffffff">Bridge</text>
    <text id="Stop_2" inkscape:label="Stop 2" x="1060" y="967" text-anchor="middle" font-size="32" font-weight="500" fill="#ffffff">Square</text>
    <text id="Stop_3" inkscape:label="Stop 3" x="1370" y="967" text-anchor="middle" font-size="32" font-weight="500" fill="#ffffff">Station</text>
    <text id="Stop_4" inkscape:label="Stop 4" x="1680" y="967" text-anchor="middle" font-size="32" font-weight="500" fill="#ffffff">Arena</text>
  </g>
</svg>
