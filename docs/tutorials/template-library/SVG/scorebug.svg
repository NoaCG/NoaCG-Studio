<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Scorebug</title>
  <desc>NoaCG Clean Studio template. A corner scorebug: Team 1 and Team 2 with Score 1 and Score 2, a live Clock, hidden Flash 1 and Flash 2 for a goal and Full time, and a Period choice with three drawn tabs: First, drawn visible so the bug starts there, Interval and Second.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Team_box_1" inkscape:label="Team box 1" x="64" y="64" width="200" height="64" rx="12" fill="#FFFFFF"/>
    <rect id="Score_box_1" inkscape:label="Score box 1" x="272" y="64" width="76" height="64" rx="12" fill="#2E5BFF"/>
    <rect id="Score_box_2" inkscape:label="Score box 2" x="356" y="64" width="76" height="64" rx="12" fill="#2E5BFF"/>
    <rect id="Team_box_2" inkscape:label="Team box 2" x="440" y="64" width="200" height="64" rx="12" fill="#FFFFFF"/>
    <rect id="Clock_box" inkscape:label="Clock box" x="648" y="64" width="136" height="64" rx="12" fill="#0F1729"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="Flash_1" inkscape:label="Flash 1" style="display:none">
      <rect x="64" y="136" width="200" height="36" rx="10" fill="#2E5BFF"/>
      <text x="164" y="162" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="3">GOAL</text>
    </g>
    <g id="Flash_2" inkscape:label="Flash 2" style="display:none">
      <rect x="440" y="136" width="200" height="36" rx="10" fill="#2E5BFF"/>
      <text x="540" y="162" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="3">GOAL</text>
    </g>
    <g id="Full_time" inkscape:label="Full time" style="display:none">
      <rect x="272" y="136" width="160" height="36" rx="10" fill="#0F1729"/>
      <text x="352" y="162" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">FULL TIME</text>
    </g>
    <g id="choice:Period_x2F_First" inkscape:label="choice:Period/First">
      <rect x="648" y="136" width="136" height="36" rx="10" fill="#FFFFFF"/>
      <text inkscape:label="static:First half" x="716" y="161" text-anchor="middle" font-size="17" font-weight="800" fill="#0F1729" font-family="Manrope, sans-serif" letter-spacing="1">1ST HALF</text>
    </g>
    <g id="choice:Period_x2F_Interval" inkscape:label="choice:Period/Interval" style="display:none">
      <rect x="648" y="136" width="136" height="36" rx="10" fill="#E0A11A"/>
      <text inkscape:label="static:Half time" x="716" y="161" text-anchor="middle" font-size="17" font-weight="800" fill="#0F1729" font-family="Manrope, sans-serif" letter-spacing="1">HALF TIME</text>
    </g>
    <g id="choice:Period_x2F_Second" inkscape:label="choice:Period/Second" style="display:none">
      <rect x="648" y="136" width="136" height="36" rx="10" fill="#FFFFFF"/>
      <text inkscape:label="static:Second half" x="716" y="161" text-anchor="middle" font-size="17" font-weight="800" fill="#0F1729" font-family="Manrope, sans-serif" letter-spacing="1">2ND HALF</text>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Team_1" inkscape:label="Team 1" x="164" y="107" text-anchor="middle" font-size="28" font-weight="800" fill="#0F1729" letter-spacing="1">HOME</text>
    <text id="Score_1" inkscape:label="Score 1" x="310" y="111" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Score_2" inkscape:label="Score 2" x="394" y="111" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Team_2" inkscape:label="Team 2" x="540" y="107" text-anchor="middle" font-size="28" font-weight="800" fill="#0F1729" letter-spacing="1">AWAY</text>
    <text id="Clock" x="716" y="109" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0:00</text>
  </g>
</svg>
