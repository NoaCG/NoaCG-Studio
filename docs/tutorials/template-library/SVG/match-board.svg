<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Match board</title>
  <desc>NoaCG Clean Studio template. A full match board: a Title, Team 1 and Team 2 with Score 1 and Score 2 as totals, and a period breakdown, one text per quarter and team (Q1 home to Q4 away), under fixed column heads; hidden Flash 1 and Flash 2 mark a score and Full time calls the game.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="460" y="300" width="1000" height="440" rx="20" fill="#FFFFFF"/>
    <rect id="Team_box_1" inkscape:label="Team box 1" x="492" y="430" width="936" height="96" rx="14" fill="#EEF1F6"/>
    <rect id="Team_box_2" inkscape:label="Team box 2" x="492" y="542" width="936" height="96" rx="14" fill="#EEF1F6"/>
    <rect id="Score_box_1" inkscape:label="Score box 1" x="1316" y="430" width="112" height="96" rx="14" fill="#2E5BFF"/>
    <rect id="Score_box_2" inkscape:label="Score box 2" x="1316" y="542" width="112" height="96" rx="14" fill="#2E5BFF"/>
    <text inkscape:label="static:Q1" x="900" y="410" text-anchor="middle" font-size="20" font-weight="800" fill="#5B6478" font-family="Manrope, sans-serif" letter-spacing="2">Q1</text>
    <text inkscape:label="static:Q2" x="996" y="410" text-anchor="middle" font-size="20" font-weight="800" fill="#5B6478" font-family="Manrope, sans-serif" letter-spacing="2">Q2</text>
    <text inkscape:label="static:Q3" x="1092" y="410" text-anchor="middle" font-size="20" font-weight="800" fill="#5B6478" font-family="Manrope, sans-serif" letter-spacing="2">Q3</text>
    <text inkscape:label="static:Q4" x="1188" y="410" text-anchor="middle" font-size="20" font-weight="800" fill="#5B6478" font-family="Manrope, sans-serif" letter-spacing="2">Q4</text>
    <text inkscape:label="static:Total" x="1372" y="410" text-anchor="middle" font-size="20" font-weight="800" fill="#5B6478" font-family="Manrope, sans-serif" letter-spacing="2">TOTAL</text>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="Flash_1" inkscape:label="Flash 1" style="display:none">
      <rect x="476" y="430" width="8" height="96" rx="4" fill="#2E5BFF"/>
    </g>
    <g id="Flash_2" inkscape:label="Flash 2" style="display:none">
      <rect x="476" y="542" width="8" height="96" rx="4" fill="#2E5BFF"/>
    </g>
    <g id="Full_time" inkscape:label="Full time" style="display:none">
      <rect x="1208" y="660" width="220" height="48" rx="12" fill="#0F1729"/>
      <text x="1318" y="693" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">FULL TIME</text>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="524" y="392" text-anchor="start" font-size="28" font-weight="800" fill="#2E5BFF" letter-spacing="2">SEMI-FINAL</text>
    <text id="Team_1" inkscape:label="Team 1" x="524" y="491" text-anchor="start" font-size="36" font-weight="800" fill="#0F1729">Harbour</text>
    <text id="Q1_home" inkscape:label="Q1 home" x="900" y="492" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Q2_home" inkscape:label="Q2 home" x="996" y="492" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Q3_home" inkscape:label="Q3 home" x="1092" y="492" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Q4_home" inkscape:label="Q4 home" x="1188" y="492" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Score_1" inkscape:label="Score 1" x="1372" y="496" text-anchor="middle" font-size="52" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Team_2" inkscape:label="Team 2" x="524" y="603" text-anchor="start" font-size="36" font-weight="800" fill="#0F1729">Valley</text>
    <text id="Q1_away" inkscape:label="Q1 away" x="900" y="604" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Q2_away" inkscape:label="Q2 away" x="996" y="604" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Q3_away" inkscape:label="Q3 away" x="1092" y="604" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Q4_away" inkscape:label="Q4 away" x="1188" y="604" text-anchor="middle" font-size="36" font-weight="700" fill="#0F1729" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Score_2" inkscape:label="Score 2" x="1372" y="608" text-anchor="middle" font-size="52" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0</text>
  </g>
</svg>
