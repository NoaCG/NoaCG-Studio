<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Match status</title>
  <desc>NoaCG Clean Studio template. A score card at the bottom: Team 1 and Team 2 with Score 1 and Score 2, a Detail line, and a Status choice with three drawn tabs: Live, drawn visible so the card starts there, Break and Ended (the word Final).</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="560" y="860" width="800" height="160" rx="20" fill="#FFFFFF"/>
    <rect id="Score_box_1" inkscape:label="Score box 1" x="852" y="884" width="100" height="80" rx="14" fill="#2E5BFF"/>
    <rect id="Score_box_2" inkscape:label="Score box 2" x="968" y="884" width="100" height="80" rx="14" fill="#2E5BFF"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="choice:Status_x2F_Live" inkscape:label="choice:Status/Live">
      <rect x="890" y="816" width="140" height="40" rx="10" fill="#E5484D"/>
      <circle cx="922" cy="836" r="7" fill="#FFFFFF"/>
      <text inkscape:label="static:Live" x="938" y="845" text-anchor="start" font-size="22" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">LIVE</text>
    </g>
    <g id="choice:Status_x2F_Break" inkscape:label="choice:Status/Break" style="display:none">
      <rect x="890" y="816" width="140" height="40" rx="10" fill="#E0A11A"/>
      <text inkscape:label="static:Break" x="960" y="845" text-anchor="middle" font-size="22" font-weight="800" fill="#0F1729" font-family="Manrope, sans-serif" letter-spacing="2">BREAK</text>
    </g>
    <g id="choice:Status_x2F_Ended" inkscape:label="choice:Status/Ended" style="display:none">
      <rect x="890" y="816" width="140" height="40" rx="10" fill="#0F1729"/>
      <text inkscape:label="static:Final" x="960" y="845" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">FINAL</text>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Team_1" inkscape:label="Team 1" x="828" y="937" text-anchor="end" font-size="36" font-weight="800" fill="#0F1729" letter-spacing="1">NORTH</text>
    <text id="Score_1" inkscape:label="Score 1" x="902" y="943" text-anchor="middle" font-size="52" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Score_2" inkscape:label="Score 2" x="1018" y="943" text-anchor="middle" font-size="52" font-weight="800" fill="#FFFFFF" style="font-variant-numeric: tabular-nums">0</text>
    <text id="Team_2" inkscape:label="Team 2" x="1092" y="937" text-anchor="start" font-size="36" font-weight="800" fill="#0F1729" letter-spacing="1">SOUTH</text>
    <text id="Detail" x="960" y="1000" text-anchor="middle" font-size="22" font-weight="600" fill="#5B6478">Group A, matchday 3</text>
  </g>
</svg>
