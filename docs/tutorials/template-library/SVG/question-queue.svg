<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Question queue</title>
  <desc>NoaCG Clean Studio template. The lineup used for audience questions: a Title over four questions, Guest 1 to Guest 4, each on its own row. A hidden Now layer lights the question being answered and a hidden Done layer greys the ones already answered; Next guest and Previous guest move along the list.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="1140" y="210" width="680" height="560" rx="20" fill="#FFFFFF"/>
    <rect id="Guest_box_1" inkscape:label="Guest box 1" x="1172" y="310" width="616" height="92" rx="12" fill="#F3F5F9"/>
    <rect id="Guest_box_2" inkscape:label="Guest box 2" x="1172" y="420" width="616" height="92" rx="12" fill="#F3F5F9"/>
    <rect id="Guest_box_3" inkscape:label="Guest box 3" x="1172" y="530" width="616" height="92" rx="12" fill="#F3F5F9"/>
    <rect id="Guest_box_4" inkscape:label="Guest box 4" x="1172" y="640" width="616" height="92" rx="12" fill="#F3F5F9"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="Done_1" inkscape:label="Done 1" style="display:none">
      <rect x="1172" y="310" width="616" height="92" rx="12" fill="#E3E7EF"/>
      <circle cx="1756" cy="356" r="14" fill="#5B6478"/>
      <path d="M1749 356 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="Now_1" inkscape:label="Now 1" style="display:none">
      <rect x="1172" y="310" width="616" height="92" rx="12" fill="#E8EEFF"/>
      <rect x="1172" y="310" width="10" height="92" rx="5" fill="#2E5BFF"/>
    </g>
    <g id="Done_2" inkscape:label="Done 2" style="display:none">
      <rect x="1172" y="420" width="616" height="92" rx="12" fill="#E3E7EF"/>
      <circle cx="1756" cy="466" r="14" fill="#5B6478"/>
      <path d="M1749 466 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="Now_2" inkscape:label="Now 2" style="display:none">
      <rect x="1172" y="420" width="616" height="92" rx="12" fill="#E8EEFF"/>
      <rect x="1172" y="420" width="10" height="92" rx="5" fill="#2E5BFF"/>
    </g>
    <g id="Done_3" inkscape:label="Done 3" style="display:none">
      <rect x="1172" y="530" width="616" height="92" rx="12" fill="#E3E7EF"/>
      <circle cx="1756" cy="576" r="14" fill="#5B6478"/>
      <path d="M1749 576 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="Now_3" inkscape:label="Now 3" style="display:none">
      <rect x="1172" y="530" width="616" height="92" rx="12" fill="#E8EEFF"/>
      <rect x="1172" y="530" width="10" height="92" rx="5" fill="#2E5BFF"/>
    </g>
    <g id="Done_4" inkscape:label="Done 4" style="display:none">
      <rect x="1172" y="640" width="616" height="92" rx="12" fill="#E3E7EF"/>
      <circle cx="1756" cy="686" r="14" fill="#5B6478"/>
      <path d="M1749 686 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="Now_4" inkscape:label="Now 4" style="display:none">
      <rect x="1172" y="640" width="616" height="92" rx="12" fill="#E8EEFF"/>
      <rect x="1172" y="640" width="10" height="92" rx="5" fill="#2E5BFF"/>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="1180" y="276" text-anchor="start" font-size="24" font-weight="800" fill="#2E5BFF" letter-spacing="3">YOUR QUESTIONS</text>
    <text id="Guest_1" inkscape:label="Guest 1" x="1204" y="366" text-anchor="start" font-size="28" font-weight="700" fill="#0F1729">How long did the stage take to build?</text>
    <text id="Guest_2" inkscape:label="Guest 2" x="1204" y="476" text-anchor="start" font-size="28" font-weight="700" fill="#0F1729">Which song do you play last tonight?</text>
    <text id="Guest_3" inkscape:label="Guest 3" x="1204" y="586" text-anchor="start" font-size="28" font-weight="700" fill="#0F1729">Will the show tour next summer?</text>
    <text id="Guest_4" inkscape:label="Guest 4" x="1204" y="696" text-anchor="start" font-size="28" font-weight="700" fill="#0F1729">What was your first ever concert?</text>
  </g>
</svg>
