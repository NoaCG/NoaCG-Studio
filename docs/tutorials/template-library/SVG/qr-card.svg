<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>QR card</title>
  <desc>NoaCG Clean Studio template. Your own QR code picture beside a headline and the address written out in full. Name the picture layer f:QR image so the import offers it as a picture field.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="760" y="690" width="1040" height="300" rx="20" fill="#FFFFFF"/>
    <rect id="Accent" x="760" y="690" width="12" height="300" rx="6" fill="#2E5BFF"/>
    <rect id="Code_plate" inkscape:label="Code plate" x="806" y="714" width="252" height="252" rx="14" fill="#E3E7EF"/>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <image id="f_x3A_QR_image" inkscape:label="f:QR image" x="812" y="720" width="240" height="240" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>
    <text id="Headline" x="1100" text-anchor="start" y="812" font-size="52" font-weight="800" fill="#0F1729">Scan to donate</text>
    <text id="Address" x="1100" text-anchor="start" y="876" font-size="32" font-weight="700" fill="#2E5BFF">noacg.studio/give</text>
  </g>
</svg>
