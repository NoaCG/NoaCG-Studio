<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Rotating ticker</title>
  <desc>NoaCG Clean Studio template. A strip along the bottom with a News Label and three stories that take turns: Slide 1 to Slide 3 are drawn stacked in one place, and Story 1 to Story 3 show with their slide. Every six seconds the next story takes over; Hold keeps one up.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="0" y="952" width="1920" height="88" fill="#FFFFFF"/>
    <rect id="Label_box" inkscape:label="Label box" x="60" y="968" width="168" height="56" rx="10" fill="#2E5BFF"/>
    <g id="Slide_3" inkscape:label="Slide 3">
      <rect x="252" y="968" width="1608" height="56" rx="10" fill="#FFFFFF"/>
      <rect x="252" y="1018" width="1608" height="6" rx="3" fill="#2E5BFF"/>
    </g>
    <g id="Slide_2" inkscape:label="Slide 2">
      <rect x="252" y="968" width="1608" height="56" rx="10" fill="#FFFFFF"/>
      <rect x="252" y="1018" width="1072" height="6" rx="3" fill="#2E5BFF"/>
    </g>
    <g id="Slide_1" inkscape:label="Slide 1">
      <rect x="252" y="968" width="1608" height="56" rx="10" fill="#FFFFFF"/>
      <rect x="252" y="1018" width="536" height="6" rx="3" fill="#2E5BFF"/>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Label" x="92" y="1007" text-anchor="start" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="3">NEWS</text>
    <text id="Story_3" inkscape:label="Story 3" x="284" y="1007" text-anchor="start" font-size="30" font-weight="700" fill="#0F1729">Rain expected along the coast this evening</text>
    <text id="Story_2" inkscape:label="Story 2" x="284" y="1007" text-anchor="start" font-size="30" font-weight="700" fill="#0F1729">Tickets for the summer concert go on sale Friday</text>
    <text id="Story_1" inkscape:label="Story 1" x="284" y="1007" text-anchor="start" font-size="30" font-weight="700" fill="#0F1729">Harbour Street reopens to traffic after repairs</text>
  </g>
</svg>
