<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Picture</title>
  <desc>NoaCG Clean Studio template. A framed picture with a caption under it. Name the picture layer f:Picture so the import offers it as a picture field.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="360" y="100" width="1200" height="820" rx="24" fill="#FFFFFF"/>
    <rect id="Picture_plate" inkscape:label="Picture plate" x="400" y="140" width="1120" height="630" fill="#E3E7EF"/>
    <rect id="Accent" x="400" y="812" width="10" height="64" rx="5" fill="#2E5BFF"/>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <image id="f_x3A_Picture" inkscape:label="f:Picture" x="400" y="140" width="1120" height="630" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,"/>
    <text id="Caption" x="436" text-anchor="start" y="858" font-size="40" font-weight="700" fill="#0F1729">The harbour at first light</text>
  </g>
</svg>
