<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Quiz</title>
  <desc>NoaCG Clean Studio template. Question and Answer A to D; hidden Selected, Correct and Wrong moments per answer, and Locked in.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Question_box" inkscape:label="Question box" x="210" y="690" width="1500" height="104" rx="14" fill="#FFFFFF"/>
    <rect id="Letter_box_A" inkscape:label="Letter box A" x="210" y="810" width="76" height="76" rx="14" fill="#2E5BFF"/>
    <rect id="Answer_box_A" inkscape:label="Answer box A" x="292" y="810" width="662" height="76" rx="14" fill="#FFFFFF"/>
    <text id="static:Letter_A" inkscape:label="static:Letter A" x="248" y="861" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">A</text>
    <rect id="Letter_box_B" inkscape:label="Letter box B" x="966" y="810" width="76" height="76" rx="14" fill="#2E5BFF"/>
    <rect id="Answer_box_B" inkscape:label="Answer box B" x="1048" y="810" width="662" height="76" rx="14" fill="#FFFFFF"/>
    <text id="static:Letter_B" inkscape:label="static:Letter B" x="1004" y="861" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">B</text>
    <rect id="Letter_box_C" inkscape:label="Letter box C" x="210" y="898" width="76" height="76" rx="14" fill="#2E5BFF"/>
    <rect id="Answer_box_C" inkscape:label="Answer box C" x="292" y="898" width="662" height="76" rx="14" fill="#FFFFFF"/>
    <text id="static:Letter_C" inkscape:label="static:Letter C" x="248" y="949" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">C</text>
    <rect id="Letter_box_D" inkscape:label="Letter box D" x="966" y="898" width="76" height="76" rx="14" fill="#2E5BFF"/>
    <rect id="Answer_box_D" inkscape:label="Answer box D" x="1048" y="898" width="662" height="76" rx="14" fill="#FFFFFF"/>
    <text id="static:Letter_D" inkscape:label="static:Letter D" x="1004" y="949" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">D</text>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <g id="Selected_A" inkscape:label="Selected A" style="display:none">
      <rect x="295" y="813" width="656" height="70" rx="11" fill="none" stroke="#2E5BFF" stroke-width="6"/>
    </g>
    <g id="Correct_A" inkscape:label="Correct A" style="display:none">
      <rect x="292" y="810" width="662" height="76" rx="14" fill="#1DB56C"/>
    </g>
    <g id="Wrong_A" inkscape:label="Wrong A" style="display:none">
      <rect x="292" y="810" width="662" height="76" rx="14" fill="#DCE1EA"/>
    </g>
    <g id="Selected_B" inkscape:label="Selected B" style="display:none">
      <rect x="1051" y="813" width="656" height="70" rx="11" fill="none" stroke="#2E5BFF" stroke-width="6"/>
    </g>
    <g id="Correct_B" inkscape:label="Correct B" style="display:none">
      <rect x="1048" y="810" width="662" height="76" rx="14" fill="#1DB56C"/>
    </g>
    <g id="Wrong_B" inkscape:label="Wrong B" style="display:none">
      <rect x="1048" y="810" width="662" height="76" rx="14" fill="#DCE1EA"/>
    </g>
    <g id="Selected_C" inkscape:label="Selected C" style="display:none">
      <rect x="295" y="901" width="656" height="70" rx="11" fill="none" stroke="#2E5BFF" stroke-width="6"/>
    </g>
    <g id="Correct_C" inkscape:label="Correct C" style="display:none">
      <rect x="292" y="898" width="662" height="76" rx="14" fill="#1DB56C"/>
    </g>
    <g id="Wrong_C" inkscape:label="Wrong C" style="display:none">
      <rect x="292" y="898" width="662" height="76" rx="14" fill="#DCE1EA"/>
    </g>
    <g id="Selected_D" inkscape:label="Selected D" style="display:none">
      <rect x="1051" y="901" width="656" height="70" rx="11" fill="none" stroke="#2E5BFF" stroke-width="6"/>
    </g>
    <g id="Correct_D" inkscape:label="Correct D" style="display:none">
      <rect x="1048" y="898" width="662" height="76" rx="14" fill="#1DB56C"/>
    </g>
    <g id="Wrong_D" inkscape:label="Wrong D" style="display:none">
      <rect x="1048" y="898" width="662" height="76" rx="14" fill="#DCE1EA"/>
    </g>
    <g id="Locked_in" inkscape:label="Locked in" style="display:none">
      <rect x="1490" y="638" width="220" height="42" rx="10" fill="#2E5BFF"/>
      <text x="1600" y="666" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">LOCKED IN</text>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Question" x="960" y="756" text-anchor="middle" font-size="40" font-weight="800" fill="#0F1729">Which planet is closest to the Sun?</text>
    <text id="Answer_A" inkscape:label="Answer A" x="320" y="860" font-size="32" font-weight="600" fill="#0F1729">Venus</text>
    <text id="Answer_B" inkscape:label="Answer B" x="1076" y="860" font-size="32" font-weight="600" fill="#0F1729">Mercury</text>
    <text id="Answer_C" inkscape:label="Answer C" x="320" y="948" font-size="32" font-weight="600" fill="#0F1729">Mars</text>
    <text id="Answer_D" inkscape:label="Answer D" x="1076" y="948" font-size="32" font-weight="600" fill="#0F1729">Earth</text>
  </g>
</svg>
