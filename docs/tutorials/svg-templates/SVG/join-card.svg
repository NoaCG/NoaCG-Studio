<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Join card</title>
  <desc>NoaCG Clean Studio template. A QR code for the production's join link, with a title and instructions beside it.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="120" y="680" width="1060" height="320" rx="20" fill="#FFFFFF"/>
    <rect id="Accent" x="120" y="680" width="12" height="320" rx="6" fill="#2E5BFF"/>
    <rect id="Text_box" inkscape:label="Text box" x="448" y="704" width="708" height="272" rx="12" fill="#FFFFFF"/>
    <rect id="QR_plate" inkscape:label="QR plate" x="168" y="712" width="256" height="256" rx="14" fill="#EEF2FA"/>
    <g id="QR">
      <rect x="182" y="726" width="228" height="228" fill="#0F1729"/>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="464" y="778" font-size="52" font-weight="800" fill="#0F1729">Join the show</text>
    <text id="Instructions" x="464" y="840" font-size="30" font-weight="600" fill="#3A4560">Scan the code to vote and ask a question</text>
  </g>
</svg>
