<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Show countdown</title>
  <desc>NoaCG Clean Studio template. A full-screen countdown before the show: Title, Clock (05:00) and Subtitle. Choose how Clock counts when you import.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" width="1920" height="1080" fill="#0F1729"/>
    <rect id="Clock_box" inkscape:label="Clock box" x="580" y="420" width="760" height="260" rx="24" fill="#FFFFFF"/>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="960" y="360" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">The show starts in</text>
    <text id="Clock" x="960" y="622" text-anchor="middle" font-size="200" font-weight="800" fill="#0F1729" style="font-variant-numeric: tabular-nums">05:00</text>
    <text id="Subtitle" x="960" y="770" text-anchor="middle" font-size="34" font-weight="600" fill="#A9B3C7">Live from Studio 2</text>
  </g>
</svg>
