<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Game timer</title>
  <desc>NoaCG Clean Studio template. A corner countdown: Title and Clock (1:00 = one minute), a Timer bar over its Track, and hidden Warning, Paused and Time up moments.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="1576" y="48" width="296" height="144" rx="14" fill="#FFFFFF"/>
    <rect id="Track" x="1604" y="166" width="240" height="6" rx="3" fill="#E3E7EF"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <rect id="Timer_bar" inkscape:label="Timer bar" x="1604" y="166" width="240" height="6" rx="3" fill="#2E5BFF"/>
    <g id="Warning" style="display:none">
      <rect x="1579" y="51" width="290" height="138" rx="12" fill="none" stroke="#E5484D" stroke-width="6"/>
    </g>
    <g id="Paused" style="display:none">
      <rect x="1644" y="202" width="160" height="40" rx="10" fill="#0F1729"/>
      <text x="1724" y="229" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">PAUSED</text>
    </g>
    <g id="Time_up" inkscape:label="Time up" style="display:none">
      <rect x="1624" y="202" width="200" height="40" rx="10" fill="#E5484D"/>
      <text x="1724" y="229" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">TIME’S UP</text>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="1724" y="92" text-anchor="middle" font-size="20" font-weight="800" fill="#5B6478" letter-spacing="2">ROUND 1</text>
    <text id="Clock" x="1724" y="148" text-anchor="middle" font-size="60" font-weight="800" fill="#0F1729" style="font-variant-numeric: tabular-nums">1:00</text>
  </g>
</svg>
