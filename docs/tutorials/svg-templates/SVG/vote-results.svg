<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Vote results</title>
  <desc>NoaCG Clean Studio template. A side panel for a vote's results staged from Interaction: the question, Option 1 to Option 4 with bars and percentages, the vote count with open or closed status, a Voting open badge and a Winner mark per option.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" x="1180" y="120" width="620" height="860" rx="20" fill="#FFFFFF"/>
    <rect id="Accent" x="1180" y="120" width="620" height="10" rx="5" fill="#2E5BFF"/>
    <rect id="Track_1" inkscape:label="Track 1" x="1236" y="438" width="520" height="16" rx="8" fill="#E4E9F2"/>
    <rect id="Track_2" inkscape:label="Track 2" x="1236" y="566" width="520" height="16" rx="8" fill="#E4E9F2"/>
    <rect id="Track_3" inkscape:label="Track 3" x="1236" y="694" width="520" height="16" rx="8" fill="#E4E9F2"/>
    <rect id="Track_4" inkscape:label="Track 4" x="1236" y="822" width="520" height="16" rx="8" fill="#E4E9F2"/>
  </g>
  <g id="Moments" inkscape:groupmode="layer" inkscape:label="Moments">
    <rect id="Bar_1" inkscape:label="Bar 1" x="1236" y="438" width="520" height="16" rx="8" fill="#2E5BFF"/>
    <g id="Winner_1" inkscape:label="Winner 1" style="display:none">
      <rect x="1212" y="376" width="568" height="116" rx="14" fill="none" stroke="#1DB56C" stroke-width="6"/>
    </g>
    <rect id="Bar_2" inkscape:label="Bar 2" x="1236" y="566" width="520" height="16" rx="8" fill="#2E5BFF"/>
    <g id="Winner_2" inkscape:label="Winner 2" style="display:none">
      <rect x="1212" y="504" width="568" height="116" rx="14" fill="none" stroke="#1DB56C" stroke-width="6"/>
    </g>
    <rect id="Bar_3" inkscape:label="Bar 3" x="1236" y="694" width="520" height="16" rx="8" fill="#2E5BFF"/>
    <g id="Winner_3" inkscape:label="Winner 3" style="display:none">
      <rect x="1212" y="632" width="568" height="116" rx="14" fill="none" stroke="#1DB56C" stroke-width="6"/>
    </g>
    <rect id="Bar_4" inkscape:label="Bar 4" x="1236" y="822" width="520" height="16" rx="8" fill="#2E5BFF"/>
    <g id="Winner_4" inkscape:label="Winner 4" style="display:none">
      <rect x="1212" y="760" width="568" height="116" rx="14" fill="none" stroke="#1DB56C" stroke-width="6"/>
    </g>
    <g id="Vote_badge" inkscape:label="Vote badge">
      <rect x="1236" y="160" width="230" height="44" rx="22" fill="#1DB56C"/>
      <text x="1351" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif" letter-spacing="2">VOTING OPEN</text>
    </g>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Question" x="1236" y="282" font-size="38" font-weight="800" fill="#0F1729">Should the band play an encore?</text>
    <text id="Option_1" inkscape:label="Option 1" x="1236" y="420" font-size="32" font-weight="700" fill="#0F1729">Yes</text>
    <text id="Percent_1" inkscape:label="Percent 1" x="1756" y="420" text-anchor="end" font-size="32" font-weight="800" fill="#2E5BFF">0%</text>
    <text id="Option_2" inkscape:label="Option 2" x="1236" y="548" font-size="32" font-weight="700" fill="#0F1729">No</text>
    <text id="Percent_2" inkscape:label="Percent 2" x="1756" y="548" text-anchor="end" font-size="32" font-weight="800" fill="#2E5BFF">0%</text>
    <text id="Option_3" inkscape:label="Option 3" x="1236" y="676" font-size="32" font-weight="700" fill="#0F1729">Not sure</text>
    <text id="Percent_3" inkscape:label="Percent 3" x="1756" y="676" text-anchor="end" font-size="32" font-weight="800" fill="#2E5BFF">0%</text>
    <text id="Option_4" inkscape:label="Option 4" x="1236" y="804" font-size="32" font-weight="700" fill="#0F1729">Skip</text>
    <text id="Percent_4" inkscape:label="Percent 4" x="1756" y="804" text-anchor="end" font-size="32" font-weight="800" fill="#2E5BFF">0%</text>
    <text id="Total_votes" inkscape:label="Total votes" x="1236" y="934" font-size="24" font-weight="600" fill="#5A6680">0 votes</text>
  </g>
</svg>
