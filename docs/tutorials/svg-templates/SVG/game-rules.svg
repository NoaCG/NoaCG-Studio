<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Game rules</title>
  <desc>NoaCG Clean Studio template. A full-screen Title and Rule 1 to Rule 5, each on its own plate.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" width="1920" height="1080" fill="#0F1729"/>
    <rect id="Accent" x="912" y="238" width="96" height="8" rx="4" fill="#2E5BFF"/>
    <rect id="Number_box_1" inkscape:label="Number box 1" x="270" y="300" width="96" height="96" rx="14" fill="#2E5BFF"/>
    <rect id="Rule_box_1" inkscape:label="Rule box 1" x="382" y="300" width="1268" height="96" rx="14" fill="#FFFFFF"/>
    <text id="static:Number_1" inkscape:label="static:Number 1" x="318" y="362" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">1</text>
    <rect id="Number_box_2" inkscape:label="Number box 2" x="270" y="416" width="96" height="96" rx="14" fill="#2E5BFF"/>
    <rect id="Rule_box_2" inkscape:label="Rule box 2" x="382" y="416" width="1268" height="96" rx="14" fill="#FFFFFF"/>
    <text id="static:Number_2" inkscape:label="static:Number 2" x="318" y="478" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">2</text>
    <rect id="Number_box_3" inkscape:label="Number box 3" x="270" y="532" width="96" height="96" rx="14" fill="#2E5BFF"/>
    <rect id="Rule_box_3" inkscape:label="Rule box 3" x="382" y="532" width="1268" height="96" rx="14" fill="#FFFFFF"/>
    <text id="static:Number_3" inkscape:label="static:Number 3" x="318" y="594" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">3</text>
    <rect id="Number_box_4" inkscape:label="Number box 4" x="270" y="648" width="96" height="96" rx="14" fill="#2E5BFF"/>
    <rect id="Rule_box_4" inkscape:label="Rule box 4" x="382" y="648" width="1268" height="96" rx="14" fill="#FFFFFF"/>
    <text id="static:Number_4" inkscape:label="static:Number 4" x="318" y="710" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">4</text>
    <rect id="Number_box_5" inkscape:label="Number box 5" x="270" y="764" width="96" height="96" rx="14" fill="#2E5BFF"/>
    <rect id="Rule_box_5" inkscape:label="Rule box 5" x="382" y="764" width="1268" height="96" rx="14" fill="#FFFFFF"/>
    <text id="static:Number_5" inkscape:label="static:Number 5" x="318" y="826" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF" font-family="Manrope, sans-serif">5</text>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="960" y="200" text-anchor="middle" font-size="72" font-weight="800" fill="#FFFFFF">How to play</text>
    <text id="Rule_1" inkscape:label="Rule 1" x="418" y="360" font-size="34" font-weight="600" fill="#0F1729">Each team answers in turn.</text>
    <text id="Rule_2" inkscape:label="Rule 2" x="418" y="476" font-size="34" font-weight="600" fill="#0F1729">You have 30 seconds for every question.</text>
    <text id="Rule_3" inkscape:label="Rule 3" x="418" y="592" font-size="34" font-weight="600" fill="#0F1729">A correct answer scores one point.</text>
    <text id="Rule_4" inkscape:label="Rule 4" x="418" y="708" font-size="34" font-weight="600" fill="#0F1729">A wrong answer passes the question on.</text>
    <text id="Rule_5" inkscape:label="Rule 5" x="418" y="824" font-size="34" font-weight="600" fill="#0F1729">The highest score after five rounds wins.</text>
  </g>
</svg>
