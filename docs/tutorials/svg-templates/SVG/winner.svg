<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>Winner</title>
  <desc>NoaCG Clean Studio template. A centred winner card: Title, Name and Subtitle, with static confetti. Choose an entrance such as Pop when you import.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <g id="Confetti">
      <rect x="520" y="330" width="28" height="12" rx="3" fill="#2E5BFF" transform="rotate(20 534 336)"/>
      <rect x="600" y="250" width="18" height="18" rx="3" fill="#FFB224" transform="rotate(-15 609 259)"/>
      <rect x="1360" y="300" width="30" height="12" rx="3" fill="#1DB56C" transform="rotate(-25 1375 306)"/>
      <rect x="1420" y="400" width="16" height="16" rx="3" fill="#2E5BFF" transform="rotate(30 1428 408)"/>
      <rect x="470" y="520" width="16" height="16" rx="3" fill="#1DB56C" transform="rotate(10 478 528)"/>
      <rect x="1450" y="600" width="28" height="12" rx="3" fill="#FFB224" transform="rotate(35 1464 606)"/>
      <rect x="560" y="760" width="26" height="12" rx="3" fill="#FFB224" transform="rotate(-30 573 766)"/>
      <rect x="1340" y="790" width="20" height="20" rx="3" fill="#2E5BFF" transform="rotate(15 1350 800)"/>
    </g>
    <rect id="Panel" x="560" y="340" width="800" height="400" rx="24" fill="#FFFFFF"/>
    <rect id="Title_box" inkscape:label="Title box" x="820" y="310" width="280" height="60" rx="30" fill="#2E5BFF"/>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Title" x="960" y="350" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="4">WINNER</text>
    <text id="Name" x="960" y="580" text-anchor="middle" font-size="96" font-weight="800" fill="#0F1729">Team Blue</text>
    <text id="Subtitle" x="960" y="660" text-anchor="middle" font-size="40" font-weight="600" fill="#5B6478">12 points</text>
  </g>
</svg>
