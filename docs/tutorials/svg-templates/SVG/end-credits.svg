<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1920 1080">
  <title>End credits</title>
  <desc>NoaCG Clean Studio template. Editable credits: Heading (the show title), then one role or name per text, Credits, Credits 2 and on. In playout, paste the list: its first line is the show title.</desc>
  <g id="Board" inkscape:groupmode="layer" inkscape:label="Board">
    <rect id="Panel" width="1920" height="1080" fill="#0F1729"/>
    <rect id="Accent" x="912" y="232" width="96" height="8" rx="4" fill="#2E5BFF"/>
  </g>
  <g id="Text" inkscape:groupmode="layer" inkscape:label="Text" font-family="Manrope, sans-serif">
    <text id="Heading" x="960" y="190" text-anchor="middle" font-size="64" font-weight="800" fill="#FFFFFF">The Weekly Show</text>
    <text id="Credits" x="960" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#8FA8FF" letter-spacing="1">Director</text>
    <text id="Credits_2" inkscape:label="Credits 2" x="960" y="386" text-anchor="middle" font-size="44" font-weight="600" fill="#FFFFFF">Alex Rivera</text>
    <text id="Credits_3" inkscape:label="Credits 3" x="960" y="506" text-anchor="middle" font-size="28" font-weight="700" fill="#8FA8FF" letter-spacing="1">Producer</text>
    <text id="Credits_4" inkscape:label="Credits 4" x="960" y="562" text-anchor="middle" font-size="44" font-weight="600" fill="#FFFFFF">Sam Lee</text>
    <text id="Credits_5" inkscape:label="Credits 5" x="960" y="682" text-anchor="middle" font-size="28" font-weight="700" fill="#8FA8FF" letter-spacing="1">Camera</text>
    <text id="Credits_6" inkscape:label="Credits 6" x="960" y="738" text-anchor="middle" font-size="44" font-weight="600" fill="#FFFFFF">Kim Park</text>
    <text id="Credits_7" inkscape:label="Credits 7" x="960" y="798" text-anchor="middle" font-size="44" font-weight="600" fill="#FFFFFF">Jo Berg</text>
  </g>
</svg>
