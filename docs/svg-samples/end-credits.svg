<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - END CREDITS.
     A full-frame credit roll with one live text layer for the heading and for every role line.
     Naming each line Director, Camera and so on makes the operator's rundown read back clearly.
     The centred credit column is the design, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, transparent background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .cr-heading { font-family: Playfair Display; font-weight: 700; }
      .cr-line { font-family: 'Source Serif 4'; font-weight: 500; letter-spacing: 1px; }
    </style>
  </defs>

  <g id="Credit_x20_column" data-name="Credit column">
    <rect x="510" y="120" width="900" height="780" rx="8" fill="#0d1017" opacity="0.9"/>
    <rect x="700" y="268" width="520" height="3" fill="#f6a623"/>
    <rect x="700" y="800" width="520" height="3" fill="#1e2530"/>
  </g>

  <!-- Every visible line is its own named layer, exactly as it should appear in a rundown. -->
  <g id="Credit_x20_words" data-name="Credit words">
    <text id="Section_x20_heading" data-name="Section heading" class="cr-heading" x="960" y="222" font-size="56" fill="#ffffff" text-anchor="middle">Production team</text>
    <text id="Director" class="cr-line" x="960" y="390" font-size="34" fill="#b7bcc4" text-anchor="middle">DIRECTOR  ·  MAYA LIND</text>
    <text id="Producer" class="cr-line" x="960" y="490" font-size="34" fill="#b7bcc4" text-anchor="middle">PRODUCER  ·  OTTO LEHTO</text>
    <text id="Camera" class="cr-line" x="960" y="590" font-size="34" fill="#b7bcc4" text-anchor="middle">CAMERA  ·  INA BERG</text>
    <text id="Sound" class="cr-line" x="960" y="690" font-size="34" fill="#b7bcc4" text-anchor="middle">SOUND  ·  NOEL KIVI</text>
  </g>
</svg>
