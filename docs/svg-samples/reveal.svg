<?xml version="1.0" encoding="UTF-8"?>
<!-- NoaCG SVG practice sample - REVEAL.
     Three nominee lines each carry a switched-off winner state, plus one hidden board badge.
     The designer draws every reveal moment instead of asking software to invent a highlight.
     The centred award board is the design, so this file wants shrink rather than growth.
     Full-frame 1920x1080 artboard, opaque #0d1017 background. See docs/SVG_AUTHORING.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .rv-title { font-family: Playfair Display; font-weight: 700; }
      .rv-name { font-family: 'Source Serif 4'; font-weight: 600; }
      .rv-badge { font-family: Inter; font-weight: 800; letter-spacing: 5px; }
    </style>
  </defs>

  <g id="Reveal_x20_background" data-name="Reveal background">
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1017"/>
    <rect x="330" y="150" width="1260" height="780" rx="14" fill="#161b24"/>
    <rect x="330" y="150" width="1260" height="8" fill="#f6a623"/>
    <rect x="420" y="365" width="1080" height="120" rx="7" fill="#1e2530"/>
    <rect x="420" y="515" width="1080" height="120" rx="7" fill="#1e2530"/>
    <rect x="420" y="665" width="1080" height="120" rx="7" fill="#1e2530"/>
  </g>

  <!-- Each winner state is drawn once for the line it belongs to and switched off. -->
  <g id="Nominee_x20_1_x20_winner" data-name="Nominee 1 winner" display="none">
    <rect x="420" y="365" width="1080" height="120" rx="7" fill="#0f7a4a"/>
    <rect x="420" y="365" width="12" height="120" fill="#f6a623"/>
  </g>
  <g id="Nominee_x20_2_x20_winner" data-name="Nominee 2 winner" style="display:none">
    <rect x="420" y="515" width="1080" height="120" rx="7" fill="#0f7a4a"/>
    <rect x="420" y="515" width="12" height="120" fill="#f6a623"/>
  </g>
  <g id="Nominee_x20_3_x20_winner" data-name="Nominee 3 winner" display="none">
    <rect x="420" y="665" width="1080" height="120" rx="7" fill="#0f7a4a"/>
    <rect x="420" y="665" width="12" height="120" fill="#f6a623"/>
  </g>

  <!-- The board-level badge is also a complete hidden state, including its fixed wording. -->
  <g id="Winner_x20_badge" data-name="Winner badge" style="display:none">
    <rect x="760" y="832" width="400" height="66" rx="33" fill="#f6a623"/>
    <text class="rv-badge" x="960" y="874" font-size="24" fill="#10131a" text-anchor="middle">WINNER</text>
  </g>

  <!-- Visible words paint last, above every reveal state. The board stays fixed. -->
  <g id="Reveal_x20_words" data-name="Reveal words">
    <text id="Board_x20_title" data-name="Board title" class="rv-title" x="960" y="288" font-size="64" fill="#ffffff" text-anchor="middle">The nominees</text>
    <text id="Nominee_x20_1" data-name="Nominee 1" class="rv-name" x="960" y="440" font-size="42" fill="#ffffff" text-anchor="middle">Silent Harbour</text>
    <text id="Nominee_x20_2" data-name="Nominee 2" class="rv-name" x="960" y="590" font-size="42" fill="#ffffff" text-anchor="middle">After the Snow</text>
    <text id="Nominee_x20_3" data-name="Nominee 3" class="rv-name" x="960" y="740" font-size="42" fill="#ffffff" text-anchor="middle">Blue Hour</text>
  </g>
</svg>
