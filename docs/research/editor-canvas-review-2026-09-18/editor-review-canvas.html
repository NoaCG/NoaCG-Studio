<style>

#nc-timeline-first *{box-sizing:border-box}#nc-timeline-first [hidden]{display:none!important}#nc-timeline-first button,#nc-timeline-first input{font:inherit;color:var(--n-text);border:1px solid var(--n-line);border-radius:3px;background:var(--n-panel);min-height:28px;padding:3px 7px;min-width:0}#nc-timeline-first button{cursor:pointer}#nc-timeline-first button:hover,#nc-timeline-first button[aria-pressed=true]{background:var(--n-bar)}#nc-timeline-first button:disabled{opacity:.45;cursor:default}#nc-timeline-first input[type=number]{width:65px;color:var(--n-blue);font-variant-numeric:tabular-nums}#nc-timeline-first .n-header,#nc-timeline-first .n-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--n-line)}#nc-timeline-first .n-grow{flex:1}#nc-timeline-first .n-muted{color:var(--n-muted)}#nc-timeline-first .n-title{font-weight:600}#nc-timeline-first .n-main{display:grid;grid-template-columns:minmax(0,1fr) 270px;height:410px}#nc-timeline-first .n-canvas{background:var(--n-deep);min-width:0;display:flex;flex-direction:column}#nc-timeline-first .n-art-area{flex:1;min-height:0;position:relative}#nc-timeline-first .n-art-area>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#nc-timeline-first .n-inspector{background:var(--n-panel);padding:13px;border-left:1px solid var(--n-line);overflow:auto}#nc-timeline-first .n-inspector h3{font-size:12px;font-weight:600;margin:0 0 12px}#nc-timeline-first .n-prop{display:grid;grid-template-columns:28px 1fr 65px 28px;gap:5px;align-items:center;margin:9px 0}#nc-timeline-first .n-prop button{padding:2px}#nc-timeline-first .n-field{width:100%;margin:8px 0}#nc-timeline-first .n-question{padding:12px;border-bottom:1px solid var(--n-line);background:var(--n-panel)}#nc-timeline-first .n-question .n-toolbar{padding:9px 0 0;border:0}#nc-timeline-first .n-timeline{background:var(--n-panel);border-top:1px solid var(--n-line)}#nc-timeline-first .n-grid{display:grid;grid-template-columns:220px minmax(0,1fr);padding-right:14px}#nc-timeline-first .n-label{padding:5px 10px;min-height:30px;border-bottom:1px solid var(--n-line);display:flex;align-items:center;gap:5px;min-width:0}#nc-timeline-first .n-label button{padding:0 4px;min-height:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nc-timeline-first .n-ruler{height:32px;display:flex;align-items:center;justify-content:space-between;cursor:ew-resize;padding:0 2px;touch-action:none}#nc-timeline-first .n-lane,#nc-timeline-first .n-ruler,#nc-timeline-first .n-flags{position:relative;border-left:1px solid var(--n-line);border-bottom:1px solid var(--n-line);background:var(--n-deep);min-width:0}#nc-timeline-first .n-flags{height:38px}#nc-timeline-first .n-flag{position:absolute;bottom:0;transform:translateX(-1px);border-radius:0 4px 4px 0;border-left:2px solid var(--n-orange);color:var(--n-orange);white-space:nowrap;max-width:100px;touch-action:none;cursor:ew-resize}#nc-timeline-first .n-lane{height:32px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--n-line) calc(12.5% - 1px),var(--n-line) 12.5%)}#nc-timeline-first .n-lane:after,#nc-timeline-first .n-ruler:after,#nc-timeline-first .n-flags:after{content:'';position:absolute;left:var(--n-head);width:1px;top:0;bottom:0;background:var(--n-blue);pointer-events:none;z-index:3}#nc-timeline-first .n-boundary{position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed var(--n-orange);opacity:.65;pointer-events:none}#nc-timeline-first .n-bar{position:absolute;top:5px;height:22px;background:var(--n-bar);border:1px solid var(--n-blue);border-radius:2px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:space-between;min-width:12px}#nc-timeline-first .n-bar.selected{outline:1px solid var(--n-blue);outline-offset:1px}#nc-timeline-first .n-handle{width:9px;height:100%;cursor:ew-resize;flex-shrink:0;background:var(--n-blue);opacity:.65}#nc-timeline-first .n-bar-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;pointer-events:none;padding:0 5px}#nc-timeline-first .n-key{position:absolute;top:2px;transform:translateX(-50%);padding:0 2px;min-height:25px;border:0;background:transparent;color:var(--n-blue);font-size:17px;touch-action:none;cursor:ew-resize}#nc-timeline-first .n-status{min-height:31px;padding:7px 10px;color:var(--n-muted);border-top:1px solid var(--n-line)}#nc-timeline-first .n-wait{color:var(--n-orange)}#nc-timeline-first .n-empty{padding:16px;color:var(--n-muted)}

<header class="n-header"><span class="n-title">NoaCG</span><span class="n-muted">/ Lower third</span><span class="n-grow"></span><button id="nt-reset">Reset study</button><button id="nt-undo" disabled>Undo</button><span class="n-muted">Design study</span></header>
<section class="n-question" id="nt-reverse" hidden><span class="n-title" id="nt-reverse-label">Reverse the entrance animation?</span><div class="n-toolbar"><button id="nt-yes">Yes, create Out keys</button><button id="nt-no">No, animate it myself</button></div></section>
<main class="n-main"><section class="n-canvas"><div class="n-toolbar"><span class="n-title">Composition</span><span class="n-muted">960 × 540 · 25 fps</span><span class="n-grow"></span><span id="nt-play-state">Editing · 1.00 s</span></div><div class="n-art-area"><svg id="nt-svg" viewBox="-240 -70 1440 680" role="img" aria-label="Canvas with draggable graphic layers and visible pasteboard"><rect x="0" y="0" width="960" height="540" fill="#163347"/><path d="M0 360Q200 180 450 370T960 260V540H0Z" fill="#234c59"/><rect x="48" y="27" width="864" height="486" fill="none" stroke="#9db8c2" stroke-dasharray="5 9" opacity=".3"/><g id="nt-art"></g></svg></div></section><aside class="n-inspector"><h3 id="nt-selected">Headline</h3><span class="n-muted">Transform · <span id="nt-time">25f</span></span><div id="nt-props"></div><label for="nt-text">Text</label><input id="nt-text" class="n-field" value="The stories that matter"><span class="n-muted" id="nt-layer-span">Layer · 0f to 100f</span><div class="n-toolbar"><button id="nt-text-add">+ Text</button><button id="nt-shape-add">+ Shape</button></div></aside></main>
<section class="n-timeline" aria-label="Timeline"><div class="n-toolbar"><span class="n-title">Timeline</span><button id="nt-play">Play In</button><button id="nt-next">Next</button><button id="nt-out">Out</button><button id="nt-pause">Pause</button><span class="n-grow"></span><label>Frame <input id="nt-frame" type="number" min="0" max="100" value="25"></label><button id="nt-add-step">Add Step</button><button id="nt-add-out">Add Out</button></div><div class="n-grid" id="nt-grid"><div class="n-label n-muted">Time · seconds</div><div class="n-ruler" id="nt-ruler"></div><div class="n-label">Cue flags</div><div class="n-flags" id="nt-flags"></div><div id="nt-rows" style="display:contents"></div></div></section>
<footer class="n-status" id="nt-status" role="status">Entrance keys are ready. Add Out at the playhead.</footer>
<script>
(()=>{
const root=document.getElementById('nc-timeline-first'),q=id=>root.querySelector('#'+id),clone=x=>JSON.parse(JSON.stringify(x));
const initial=()=>({frame:25,phase:'edit',selected:1,flags:[],layers:[{id:0,name:'Background',type:'shape',text:'',start:0,end:100,y:355,w:690,h:90,base:{x:135,opacity:100},keys:{x:[{t:0,v:-710},{t:25,v:135}],opacity:[{t:0,v:0},{t:25,v:100}]},open:false},{id:1,name:'Headline',type:'text',text:'The stories that matter',start:0,end:100,y:370,w:610,h:60,base:{x:170,opacity:100},keys:{x:[{t:0,v:-675},{t:25,v:170}],opacity:[{t:0,v:0},{t:25,v:100}]},open:true}]});
let state=initial(),history=[],timer=0,gesture=null,activeTool='select';const duration=100;
const selected=()=>state.layers.find(l=>l.id===state.selected);
const say=s=>q('nt-status').textContent=s;
const stop=()=>{cancelAnimationFrame(timer);timer=0;};
function snap(){history.push(clone(state));}
function sample(l,p,t=state.frame){const keys=l.keys[p];if(!keys.length)return l.base[p];if(t<=keys[0].t)return keys[0].v;for(let i=1;i<keys.length;i++)if(t<=keys[i].t){const a=keys[i-1],b=keys[i];return a.v+(b.v-a.v)*(t-a.t)/(b.t-a.t);}return keys.at(-1).v;}
function put(l,p,v){if(!l.keys[p].length)l.base[p]=v;else{const k=l.keys[p].find(k=>k.t===state.frame);if(k)k.v=v;else l.keys[p].push({t:state.frame,v});l.keys[p].sort((a,b)=>a.t-b.t);}}
function seek(t){stop();state.frame=Math.max(0,Math.min(duration,Math.round(t)));state.phase='edit';render();}
function arm(p){stop();snap();const l=selected(),v=sample(l,p);if(l.keys[p].length){l.keys[p]=[];l.base[p]=v;}else l.keys[p]=[{t:state.frame,v}];render();}
function key(p){stop();snap();const l=selected(),v=sample(l,p),i=l.keys[p].findIndex(k=>k.t===state.frame);if(i<0)l.keys[p].push({t:state.frame,v});else{l.keys[p].splice(i,1);if(!l.keys[p].length)l.base[p]=v;}l.keys[p].sort((a,b)=>a.t-b.t);render();}
for(const [p,name] of [['x','Position X'],['opacity','Opacity %']]){const row=document.createElement('div');row.className='n-prop';const clock=document.createElement('button');clock.innerHTML='<i data-lucide="timer" aria-hidden="true"></i>';clock.setAttribute('aria-label',name+' animation');clock.dataset.clock=p;clock.onclick=()=>arm(p);const label=document.createElement('span');label.textContent=name;const input=document.createElement('input');input.type='number';input.setAttribute('aria-label',name);input.dataset.prop=p;input.onchange=()=>{snap();put(selected(),p,p==='opacity'?Math.max(0,Math.min(100,+input.value)):+input.value);render();};const diamond=document.createElement('button');diamond.dataset.diamond=p;diamond.setAttribute('aria-label',name+' key');diamond.onclick=()=>key(p);row.append(clock,label,input,diamond);q('nt-props').append(row);}
const make=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
function visible(l){const atBoundary=state.phase==='hold'&&state.flags.some(f=>f.t===state.frame),atStart=state.frame===l.start&&atBoundary;return state.frame>=l.start&&(state.frame<l.end||atBoundary&&state.frame===l.end)&&!atStart;}
function paint(){
 const l=selected();q('nt-selected').textContent=l.name;q('nt-time').textContent=state.frame+'f';q('nt-frame').value=state.frame;q('nt-play-state').textContent=state.phase==='hold'?'Waiting for '+(state.flags.find(f=>f.t===state.frame)?.type==='out'?'Out':'Next'):state.phase==='off'?'Off air':(state.phase==='play'?'Playing':'Editing')+' · '+(state.frame/25).toFixed(2)+' s';q('nt-play-state').classList.toggle('n-wait',state.phase==='hold');root.style.setProperty('--n-head',state.frame/duration*100+'%');q('nt-undo').disabled=!history.length;q('nt-out').disabled=!state.flags.some(f=>f.type==='out');q('nt-add-out').disabled=state.flags.some(f=>f.type==='out');q('nt-next').disabled=!(state.phase==='hold'&&state.flags.some(f=>f.t===state.frame&&f.type==='step'));q('nt-text').value=l.text;q('nt-text').disabled=l.type!=='text';q('nt-layer-span').textContent='Layer · '+l.start+'f to '+l.end+'f';
 for(const p of ['x','opacity']){root.querySelector('[data-prop='+p+']').value=+sample(l,p).toFixed(2);root.querySelector('[data-clock='+p+']').setAttribute('aria-pressed',!!l.keys[p].length);root.querySelector('[data-diamond='+p+']').textContent=l.keys[p].some(k=>k.t===state.frame)?'◆':'◇';}
 for(const layer of state.layers){const el=q('nt-art-'+layer.id);if(!el)continue;el.setAttribute('transform',`translate(${sample(layer,'x')} ${layer.y}) scale(${layer.scaleX??1} ${layer.scaleY??1})`);el.style.opacity=sample(layer,'opacity')/100;el.style.visibility=visible(layer)&&state.phase!=='off'?'visible':'hidden';el.querySelector('[data-selection]').setAttribute('stroke',layer.id===state.selected?'#70ceff':'transparent');el.querySelectorAll('[data-resize]').forEach(h=>h.style.display=layer.id===state.selected?'':'none');const text=el.querySelector('text');if(text)text.textContent=layer.text;}
 if(q('nt-scale'))q('nt-scale').textContent='Scale X '+Math.round((l.scaleX??1)*100)+'% · Y '+Math.round((l.scaleY??1)*100)+'%';
}
function render(){
 q('nt-ruler').replaceChildren(...Array.from({length:9},(_,i)=>make('span','',(i*.5).toFixed(1))));q('nt-flags').replaceChildren();
 for(const flag of state.flags){const b=make('button','n-flag',flag.type==='out'?'Out':'Step '+flag.id);b.dataset.flag=flag.id;b.style.left=flag.t+'%';b.setAttribute('aria-label',(flag.type==='out'?'Out':'Step '+flag.id)+' flag at frame '+flag.t);b.onpointerdown=e=>startGesture(e,{type:'flag',id:flag.id});q('nt-flags').append(b);}
 q('nt-rows').replaceChildren();q('nt-art').replaceChildren();
 for(const l of state.layers){const label=make('div','n-label');const disclosure=make('button','',l.open?'▾':'▸');disclosure.setAttribute('aria-label','Expand '+l.name);disclosure.onclick=()=>{l.open=!l.open;render();};const select=make('button','',l.name);select.onclick=()=>{state.selected=l.id;render();};select.setAttribute('aria-pressed',l.id===state.selected);label.append(disclosure,select);const lane=make('div','n-lane');lane.dataset.layerLane=l.id;const bar=make('div','n-bar'+(l.id===state.selected?' selected':''));bar.dataset.bar=l.id;bar.style.left=l.start+'%';bar.style.width=(l.end-l.start)+'%';bar.setAttribute('aria-label',l.name+' layer bar');for(const edge of ['start','end']){const h=make('span','n-handle');h.dataset.edge=edge;bar.append(h);if(edge==='start')bar.append(make('span','n-bar-name',l.name));}bar.onpointerdown=e=>startGesture(e,{type:e.target.dataset.edge||'move',id:l.id});lane.append(bar);boundaries(lane);q('nt-rows').append(label,lane);
 if(l.open)for(const p of ['x','opacity']){const lab=make('div','n-label n-muted','　'+(p==='x'?'Position X':'Opacity'));const track=make('div','n-lane');track.dataset.track=l.id+'-'+p;boundaries(track);for(let i=0;i<l.keys[p].length;i++){const k=l.keys[p][i],b=make('button','n-key','◆');b.style.left=k.t+'%';b.dataset.key=l.id+'-'+p+'-'+i;b.setAttribute('aria-label',l.name+' '+p+' key at frame '+k.t);b.onpointerdown=e=>startGesture(e,{type:'key',id:l.id,p,index:i});track.append(b);}q('nt-rows').append(lab,track);}
 const ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g');g.id='nt-art-'+l.id;g.dataset.art=l.id;g.style.cursor='move';const hit=document.createElementNS(ns,l.type==='ellipse'?'ellipse':'rect');if(l.type==='ellipse'){hit.setAttribute('cx',l.w/2);hit.setAttribute('cy',l.h/2);hit.setAttribute('rx',l.w/2);hit.setAttribute('ry',l.h/2);}else{hit.setAttribute('width',l.w);hit.setAttribute('height',l.h);}hit.setAttribute('fill',l.type!=='text'?'#f1f3ed':'transparent');hit.setAttribute('pointer-events','all');g.append(hit);if(l.type==='text'){const text=document.createElementNS(ns,'text');text.setAttribute('x',0);text.setAttribute('y',38);text.setAttribute('fill',l.id===1?'#183346':'#f3f4ed');text.setAttribute('font-size',l.id===1?'33':'25');text.setAttribute('font-family','Arial,sans-serif');g.append(text);}const outline=document.createElementNS(ns,'rect');outline.dataset.selection='';outline.setAttribute('width',l.w);outline.setAttribute('height',l.h);outline.setAttribute('fill','none');outline.setAttribute('stroke-width','2');outline.setAttribute('vector-effect','non-scaling-stroke');g.append(outline);
 for(const [hx,hy] of [[0,0],[.5,0],[1,0],[0,.5],[1,.5],[0,1],[.5,1],[1,1]]){const handle=document.createElementNS(ns,'rect');handle.dataset.resize=hx+','+hy;handle.setAttribute('x',hx*l.w-6);handle.setAttribute('y',hy*l.h-6);handle.setAttribute('width',12);handle.setAttribute('height',12);handle.setAttribute('fill','#eaf8ff');handle.setAttribute('stroke','#238ec6');handle.onpointerdown=e=>startResize(e,l.id,hx,hy);g.append(handle);}g.onpointerdown=e=>startCanvas(e,l.id);q('nt-art').append(g);
 }paint();
}
function boundaries(lane){for(const f of state.flags){const line=make('span','n-boundary');line.style.left=f.t+'%';lane.append(line);}}
function frameDelta(e){return Math.round((e.clientX-gesture.x)/gesture.width*duration);}
function near(t,e){if(e.altKey)return t;for(const v of [0,state.frame,...state.flags.map(f=>f.t)])if(Math.abs(t-v)<=2)return v;return t;}
function startGesture(e,meta){if(e.button!==0)return;e.preventDefault();stop();const lane=e.currentTarget.closest('.n-lane')||q('nt-flags');gesture={...meta,before:clone(state),x:e.clientX,width:lane.getBoundingClientRect().width,moved:false};root.setPointerCapture(e.pointerId);}
function startCanvas(e,id){if(e.button!==0||activeTool!=='select'||e.target.dataset.resize)return;e.preventDefault();e.stopPropagation();stop();state.selected=id;paint();const pt=svgPoint(e);gesture={type:'canvas',id,before:clone(state),sx:pt.x,sy:pt.y,moved:false};root.setPointerCapture(e.pointerId);}
function startResize(e,id,hx,hy){if(activeTool!=='select')return;e.preventDefault();e.stopPropagation();stop();state.selected=id;gesture={type:'resize',id,hx,hy,before:clone(state),origin:svgPoint(e),moved:false};root.setPointerCapture(e.pointerId);}
function svgPoint(e){const p=q('nt-svg').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(q('nt-svg').getScreenCTM().inverse());}
root.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture;state=clone(g.before);let l=state.layers.find(l=>l.id===g.id);
 if(g.type==='draw'){const pt=svgPoint(e);let dx=pt.x-g.origin.x,dy=pt.y-g.origin.y;if(e.shiftKey){const size=Math.max(Math.abs(dx),Math.abs(dy));dx=Math.sign(dx||1)*size;dy=Math.sign(dy||1)*size;}l={...g.layer,w:Math.max(1,Math.abs(dx)),h:Math.max(1,Math.abs(dy)),y:Math.min(g.origin.y,g.origin.y+dy),base:{x:Math.min(g.origin.x,g.origin.x+dx),opacity:100}};state.layers.push(l);state.selected=l.id;g.moved=Math.abs(dx)+Math.abs(dy)>4;render();return;}
 if(g.type==='resize'){const pt=svgPoint(e),sx=l.scaleX??1,sy=l.scaleY??1,oldW=l.w*sx,oldH=l.h*sy;let w=g.hx===.5?oldW:Math.max(8,oldW+(pt.x-g.origin.x)*(g.hx===0?-1:1)),h=g.hy===.5?oldH:Math.max(8,oldH+(pt.y-g.origin.y)*(g.hy===0?-1:1));if(e.shiftKey&&g.hx!==.5&&g.hy!==.5){const ratio=Math.max(w/oldW,h/oldH);w=oldW*ratio;h=oldH*ratio;}l.scaleX=w/l.w;l.scaleY=h/l.h;if(g.hx===0)put(l,'x',sample(l,'x')+oldW-w);if(g.hy===0)l.y+=oldH-h;g.moved=true;paint();return;}
 if(g.type==='canvas'){const pt=svgPoint(e);put(l,'x',Math.round(sample(l,'x')+pt.x-g.sx));l.y=Math.round(l.y+pt.y-g.sy);g.moved=true;paint();return;}const delta=frameDelta(e);if(!delta)return;g.moved=true;if(g.type==='flag'){const f=state.flags.find(f=>f.id===g.id),other=state.flags.filter(x=>x.id!==g.id);let t=near(f.t+delta,e);if(t<=0||t>=duration||other.some(x=>Math.abs(x.t-t)<2)||f.type==='step'&&other.some(x=>x.type==='out'&&x.t<=t)||f.type==='out'&&other.some(x=>x.type==='step'&&x.t>=t))return;f.t=t;state.flags.sort((a,b)=>a.t-b.t);}else if(g.type==='key'){const k=l.keys[g.p][g.index],t=near(Math.max(0,Math.min(duration,k.t+delta)),e);if(!l.keys[g.p].some((x,i)=>i!==g.index&&x.t===t)){k.t=t;l.keys[g.p].sort((a,b)=>a.t-b.t);}}else if(g.type==='start'){l.start=near(Math.max(0,Math.min(l.end-1,l.start+delta)),e);}else if(g.type==='end'){l.end=near(Math.min(duration,Math.max(l.start+1,l.end+delta)),e);}else{const wanted=near(l.start+delta,e),shift=Math.max(-l.start,Math.min(duration-l.end,wanted-l.start));l.start+=shift;l.end+=shift;for(const p of ['x','opacity'])for(const k of l.keys[p])k.t+=shift;}render();});
root.addEventListener('pointerup',()=>{if(!gesture)return;if(gesture.moved){history.push(gesture.before);say('Timeline edit applied. Undo restores the complete gesture.');}else if(gesture.type==='key'){const l=state.layers.find(l=>l.id===gesture.id);state.frame=l.keys[gesture.p][gesture.index].t;state.phase='edit';}else if(gesture.type==='flag'){state.frame=state.flags.find(f=>f.id===gesture.id).t;state.phase='edit';}gesture=null;render();});

let ruler=false;const scrub=e=>{const b=q('nt-ruler').getBoundingClientRect();seek((e.clientX-b.left)/b.width*duration);};q('nt-ruler').onpointerdown=e=>{ruler=true;e.currentTarget.setPointerCapture(e.pointerId);scrub(e);};q('nt-ruler').onpointermove=e=>{if(ruler)scrub(e);};q('nt-ruler').onpointerup=()=>ruler=false;q('nt-ruler').onpointercancel=()=>ruler=false;
function addFlag(type){stop();const t=state.frame;if(t===0||t>=duration||state.flags.some(f=>f.t===t)||type==='step'&&state.flags.some(f=>f.type==='out'&&f.t<t)){say('Choose a free frame after In and before the final Out.');return;}snap();state.flags.push({id:state.flags.length+1,type,t});state.flags.sort((a,b)=>a.t-b.t);if(type==='out'){q('nt-reverse-label').textContent=state.flags.some(f=>f.type==='step')?'Reverse entrances for all visible layers?':'Reverse the entrance animation?';q('nt-reverse').hidden=false;}else say('Step flag placed. Add a layer or snap a layer bar to this line.');render();}
q('nt-add-step').onclick=()=>addFlag('step');q('nt-add-out').onclick=()=>addFlag('out');
q('nt-yes').onclick=()=>{const out=state.flags.find(f=>f.type==='out');if(!out)return;snap();const staticLayers=[];let longest=0;for(const l of state.layers){if(l.start>=out.t||l.end<out.t)continue;let maxSpan=0;for(const p of ['x','opacity']){const entrance=l.keys[p].filter(k=>k.t<=out.t);if(entrance.length<2)continue;const last=entrance.at(-1).t,first=entrance[0].t,span=last-first;if(out.t+span>duration){say('This study has four seconds of space. Move Out earlier before generating reverse keys.');state=history.pop();render();return;}const reversed=entrance.map(k=>({t:out.t+last-k.t,v:k.v}));l.keys[p]=[...l.keys[p].filter(k=>k.t<out.t),...reversed].sort((a,b)=>a.t-b.t);maxSpan=Math.max(maxSpan,span);}if(!maxSpan)staticLayers.push(l);l.end=out.t+maxSpan;longest=Math.max(longest,maxSpan);}for(const l of staticLayers)l.end=out.t+longest;q('nt-reverse').hidden=true;render();say('Editable reversed Out keys created; static layers stay until exit end.');};
q('nt-no').onclick=()=>{q('nt-reverse').hidden=true;say('Out flag placed. No keyframes added; animate the exit on the timeline.');};
function play(from,to,endPhase){stop();state.phase='play';state.frame=from;const start=performance.now();function tick(now){state.frame=Math.min(to,Math.round(from+(now-start)*.025));if(state.frame===to)state.phase=endPhase;paint();if(state.frame<to)timer=requestAnimationFrame(tick);else say(endPhase==='hold'?'Paused at '+(state.flags.find(f=>f.t===to)?.type==='out'?'Out. Waiting for the Out command.':'Step. Waiting for Next.'):'Playback finished.');}timer=requestAnimationFrame(tick);}
q('nt-play').onclick=()=>play(0,state.flags[0]?.t??Math.max(...state.layers.flatMap(l=>Object.values(l.keys).flat().map(k=>k.t))),state.flags.length?'hold':'edit');q('nt-next').onclick=()=>{const here=state.flags.findIndex(f=>f.t===state.frame&&f.type==='step');if(here<0||state.phase!=='hold')return;const next=state.flags[here+1];play(state.frame,next?.t??Math.max(state.frame,...state.layers.flatMap(l=>Object.values(l.keys).flat().map(k=>k.t))),next?'hold':'edit');};q('nt-out').onclick=()=>{const out=state.flags.find(f=>f.type==='out');if(out)play(out.t,Math.max(out.t,...state.layers.map(l=>Math.max(out.t,...Object.values(l.keys).flat().filter(k=>k.t>=out.t).map(k=>k.t)))),'off');};q('nt-pause').onclick=()=>{stop();state.phase='edit';paint();};q('nt-frame').onchange=e=>seek(+e.target.value);
function addLayer(type){snap();const id=Math.max(...state.layers.map(l=>l.id))+1;state.layers.push({id,name:type==='text'?'Additional text':'New shape',type,text:'ELENA NIEMI · COAST NEWS',start:state.frame,end:100,y:455,w:type==='text'?610:220,h:45,base:{x:170,opacity:100},keys:{x:[],opacity:[]},open:true});state.selected=id;render();say('Layer added at the playhead. Drag its bar or edges to adjust timing.');}
q('nt-text-add').onclick=()=>addLayer('text');q('nt-shape-add').onclick=()=>addLayer('shape');q('nt-text').onchange=e=>{snap();selected().text=e.target.value;render();};q('nt-undo').onclick=()=>{stop();if(history.length){state=history.pop();q('nt-reverse').hidden=true;render();say('Previous edit restored.');}};q('nt-reset').onclick=()=>{stop();state=initial();history=[];q('nt-reverse').hidden=true;render();say('Entrance keys are ready. Add Out at the playhead.');};
const toolsBar=make('div','n-canvas-tools');toolsBar.id='nt-canvas-tools';for(const [tool,label] of [['select','Select'],['text','Text'],['shape','Rectangle'],['ellipse','Ellipse']]){const b=make('button','',label);b.dataset.tool=tool;b.onclick=()=>setTool(tool);toolsBar.append(b);}q('nt-svg').closest('.n-art-area').before(toolsBar);const scaleInfo=make('div','n-scale-readout');scaleInfo.id='nt-scale';q('nt-layer-span').after(scaleInfo);
function setTool(tool){activeTool=tool;toolsBar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===tool));q('nt-svg').style.cursor=tool==='select'?'default':'crosshair';}
q('nt-svg').addEventListener('pointerdown',e=>{if(activeTool==='select'||e.button!==0)return;e.preventDefault();stop();const pt=svgPoint(e),id=Math.max(...state.layers.map(l=>l.id))+1;const layer={id,name:activeTool==='text'?'Text '+id:activeTool==='ellipse'?'Ellipse '+id:'Rectangle '+id,type:activeTool,text:activeTool==='text'?'Your text':'',start:state.frame,end:100,y:pt.y,w:activeTool==='text'?280:1,h:activeTool==='text'?50:1,base:{x:pt.x,opacity:100},keys:{x:[],opacity:[]},open:true};if(activeTool==='text'){snap();state.layers.push(layer);state.selected=id;setTool('select');render();q('nt-text').focus();q('nt-text').select();}else{gesture={type:'draw',before:clone(state),origin:pt,layer,moved:false};root.setPointerCapture(e.pointerId);}});
